<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healer Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #eef2f0;
  --panel: #ffffff;
  --panel-2: #f6f8f7;
  --ink: #15201c;
  --ink-2: #4b5a54;
  --ink-3: #6f7e78;
  --line: #dce3e0;
  --grid: #e7ecea;
  --heal: #17996a;
  --heal-soft: #a6dcc5;
  --dmg: #d4562a;
  --dmg-soft: #f2bba5;
  --mana: #2f74d0;
  --focus: #2f74d0;
  --c3: #8b6fd6;
  --c4: #d19a2e;
  --c5: #2fa7b8;
  /* Spell school colours, close to the in-game combat log. */
  --school-physical: #c9a36a;
  --school-holy: #f2d35b;
  --school-fire: #f0612a;
  --school-nature: #3fbf4f;
  --school-frost: #5cb8f0;
  --school-shadow: #8e5bd9;
  --school-arcane: #e06bd8;
  --shadow: 0 1px 2px rgba(21, 32, 28, .06), 0 4px 16px rgba(21, 32, 28, .05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0f1513;
    --panel: #161e1b;
    --panel-2: #1b2522;
    --ink: #e6edea;
    --ink-2: #a9b7b1;
    --ink-3: #849390;
    --line: #26322e;
    --grid: #202b27;
    --heal: #27a574;
    --heal-soft: #1f5a45;
    --dmg: #e2683d;
    --dmg-soft: #6b3523;
    --mana: #4a8be3;
    --focus: #4a8be3;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1513;
  --panel: #161e1b;
  --panel-2: #1b2522;
  --ink: #e6edea;
  --ink-2: #a9b7b1;
  --ink-3: #849390;
  --line: #26322e;
  --grid: #202b27;
  --heal: #27a574;
  --heal-soft: #1f5a45;
  --dmg: #e2683d;
  --dmg-soft: #6b3523;
  --mana: #4a8be3;
  --focus: #4a8be3;
  --shadow: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1240px; margin: 0 auto; padding: 10px 24px;
  display: flex; align-items: center; gap: 24px;
}
.brand { font-weight: 700; white-space: nowrap; }
.brand span { color: var(--ink-3); font-weight: 500; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 14px;
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--panel); }
.nav a.active { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.theme-btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
}

main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
section { margin-top: 48px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head p { color: var(--ink-2); max-width: 70ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

/* ---------- matchup (hero) ---------- */
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: stretch; }
.side { padding: 24px 28px; position: relative; overflow: hidden; }
.side.healer { border-radius: 14px 0 0 14px; border-right: none; }
.side.boss { border-radius: 0 14px 14px 0; border-left: none; }
.side::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--heal); }
.side.boss::before { inset: 0 0 0 auto; background: var(--dmg); }
.side .role { font-size: 13px; font-weight: 600; color: var(--heal); }
.side.boss .role { color: var(--dmg); }
.side .name { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 4px; }
.side .sub { color: var(--ink-2); }
.diff {
  display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--dmg); border: 1px solid var(--dmg); border-radius: 999px; padding: 3px 10px;
  vertical-align: middle; margin-right: 12px; position: relative; top: -3px;
}
.side.boss { text-align: right; }
.vs {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 22px; background: var(--panel-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  min-width: 140px; text-align: center;
}
.vs .clock { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.vs .small { font-size: 12px; color: var(--ink-3); }
.outcome {
  display: inline-block; font-size: 14px; font-weight: 800; letter-spacing: .08em; padding: 4px 14px;
  border-radius: 999px; border: 1.5px solid currentColor; margin: 10px 0 4px;
}
.outcome.kill { color: var(--heal); }
.outcome.wipe { color: var(--dmg); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px 16px; margin-top: 18px; }
.kv div { min-width: 0; }
.kv dt { font-size: 12px; color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; font-size: 16px; }
.abilities { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
.abilities li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; }
.abilities li .who { color: var(--ink-3); font-size: 13px; }
.abilities li .amt { font-weight: 600; }
.side.boss .abilities li { text-align: left; }

/* ---------- verdict ---------- */
.verdict { margin-top: 20px; padding: 22px 28px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 28px; align-items: center; }
.verdict .lead { font-size: 20px; line-height: 1.45; font-weight: 500; }
.verdict .lead b { font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 24px; }
.stat .label { font-size: 13px; color: var(--ink-2); }
.stat .value { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.stat .note { font-size: 12px; color: var(--ink-3); }
.stat .value.heal { color: var(--heal); }
.stat .value.dmg { color: var(--dmg); }
.stat .value.mana { color: var(--mana); }
.activity { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 18px; }
.activity .act-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.activity .act-head b { color: var(--ink); font-weight: 700; }
.activity .bar { height: 14px; }
.activity .bar .idle { background: var(--grid); }

/* ---------- cause of death ---------- */
.death-grid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 20px; }
.causes { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.cause { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; align-items: center; font-size: 15px; }
.cause .track { grid-column: 1 / -1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.cause .fill { height: 100%; border-radius: 4px; }
.cause .pct { text-align: right; font-weight: 700; }
.cause .why { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); }
.verdict-line { font-size: 16px; line-height: 1.5; margin: 4px 0 10px; }
.verdict-line b { font-weight: 700; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; margin: 0 6px 4px 0; border: 1px solid currentColor; }
.kb { color: var(--dmg); font-weight: 700; font-size: 12px; margin-left: 6px; }
.chart .idle-band { fill: var(--ink-3); }

/* ---------- raid frames ---------- */
.rf-panel { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.rf-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.rf-bar h3 { white-space: nowrap; }
.rf-deaths { display: flex; flex-wrap: wrap; gap: 6px; }
.rf-death {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  position: relative; overflow: hidden;
  width: 70px; height: 48px; padding: 3px 4px 0; border-radius: 6px; cursor: pointer;
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  font: inherit; line-height: 1.1;
}
/* One segment per death in the square, in its role colour. */
.rf-death .roles { position: absolute; top: 0; left: 0; right: 0; height: 4px; display: flex; gap: 1px; }
.rf-death .roles i { flex: 1; }
.rf-death .t { font-weight: 700; font-size: 13px; }
.rf-death .n { font-size: 11px; color: var(--ink-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-death:hover { border-color: var(--rc); }
.rf-death[aria-pressed="true"] { background: var(--rc); color: var(--bg); }
.rf-death[aria-pressed="true"] .n { color: var(--bg); }
/* Fixed widths and heights so nothing around the slider moves while dragging. */
.rf-scrubrow { flex-wrap: nowrap; }
.rf-time { font-weight: 800; font-size: 20px; width: 76px; flex: none; font-variant-numeric: tabular-nums; }
#rfScrub { flex: 1; min-width: 0; accent-color: var(--heal); }
.rf-sum { font-size: 14px; color: var(--ink-2); min-height: 2.8em; line-height: 1.4; }
.rf-sum b { color: var(--ink); }
.rf-group { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: start; margin-top: 4px; }
.rf-glabel { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding-top: 14px; }
.rf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; }
.uf {
  position: relative; height: 52px; border-radius: 4px; overflow: hidden; cursor: default;
  background: color-mix(in srgb, var(--dmg) 18%, var(--panel-2)); border: 1px solid var(--line);
}
.uf.self { outline: 2px solid var(--ink-2); outline-offset: -2px; }
.uf-hp { position: absolute; inset: 0 auto 0 0; opacity: .85; }
.uf [hidden] { display: none; }
.uf-abs { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 3px, rgba(255,255,255,.15) 3px 6px); }
.uf-name, .uf-pct { position: absolute; left: 6px; right: 6px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uf-name { top: 4px; }
.uf-pct { top: 19px; font-weight: 600; font-size: 11px; }
.uf-fx { position: absolute; left: 4px; right: 4px; bottom: 3px; display: flex; gap: 2px; justify-content: flex-end; }
/* HoT timers: coloured square, seconds left with a dark outline so the number reads on any colour. */
.uf-fx i {
  font-style: normal; font-size: 12px; font-weight: 800; color: #fff; width: 19px; height: 17px; line-height: 17px;
  text-align: center; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.6);
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 2px #000;
}
.rf-legend i { border-radius: 3px; }
.uf.dead { background: var(--panel-2); }
.uf.dying { outline: 2px solid var(--dmg); outline-offset: -2px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--dmg) 40%, transparent); animation: uf-pulse 1.1s ease-in-out 3; }
.uf.dying .uf-name, .uf.dying .uf-pct { color: var(--dmg); }
.uf-died { position: absolute; top: 4px; right: 4px; z-index: 2; font-size: 9px; font-weight: 800; letter-spacing: .06em; color: #fff; background: var(--dmg); border-radius: 3px; padding: 1px 5px; }
.rf-died { color: var(--dmg); }
.rf-died b { color: var(--dmg); }
@keyframes uf-pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--dmg) 15%, transparent); } }
@media (prefers-reduced-motion: reduce) { .uf.dying { animation: none; } }
.uf.dead .uf-name, .uf.dead .uf-pct { color: var(--ink-3); text-shadow: none; }
@media (max-width: 600px) { .rf-group { grid-template-columns: 1fr; } .rf-glabel { padding-top: 0; } }

/* ---------- activity charts ---------- */
.act-grid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 20px; }
.donut-panel { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.donut { position: relative; width: 200px; max-width: 100%; margin: 4px auto 0; }
.donut svg { display: block; width: 100%; height: auto; }
.donut circle.seg-arc { transition: stroke-width .15s; cursor: default; }
.donut circle.seg-arc:hover { stroke-width: 26; }
.donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut .center .big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.donut .center .lbl { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.act-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.act-legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 44px; gap: 10px; align-items: center; }
.act-legend i { width: 12px; height: 12px; border-radius: 3px; }
.act-legend .t { color: var(--ink-3); font-size: 14px; }
.act-legend .p { text-align: right; font-weight: 600; }
.chart .col-track { fill: var(--grid); }
.chart .col-fill { fill: var(--heal); transition: opacity .1s; }
.chart .col.dim .col-fill { opacity: .45; }

/* ---------- charts ---------- */
.chart-panel { padding: 18px 20px 14px; }
.chart-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 12px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--line); stroke-width: 1; }
.chart .marker line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .marker text { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.chart .crosshair { stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
.chart .lane-label { fill: var(--ink-2); font-size: 13px; }
.chart .tick-mark { fill: var(--heal); }
.chart .tick-mark.dmg { fill: var(--dmg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel-2); }
.seg button { border: 0; background: none; font: inherit; font-size: 13px; color: var(--ink-2); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.tooltip {
  position: fixed; z-index: 50; pointer-events: none; min-width: 160px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none;
}
.tooltip .t-head { font-weight: 700; margin-bottom: 4px; }
.tooltip .t-row { display: flex; justify-content: space-between; gap: 16px; }
.tooltip .t-row span:first-child { color: var(--ink-2); }
.tooltip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* ---------- breakdown rows ---------- */
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.breakdown { padding: 8px 0; }
.bd-head, .bd-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) 100px; gap: 18px; align-items: center; padding: 12px 22px; font-size: 16px; }
.bd-head { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); padding-top: 6px; padding-bottom: 6px; }
.bd-head span:last-child { text-align: right; }
.bd-row { border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; font: inherit; color: inherit; }
.bd-row:hover { background: var(--panel-2); }
.bd-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-row .meta { font-size: 14px; margin-top: 2px; color: var(--ink-3); }
.bd-row .num { text-align: right; font-weight: 700; }
.bd-row .num small { display: block; font-weight: 500; color: var(--ink-3); font-size: 13px; }
.bar { display: flex; gap: 2px; height: 12px; }
.bar span { height: 100%; border-radius: 0; }
.bar span:first-child { border-radius: 4px 0 0 4px; }
.bar span:last-child { border-radius: 0 4px 4px 0; }
.bar span:only-child { border-radius: 4px; }
.bar .eff { background: var(--heal); }
.bar .over { background: var(--heal-soft); }
.bar .dmg { background: var(--dmg); }
.chev { color: var(--ink-3); transition: transform .15s; display: inline-block; margin-right: 6px; }
.bd-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.bd-detail { display: none; padding: 4px 20px 16px 40px; background: var(--panel-2); }
.bd-detail.open { display: block; }
.bd-detail table { width: 100%; border-collapse: collapse; font-size: 15px; }
.bd-detail th { text-align: right; font-weight: 500; color: var(--ink-3); padding: 6px 8px; }
.bd-detail th:first-child, .bd-detail td:first-child { text-align: left; }
.bd-detail td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--line); }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.school-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.school-legend i { display: inline-block; width: 22px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.school { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); margin-left: 6px; vertical-align: 1px; }

/* ---------- buffs ---------- */
.uptimes { padding: 8px 20px 16px; display: grid; gap: 10px; }
.up { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 52px; gap: 14px; align-items: center; font-size: 15px; }
.up .track { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.up .fill { height: 100%; background: var(--mana); border-radius: 4px; }
.up .pct { text-align: right; font-weight: 600; }

/* ---------- details ---------- */
details.panel { padding: 0; }
details.panel > summary { cursor: pointer; padding: 16px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "Show"; color: var(--ink-3); font-weight: 500; font-size: 13px; }
details.panel[open] > summary::after { content: "Hide"; }
details.panel + details.panel { margin-top: 12px; }
.detail-body { padding: 0 20px 20px; }
.gear { width: 100%; border-collapse: collapse; font-size: 15px; }
.gear td { padding: 8px 0; border-top: 1px solid var(--line); }
.gear td:first-child { color: var(--ink-3); width: 140px; text-transform: capitalize; }
.gear td:last-child { text-align: right; font-weight: 600; width: 60px; }
code.block { display: block; padding: 12px; background: var(--panel-2); border-radius: 8px; font-size: 13px; word-break: break-all; color: var(--ink-2); }
.empty { padding: 24px 20px; color: var(--ink-2); }
.footer { margin-top: 56px; color: var(--ink-3); font-size: 13px; }

@media (max-width: 900px) {
  .matchup { grid-template-columns: 1fr; }
  .side.healer, .side.boss { border-radius: 14px; border: 1px solid var(--line); }
  .side.boss { text-align: left; }
  .side.boss::before { inset: 0 auto 0 0; }
  .vs { flex-direction: row; gap: 12px; border: 0; background: none; padding: 12px 0; }
  .verdict { grid-template-columns: 1fr; }
  .two-col, .act-grid, .death-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
  .brand span { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .side .name { font-size: 28px; }
  .bd-head, .bd-row { grid-template-columns: minmax(0, 1fr) 80px; }
  .bd-head span:nth-child(2), .bd-row .barcell { display: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand">Healer report</div>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#summary">Summary</a>
      <a href="#timeline">Timeline</a>
      <a href="#activity">Activity</a>
      <a href="#healing">Healing</a>
      <a href="#damage">Damage taken</a>
      <a href="#mana">Mana &amp; buffs</a>
      <a href="#details">Details</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button">Theme</button>
  </div>
</header>

<main id="app"></main>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script id="simc-data" type="application/json">__SIMC_DATA__</script>
<script>
(function () {
"use strict";

// ---------------------------------------------------------------- helpers
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, html = "") => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (html) n.innerHTML = html;
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mean = v => (v == null ? 0 : typeof v === "number" ? v : (v.mean ?? 0));
const series = t => (t == null ? [] : Array.isArray(t) ? t : (t.data || []));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

function fmtNum(n, digits = 1) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(digits) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(digits) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e5 ? 0 : digits) + "k";
  return Math.round(n).toString();
}
const fmtPct = (p, d = 0) => (isFinite(p) ? (p * 100).toFixed(d) + "%" : "–");
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}
function prettyName(n) {
  return String(n || "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
// Multi-school spells are drawn as a blend of their component schools (SimC school names).
const SCHOOL_PARTS = {
  astral: ["arcane", "nature"], frostfire: ["frost", "fire"], holystrike: ["holy", "physical"],
  flamestrike: ["fire", "physical"], holyfire: ["holy", "fire"], stormstrike: ["nature", "physical"],
  holystorm: ["holy", "nature"], firestorm: ["fire", "nature"], froststrike: ["frost", "physical"],
  holyfrost: ["holy", "frost"], froststorm: ["frost", "nature"], shadowstrike: ["shadow", "physical"],
  shadowlight: ["shadow", "holy"], shadowflame: ["shadow", "fire"], shadowstorm: ["shadow", "nature"],
  shadowfrost: ["shadow", "frost"], spellstrike: ["arcane", "physical"], divine: ["arcane", "holy"],
  spellfire: ["arcane", "fire"], spellfrost: ["arcane", "frost"], spellshadow: ["arcane", "shadow"],
  elemental: ["fire", "frost", "nature"],
  cosmic: ["holy", "nature", "frost", "shadow", "arcane"],
  chromatic: ["fire", "frost", "nature", "shadow", "arcane"],
  chromastrike: ["physical", "fire", "frost", "nature", "shadow", "arcane"],
  magic: ["holy", "fire", "nature", "frost", "shadow", "arcane"],
  chaos: ["physical", "holy", "fire", "nature", "frost", "shadow", "arcane"],
};
const BASE_SCHOOLS = ["physical", "holy", "fire", "nature", "frost", "shadow", "arcane"];
const schoolParts = s => (BASE_SCHOOLS.includes(s) ? [s] : SCHOOL_PARTS[s] || []);
function schoolPaint(s) {
  const c = schoolParts(s).map(p => `var(--school-${p})`);
  if (!c.length) return "var(--dmg)";
  return c.length === 1 ? c[0] : `linear-gradient(90deg, ${c.join(", ")})`;
}
const schoolDot = s => (s ? `<i class="sdot" style="background:${schoolPaint(s)}" aria-hidden="true"></i>` : "");

function movingAvg(arr, w) {
  if (w <= 1) return arr.slice();
  const out = new Array(arr.length);
  let acc = 0;
  for (let i = 0; i < arr.length; i++) {
    acc += arr[i];
    if (i >= w) acc -= arr[i - w];
    out[i] = acc / Math.min(i + 1, w);
  }
  return out;
}

// ---------------------------------------------------------------- theme
const root = document.documentElement;
const themeBtn = $("#themeBtn");
function currentTheme() {
  return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function setThemeLabel() { themeBtn.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode"; }
// Dark by default; the toggle can still switch to light and is remembered.
root.dataset.theme = "dark";
try { const saved = localStorage.getItem("simc-healer-theme"); if (saved) root.dataset.theme = saved; } catch (e) {}
setThemeLabel();
themeBtn.addEventListener("click", () => {
  root.dataset.theme = currentTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem("simc-healer-theme", root.dataset.theme); } catch (e) {}
  setThemeLabel();
});

// ---------------------------------------------------------------- data
let data;
try {
  data = JSON.parse($("#simc-data").textContent);
} catch (e) {
  $("#app").innerHTML = '<div class="panel empty">This report has no simulation data. Generate it with build_healer_report.ps1 and a SimC JSON file.</div>';
  return;
}
const sim = data.sim || {};
const players = sim.players || [];
// The healer under test: whoever recorded raid frames, else the first real (non stand-in) healer.
// Stand-in raid members have race "none".
const isStandIn = p => p.race === "none";
const healer = players.find(p => p.collected_data?.raid_frames)
  || players.find(p => p.role === "heal" && !isStandIn(p)) || players.find(p => p.role === "heal") || players[0];
if (!healer) {
  $("#app").innerHTML = '<div class="panel empty">The simulation has no players to report on.</div>';
  return;
}
// Everyone else in the sim: stand-in raid members (raid_members=<n>) or other real players.
const raidMembers = players.filter(p => p !== healer);
const targets = sim.targets || [];
const boss = targets.find(t => t.class === "Boss") || targets[0] || null;
const cd = healer.collected_data || {};
const fightLen = mean(cd.fight_length) || sim.options?.max_time || 1;
const iterations = cd.total_iterations || sim.options?.iterations || 0;

// SimC often leaves buffed_stats empty; the cast log records max resources at each cast instead.
const seqMax = r => Math.max(0, ...(cd.action_sequence || []).map(e => e.resources_max?.[r] || 0));
const maxHealth = mean(cd.buffed_stats?.resources?.health) || seqMax("health");
const maxMana = mean(cd.buffed_stats?.resources?.mana) || seqMax("mana");

// Flatten a stats entry and its children into one record.
function collectStat(s) {
  const parts = [s, ...(s.children || [])];
  let eff = 0, raw = 0, dEff = 0, dRaw = 0, tEff = 0, tRaw = 0, dCount = 0, tCount = 0, dCrit = 0, tCrit = 0;
  for (const p of parts) {
    eff += mean(p.actual_amount);
    raw += mean(p.total_amount);
    for (const [res, r] of Object.entries(p.direct_results || {})) {
      dEff += mean(r.fight_actual_amount); dRaw += mean(r.fight_total_amount);
      dCount += mean(r.count); if (/crit/i.test(res)) dCrit += mean(r.count);
    }
    for (const [res, r] of Object.entries(p.tick_results || {})) {
      tEff += mean(r.fight_actual_amount); tRaw += mean(r.fight_total_amount);
      tCount += mean(r.count); if (/crit/i.test(res)) tCrit += mean(r.count);
    }
  }
  return {
    name: s.name, label: s.spell_name || prettyName(s.name), school: s.school, type: s.type,
    casts: mean(s.num_executes), eff, raw, over: Math.max(0, raw - eff),
    direct: { eff: dEff, raw: dRaw, count: dCount, crit: dCrit },
    tick: { eff: tEff, raw: tRaw, count: tCount, crit: tCrit },
  };
}

const healStats = (healer.stats || [])
  .filter(s => s.type === "heal" || s.type === "absorb")
  .map(collectStat).filter(s => s.raw > 0)
  .sort((a, b) => b.eff - a.eff);
const totalEff = sum(healStats.map(s => s.eff));
const totalRaw = sum(healStats.map(s => s.raw));
const overPct = totalRaw ? 1 - totalEff / totalRaw : 0;
const hps = mean(cd.hps) || totalEff / fightLen;

// Incoming damage: everything the encounter (boss + its adds) dealt.
const dmgSources = [];
if (boss) {
  for (const s of boss.stats || []) if (s.type === "damage") dmgSources.push({ ...collectStat(s), source: boss.name });
  for (const [petName, list] of Object.entries(boss.stats_pets || {})) {
    for (const s of list || []) if (s.type === "damage") dmgSources.push({ ...collectStat(s), source: prettyName(petName) });
  }
}
// Merge identical abilities from multiple adds (e.g. three Burning Venoms).
const dmgMap = new Map();
for (const d of dmgSources) {
  const key = d.label + "|" + d.source.replace(/\s*\d+$/, "");
  const cur = dmgMap.get(key);
  if (!cur) dmgMap.set(key, { ...d, source: d.source.replace(/\s*\d+$/, ""), sources: 1 });
  else {
    cur.eff += d.eff; cur.raw += d.raw; cur.casts += d.casts; cur.sources += 1;
    cur.direct.count += d.direct.count; cur.tick.count += d.tick.count;
    cur.direct.eff += d.direct.eff; cur.tick.eff += d.tick.eff;
    cur.direct.raw += d.direct.raw; cur.tick.raw += d.tick.raw;
    cur.direct.crit += d.direct.crit; cur.tick.crit += d.tick.crit;
  }
}
const dmgStats = [...dmgMap.values()].filter(d => d.eff > 0).sort((a, b) => b.eff - a.eff);
const totalDmg = sum(dmgStats.map(d => d.eff));
// SimC writes total damage taken per fight into "dtps", so convert to per second.
const dtps = (mean(cd.dtps) || totalDmg) / fightLen;

const healthTL = series(cd.resource_timelines?.health_pct).length
  ? series(cd.resource_timelines.health_pct)
  : series(cd.resource_timelines?.health).map(v => (maxHealth ? (v / maxHealth) * 100 : 0));
const manaTL = series(cd.resource_timelines?.mana);
const dmgTakenTL = series(cd.timeline_dmg_taken);
const healTakenTL = series(cd.timeline_healing_taken);
// SimC's deaths entry holds the time of death: count is how many fights ended in death, mean is when.
// fight_length.count is the real number of fights run (can exceed the requested iterations).
const deathCount = cd.deaths?.count ?? null;
const fightsRun = cd.fight_length?.count || iterations || 1;
const deathRate = deathCount != null ? Math.min(1, deathCount / fightsRun) : null;
const deathTime = deathCount ? mean(cd.deaths) : null;
// With infinite health (SimC's default) health can go negative, so floor it at 0.
const lowestHealth = healthTL.length ? Math.max(0, Math.min(...healthTL.slice(1))) : null;
const endMana = mean(cd.combat_end_resource?.mana);
const manaSpent = mean(cd.resource_lost?.mana);
// waiting_time is how long the actor had nothing to do; the rest of the fight it was casting or on GCD.
const idleTime = cd.waiting_time != null ? Math.min(fightLen, mean(cd.waiting_time)) : null;
const activeTime = idleTime != null ? fightLen - idleTime : null;
const castCount = mean(cd.executed_foreground_actions);

// ---------------------------------------------------------------- tooltip
const tip = $("#tooltip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------------------------------------------------------------- render
const app = $("#app");
const healerName = healer.name;
const bossName = boss ? boss.name : "Encounter";
// Only boss encounters (encounter=<name>) write a difficulty; plain enemy= sims have none.
const difficulty = sim.options?.encounter_difficulty ? prettyName(sim.options.encounter_difficulty) : "";
const bossTitle = bossName + (difficulty ? " (" + difficulty + ")" : "");
document.title = healerName + " vs " + bossTitle;
$("#brand").innerHTML = esc(healerName) + " <span>vs " + esc(bossTitle) + "</span>";

// ----- matchup
const st = cd.buffed_stats?.stats || {};
const attrs = cd.buffed_stats?.attribute || {};
const gearList = Object.entries(healer.gear || {});
const ilvls = gearList.map(([, g]) => g.ilevel).filter(Boolean);
const avgIlvl = ilvls.length ? sum(ilvls) / ilvls.length : 0;
const classLabel = prettyName(healer.class || "");
const specRaw = prettyName(healer.specialization || "");
// SimC may already include the class in the spec name ("Restoration Druid").
const specLabel = classLabel && specRaw.toLowerCase().includes(classLabel.toLowerCase()) ? specRaw : (specRaw + " " + classLabel).trim();

const gearSum = keyTest => sum(gearList.map(([, g]) => sum(Object.entries(g).filter(([k, v]) => typeof v === "number" && keyTest(k)).map(([, v]) => v))));
const hasBuffed = st.crit_pct != null;
const healerKV = hasBuffed ? [
  ["Item level", avgIlvl ? String(Math.round(avgIlvl * 10) / 10) : "–"],
  ["Intellect", attrs.intellect ? fmtNum(attrs.intellect) : "–"],
  ["Crit", (st.crit_pct * 100).toFixed(1) + "%"],
  ["Haste", st.haste_pct != null ? (st.haste_pct * 100).toFixed(1) + "%" : "–"],
  ["Mastery", st.mastery_pct != null ? (st.mastery_pct * 100).toFixed(1) + "%" : "–"],
  ["Versatility", st.versatility_pct != null ? (st.versatility_pct * 100).toFixed(1) + "%" : "–"],
] : [
  // Without buffed stats in the JSON, show what the gear itself provides.
  ["Item level", avgIlvl ? String(Math.round(avgIlvl * 10) / 10) : "–"],
  ["Intellect (gear)", fmtNum(gearSum(k => k === "intellect" || /int$/.test(k)))],
  ["Crit rating", fmtNum(gearSum(k => k === "crit_rating"))],
  ["Haste rating", fmtNum(gearSum(k => k === "haste_rating"))],
  ["Mastery rating", fmtNum(gearSum(k => k === "mastery_rating"))],
  ["Versatility rating", fmtNum(gearSum(k => k === "versatility_rating"))],
];

const bossAbilities = dmgStats.slice(0, 5).map(d => `
  <li><span><span>${schoolDot(d.school)}${esc(d.label)}</span><br><span class="who">${esc(d.source)}${d.sources > 1 ? " ×" + d.sources : ""}</span></span>
  <span class="amt">${fmtPct(totalDmg ? d.eff / totalDmg : 0)}</span></li>`).join("");

// Encounter sims count wipes (every player died). The rest reached the end of the encounter, which is a kill:
// boss health is a placeholder and the fight length is the real kill time.
const encFights = sim.statistics?.encounter_fights || 0;
const encWipes = sim.statistics?.encounter_wipes ?? null;
let outcomeBadge = "";
if (encFights && encWipes != null) {
  const wipeRate = encWipes / encFights;
  const wipe = wipeRate >= 0.5;
  outcomeBadge = `<div class="outcome ${wipe ? "wipe" : "kill"}">${wipe ? "WIPE" : "KILL"}</div>
    <div class="small">${wipe ? `Wiped in ${fmtPct(wipeRate)}` : `Killed in ${fmtPct(1 - wipeRate)}`} of fights</div>`;
}

const matchup = el("section", { id: "summary", "aria-label": "Matchup" });
matchup.style.marginTop = "0";
matchup.innerHTML = `
  <div class="matchup">
    <div class="panel side healer">
      <div class="role">Healer</div>
      <h1 class="name">${esc(healerName)}</h1>
      <div class="sub">${esc(prettyName(String(healer.race || "").replace(/_(horde|alliance)$/, "")))} ${esc(specLabel)}, level ${esc(healer.level)}</div>
      <dl class="kv">${healerKV.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </div>
    <div class="vs">
      <div class="small">Fight length</div>
      <div class="clock">${fmtTime(fightLen)}</div>
      <div class="small">${(encFights || iterations) ? (encFights || iterations).toLocaleString() + " fights simulated" : ""}</div>
      ${outcomeBadge}
    </div>
    <div class="panel side boss">
      <div class="role">Encounter</div>
      <h1 class="name">${difficulty ? `<span class="diff">${esc(difficulty)}</span>` : ""}${esc(bossName)}</h1>
      <div class="sub">${dmgStats.length} damaging abilities, ${fmtNum(totalDmg)} damage per fight${raidMembers.length ? " to the raid" : ""}</div>
      ${bossAbilities ? `<ul class="abilities">${bossAbilities}</ul>` : ""}
    </div>
  </div>`;
app.appendChild(matchup);

// ----- verdict
const survived = deathCount != null
  ? (deathCount > 0 ? `died in <b>${fmtPct(deathRate)}</b> of fights, on average at ${fmtTime(deathTime)}` : "survived every fight")
  : null;
const leadParts = [`You healed <b>${fmtNum(hps)} per second</b>`];
leadParts.push(`and <b>${fmtPct(overPct)}</b> of it was overhealing`);
let lead = leadParts.join(" ") + ".";
if (dtps) lead += ` The encounter dealt <b>${fmtNum(dtps)} damage per second</b>.`;
if (survived) lead += ` You ${survived}.`;
if (activeTime != null) lead += ` You were casting for <b>${fmtPct(activeTime / fightLen)}</b> of the fight.`;

const statCells = [
  { label: "Effective healing per second", value: fmtNum(hps), cls: "heal", note: fmtNum(totalEff) + " per fight" },
  { label: "Overhealing", value: fmtPct(overPct), cls: "", note: fmtNum(totalRaw - totalEff) + " wasted per fight" },
  { label: "Damage taken per second", value: dtps ? fmtNum(dtps) : "–", cls: "dmg", note: totalDmg ? fmtNum(totalDmg) + " per fight" : "" },
  { label: "Lowest health", value: lowestHealth != null ? lowestHealth.toFixed(0) + "%" : "–", cls: "", note: "averaged across fights" },
  { label: "Deaths", value: deathRate != null ? fmtPct(deathRate) : "–", cls: deathCount ? "dmg" : "",
    note: deathCount ? `of fights, on average at ${fmtTime(deathTime)}` : deathRate != null ? "of fights" : "not in this report" },
  { label: "Mana left at the end", value: maxMana && endMana != null ? fmtPct(endMana / maxMana) : "–", cls: "mana", note: manaSpent ? fmtNum(manaSpent) + " spent per fight" : "" },
];
const verdict = el("div", { class: "panel verdict" });
verdict.innerHTML = `
  <p class="lead">${lead}</p>
  <div class="stats">${statCells.map(s => `
    <div class="stat"><div class="label">${s.label}</div><div class="value ${s.cls}">${s.value}</div><div class="note">${s.note}</div></div>`).join("")}
  </div>
  ${activeTime != null ? `
  <div class="activity">
    <div class="act-head">
      <span><b>Casting ${fmtPct(activeTime / fightLen)}</b> (${fmtTime(activeTime)}${castCount ? ", " + Math.round(castCount) + " casts" : ""})</span>
      <span><b>Idle ${fmtPct(idleTime / fightLen)}</b> (${fmtTime(idleTime)} with nothing to do)</span>
    </div>
    <div class="bar" role="img" aria-label="Casting ${fmtPct(activeTime / fightLen)}, idle ${fmtPct(idleTime / fightLen)}">
      ${activeTime > 0 ? `<span class="eff" style="width:${(activeTime / fightLen) * 100}%"></span>` : ""}${idleTime > 0 ? `<span class="idle" style="width:${(idleTime / fightLen) * 100}%"></span>` : ""}
    </div>
  </div>` : ""}`;
matchup.appendChild(verdict);

// ---------------------------------------------------------------- chart engine
// A set of vertically stacked panels sharing one time axis and one crosshair.
function timeChart(container, panels, opts = {}) {
  const pad = { l: 56, r: 16, t: 8, b: 26 };
  const gap = 18;
  const n = Math.max(...panels.map(p => p.length || 0), 1);
  const totalH = sum(panels.map(p => p.height)) + gap * (panels.length - 1) + pad.t + pad.b;
  const svg = svgEl("svg", { role: "img", "aria-label": opts.label || "Chart" });
  container.innerHTML = "";
  container.appendChild(svg);

  function draw() {
    const W = Math.max(container.clientWidth, 320);
    svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);
    svg.setAttribute("height", totalH);
    svg.innerHTML = "";
    const x = i => pad.l + (i / Math.max(n - 1, 1)) * (W - pad.l - pad.r);
    let top = pad.t;
    const layout = [];
    for (const p of panels) {
      const h = p.height;
      const maxV = p.yMax ?? Math.max(1, ...p.series.flatMap(s => s.values)) * 1.08;
      const y = v => top + h - (v / maxV) * h;
      layout.push({ p, top, h, y, maxV });
      // grid + y labels
      const ticks = p.yTicks || [0, maxV / 2, maxV];
      for (const t of ticks) {
        svg.appendChild(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(t), y2: y(t), class: t === 0 ? "baseline" : "gridline" }));
        const lab = svgEl("text", { x: pad.l - 8, y: y(t) + 4, "text-anchor": "end" });
        lab.textContent = p.yFormat ? p.yFormat(t) : fmtNum(t);
        svg.appendChild(lab);
      }
      // series
      for (const s of p.series) {
        const vals = s.values;
        if (!vals.length) continue;
        let d = "";
        vals.forEach((v, i) => { d += (i ? "L" : "M") + x(i).toFixed(1) + "," + y(Math.min(v, maxV)).toFixed(1); });
        if (s.kind === "area") {
          const area = d + `L${x(vals.length - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
          svg.appendChild(svgEl("path", { d: area, style: `fill:${s.color};fill-opacity:${s.opacity ?? 0.18};stroke:none` }));
        }
        svg.appendChild(svgEl("path", { d, style: `fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round` }));
      }
      if (p.title) {
        const tt = svgEl("text", { x: pad.l + 6, y: top + 13, class: "lane-label" });
        tt.textContent = p.title;
        svg.appendChild(tt);
      }
      top += h + gap;
    }
    // markers spanning all panels
    const bottom = top - gap;
    for (const m of opts.markers || []) {
      const mx = x(m.time / fightLen * (n - 1));
      const g = svgEl("g", { class: "marker" });
      g.appendChild(svgEl("line", { x1: mx, x2: mx, y1: pad.t, y2: bottom }));
      svg.appendChild(g);
    }
    // x axis
    const step = fightLen > 240 ? 60 : fightLen > 90 ? 30 : 10;
    for (let s = 0; s <= fightLen + 0.01; s += step) {
      const lab = svgEl("text", { x: x(s / fightLen * (n - 1)), y: bottom + 18, "text-anchor": "middle" });
      lab.textContent = fmtTime(s);
      svg.appendChild(lab);
    }
    // crosshair + hit area
    const cross = svgEl("line", { class: "crosshair", y1: pad.t, y2: bottom, x1: -10, x2: -10, visibility: "hidden" });
    svg.appendChild(cross);
    const dots = layout.flatMap(L => L.p.series.map(s => {
      const c = svgEl("circle", { r: 4, style: `fill:${s.color};stroke:var(--panel);stroke-width:2`, visibility: "hidden" });
      svg.appendChild(c);
      return { c, s, L };
    }));
    const hit = svgEl("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: bottom - pad.t, fill: "transparent" });
    svg.appendChild(hit);
    hit.addEventListener("pointermove", ev => {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) * (W / box.width);
      const i = Math.round(((px - pad.l) / (W - pad.l - pad.r)) * (n - 1));
      if (i < 0 || i >= n) return;
      const cx = x(i);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
      let rows = "";
      for (const { c, s, L } of dots) {
        const v = s.values[i];
        if (v == null) { c.setAttribute("visibility", "hidden"); continue; }
        c.setAttribute("cx", cx); c.setAttribute("cy", L.y(Math.min(v, L.maxV))); c.setAttribute("visibility", "visible");
        rows += `<div class="t-row"><span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}</span><span>${L.p.yFormat ? L.p.yFormat(v) : fmtNum(v)}</span></div>`;
      }
      const t = i / Math.max(n - 1, 1) * fightLen;
      const near = (opts.markers || []).filter(m => Math.abs(m.time - t) <= Math.max(1.5, fightLen / n)).map(m => `<div class="t-row"><span>${esc(m.label)}</span><span>cast</span></div>`).join("");
      showTip(`<div class="t-head">${fmtTime(t)}</div>${rows}${near}`, ev.clientX, ev.clientY);
    });
    hit.addEventListener("pointerleave", () => {
      cross.setAttribute("visibility", "hidden");
      dots.forEach(d => d.c.setAttribute("visibility", "hidden"));
      hideTip();
    });
  }
  draw();
  new ResizeObserver(() => draw()).observe(container);
  return { redraw: draw };
}

// Swimlanes of discrete events (casts) on the same time axis.
function laneChart(container, lanes, opts = {}) {
  const pad = { l: 150, r: 16, t: 4, b: 24 };
  const narrow = () => container.clientWidth < 520;
  const laneH = 26;
  const H = pad.t + pad.b + lanes.length * laneH;
  const svg = svgEl("svg", { role: "img", "aria-label": opts.label || "Casts" });
  container.innerHTML = "";
  container.appendChild(svg);
  function draw() {
    const W = Math.max(container.clientWidth, 320);
    pad.l = narrow() ? 100 : 150;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    svg.innerHTML = "";
    const len = opts.length || fightLen;
    const x = t => pad.l + (t / len) * (W - pad.l - pad.r);
    lanes.forEach((lane, li) => {
      const y0 = pad.t + li * laneH;
      if (li) svg.appendChild(svgEl("line", { x1: 0, x2: W - pad.r, y1: y0, y2: y0, class: "gridline" }));
      const lab = svgEl("text", { x: 0, y: y0 + laneH / 2 + 4, class: "lane-label" });
      const maxCh = narrow() ? 14 : 22;
      lab.textContent = lane.label.length > maxCh ? lane.label.slice(0, maxCh - 1) + "…" : lane.label;
      svg.appendChild(lab);
      for (const t of lane.times) {
        const r = svgEl("rect", { x: x(t) - 1.5, y: y0 + 6, width: 3, height: laneH - 12, rx: 1.5, class: "tick-mark" + (lane.dmg ? " dmg" : "") });
        svg.appendChild(r);
        const hitR = svgEl("rect", { x: x(t) - 5, y: y0, width: 10, height: laneH, fill: "transparent" });
        hitR.addEventListener("pointermove", ev => showTip(`<div class="t-head">${esc(lane.label)}</div><div class="t-row"><span>Cast at</span><span>${fmtTime(t)}</span></div>`, ev.clientX, ev.clientY));
        hitR.addEventListener("pointerleave", hideTip);
        svg.appendChild(hitR);
      }
    });
    const bottom = pad.t + lanes.length * laneH;
    const step = len > 240 ? 60 : len > 90 ? 30 : 10;
    for (let s = 0; s <= len + 0.01; s += step) {
      const lab = svgEl("text", { x: x(s), y: bottom + 16, "text-anchor": "middle" });
      lab.textContent = fmtTime(s);
      svg.appendChild(lab);
    }
  }
  draw();
  new ResizeObserver(() => draw()).observe(container);
}

// Needs death_recap=<seconds> on the player; SimC then exports what happened before each death.
const recaps = cd.death_recaps || [];

// Rules that name a cause of death. Interpretation, not fact: tune freely, no rebuild needed.
const DEATH_RULES = {
  burstSeconds: 5,      // burst: health was still at least burstFromHealth of max this many seconds before death
  burstFromHealth: 0.6,
  oomShare: 0.05,       // out of mana: mana below this share of max...
  oomLeadSeconds: 3,    // ...at least this many seconds before death
  idleShare: 0.25,      // idle: waiting for at least this share of the window while damage beat healing
};
const CAUSES = {
  burst: { label: "Burst damage", color: "var(--dmg)",
    why: `Healthy ${DEATH_RULES.burstSeconds}s before death, then killed by a spike. Usually overlapping damage or a missing defensive.` },
  oom: { label: "Out of mana", color: "var(--mana)",
    why: "Mana ran out before the drop, so the healing stopped. A mana or rotation problem." },
  idle: { label: "Idle while dropping", color: "var(--c4)",
    why: "Spent a large share of the last seconds not casting while losing health. A rotation (APL) problem." },
  attrition: { label: "Not enough healing", color: "var(--c3)",
    why: "Damage outpaced healing over the whole window. Needs more healing, from you or the raid." },
};

const sourceLabel = src => {
  let s = String(src || "");
  if (boss && s.startsWith(boss.name + "_")) s = s.slice(boss.name.length + 1);
  return prettyName(s.replace(/_\d+$/, ""));
};

function analyseDeath(d) {
  const s = d.seconds || {};
  const n = (s.health || []).length;
  const maxH = d.max_health || maxHealth || 1;
  const maxM = d.max_mana || maxMana || 0;
  const dmg = sum(s.damage || []), heal = sum(s.healing || []), idle = sum(s.idle || []);
  const k = DEATH_RULES.burstSeconds;
  const healthBefore = n > k ? s.health[n - 1 - k] : maxH;
  const oomIndex = maxM ? (s.mana || []).findIndex(m => m < DEATH_RULES.oomShare * maxM) : -1;
  const oomBefore = oomIndex >= 0 ? n - 1 - oomIndex : null;

  const tags = [];
  if (healthBefore >= DEATH_RULES.burstFromHealth * maxH) tags.push("burst");
  if (oomBefore != null && oomBefore >= DEATH_RULES.oomLeadSeconds) tags.push("oom");
  // Waiting for mana is not a rotation problem, so idle only counts while mana remains.
  if (!tags.includes("oom") && idle >= DEATH_RULES.idleShare * n && dmg > heal) tags.push("idle");
  if (dmg > heal) tags.push("attrition");
  if (!tags.length) tags.push("attrition");
  return { d, n, maxH, maxM, dmg, heal, idle, healthBefore, oomBefore, startHealth: n ? s.health[0] : maxH, cause: tags[0], tags };
}

            <div class="meta">${esc(r.source)}, ${r.hits} hit${r.hits === 1 ? "" : "s"}, ${fmtNum(r.amount)}${r.absorbed ? `, ${fmtNum(r.absorbed)} absorbed` : ""}</div></span>
          <span class="barcell"><div class="bar"><span class="dmg" style="width:${(r.amount / maxAmt) * 100}%;background:${schoolPaint(r.school)}"></span></div></span>
          <span class="num">${fmtPct(r.amount / a.maxH)}</span>
        </div>`).join("");
  }
  showRecap(picks.typical);
  deathSec.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    deathSec.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    showRecap(picks[b.dataset.pick]);
  }));
}

// ----- activity section
// Each spell's average time busy per cast (cast time, or the GCD for instants).
const execOf = new Map((healer.stats || [])
  .filter(s => mean(s.num_executes) > 0 && mean(s.total_execute_time) > 0)
  .map(s => [s.name, { label: s.spell_name || prettyName(s.name), time: mean(s.total_execute_time), per: mean(s.total_execute_time) / mean(s.num_executes) }]));

// Busy intervals in the sample fight, rebuilt from the cast log.
const busy = [];
healerSeq.slice().sort((a, b) => a.time - b.time).forEach((e, i, arr) => {
  const per = execOf.get(e.name)?.per;
  if (!per) return;
  const end = Math.min(e.time + per, arr[i + 1]?.time ?? Infinity, sampleEnd);
  if (end > e.time) busy.push([e.time, end]);
});
function activityBuckets(w) {
  const n = Math.ceil(sampleEnd / w);
  const out = new Array(n).fill(0);
  for (const [a, b] of busy) {
    for (let k = Math.floor(a / w); k < n && k * w < b; k++) out[k] += Math.min(b, (k + 1) * w) - Math.max(a, k * w);
  }
  return out.map((v, k) => Math.min(1, v / (Math.min((k + 1) * w, sampleEnd) - k * w)));
}

// Columns of "share of this time slice spent casting", on a track that shows the idle rest.
function columnChart(container, vals, w, opts = {}) {
  const pad = { l: 44, r: 16, t: 8, b: 26 }, h = 200;
  const H = pad.t + h + pad.b;
  const svg = svgEl("svg", { role: "img", "aria-label": opts.label || "Activity" });
  container.innerHTML = "";
  container.appendChild(svg);
  function draw() {
    const W = Math.max(container.clientWidth, 320);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    svg.innerHTML = "";
    const x = t => pad.l + (t / sampleEnd) * (W - pad.l - pad.r);
    const y = v => pad.t + h - v * h;
    for (const t of [0, 0.5, 1]) {
      const lab = svgEl("text", { x: pad.l - 8, y: y(t) + 4, "text-anchor": "end" });
      lab.textContent = Math.round(t * 100) + "%";
      svg.appendChild(lab);
    }
    const colW = x(w) - x(0);
    const gapPx = Math.min(4, colW * 0.3);
    const rx = Math.min(4, (colW - gapPx) / 2);
    const cols = vals.map((v, k) => {
      const t0 = k * w, t1 = Math.min((k + 1) * w, sampleEnd);
      const cx = x(t0) + gapPx / 2, cw = Math.max(1, x(t1) - x(t0) - gapPx);
      const g = svgEl("g", { class: "col" });
      g.appendChild(svgEl("rect", { x: cx, y: y(1), width: cw, height: h, rx, class: "col-track" }));
      if (v > 0) g.appendChild(svgEl("rect", { x: cx, y: y(v), width: cw, height: Math.max(v * h, 2), rx, class: "col-fill" }));
      svg.appendChild(g);
      return { g, v, t0, t1 };
    });
    for (const m of opts.markers || []) {
      const mk = svgEl("g", { class: "marker" });
      mk.appendChild(svgEl("line", { x1: x(m.time), x2: x(m.time), y1: pad.t, y2: pad.t + h }));
      svg.appendChild(mk);
    }
    const step = sampleEnd > 240 ? 60 : sampleEnd > 90 ? 30 : 10;
    for (let s = 0; s <= sampleEnd + 0.01; s += step) {
      const lab = svgEl("text", { x: x(s), y: pad.t + h + 18, "text-anchor": "middle" });
      lab.textContent = fmtTime(s);
      svg.appendChild(lab);
    }
    const hit = svgEl("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: h, fill: "transparent" });
    svg.appendChild(hit);
    hit.addEventListener("pointermove", ev => {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) * (W / box.width);
      const k = Math.floor(((px - pad.l) / (W - pad.l - pad.r)) * sampleEnd / w);
      const c = cols[k];
      if (!c) return;
      cols.forEach(o => o.g.classList.toggle("dim", o !== c));
      const near = (opts.markers || []).filter(m => m.time >= c.t0 && m.time < c.t1)
        .map(m => `<div class="t-row"><span>${esc(m.label)}</span><span>${fmtTime(m.time)}</span></div>`).join("");
      showTip(`<div class="t-head">${fmtTime(c.t0)} – ${fmtTime(c.t1)}</div>
        <div class="t-row"><span><i class="sw" style="background:var(--heal)"></i>Casting</span><span>${fmtPct(c.v)}</span></div>
        <div class="t-row"><span><i class="sw" style="background:var(--grid)"></i>Idle</span><span>${fmtPct(1 - c.v)}</span></div>${near}`, ev.clientX, ev.clientY);
    });
    hit.addEventListener("pointerleave", () => { cols.forEach(o => o.g.classList.remove("dim")); hideTip(); });
  }
  draw();
  new ResizeObserver(() => draw()).observe(container);
}

// Ring split into time spent on each spell plus idle time.
function donutChart(container, segs, centerBig, centerLbl) {
  const total = sum(segs.map(s => s.time)) || 1;
  const r = 80, C = 2 * Math.PI * r, gapLen = segs.length > 1 ? 3 : 0;
  const svg = svgEl("svg", { viewBox: "0 0 200 200", role: "img", "aria-label": segs.map(s => `${s.label} ${fmtPct(s.time / total)}`).join(", ") });
  let off = 0;
  for (const s of segs) {
    const len = (s.time / total) * C;
    const arc = svgEl("circle", {
      cx: 100, cy: 100, r, class: "seg-arc", transform: "rotate(-90 100 100)",
      style: `fill:none;stroke:${s.color};stroke-width:22`,
      "stroke-dasharray": `${Math.max(0, len - gapLen)} ${C}`, "stroke-dashoffset": -off,
    });
    arc.addEventListener("pointermove", ev => showTip(`<div class="t-head">${esc(s.label)}</div><div class="t-row"><span>Time</span><span>${fmtTime(s.time)}</span></div><div class="t-row"><span>Share of fight</span><span>${fmtPct(s.time / total, 1)}</span></div>`, ev.clientX, ev.clientY));
    arc.addEventListener("pointerleave", hideTip);
    svg.appendChild(arc);
    off += len;
  }
  container.innerHTML = `<div class="center"><div class="big">${centerBig}</div><div class="lbl">${centerLbl}</div></div>`;
  container.prepend(svg);
}

if (activeTime != null) {
  const palette = ["--heal", "--mana", "--c3", "--c4", "--c5"];
  const spellSegs = [...execOf.values()].sort((a, b) => b.time - a.time);
  // Spells beyond the palette are folded into "Other" so colours stay distinct.
  const shown = spellSegs.slice(0, palette.length - 1);
  const rest = spellSegs.slice(palette.length - 1);
  const segs = shown.map((s, i) => ({ label: s.label, time: s.time, color: color(palette[i]) }));
  if (rest.length) segs.push({ label: "Other spells", time: sum(rest.map(s => s.time)), color: color(palette[palette.length - 1]) });
  // Scale spell times so casting adds up to the fight's active time.
  const castSum = sum(segs.map(s => s.time));
  if (castSum > 0) segs.forEach(s => { s.time *= activeTime / castSum; });
  if (idleTime > 0) segs.push({ label: "Idle", time: idleTime, color: "var(--grid)" });

  const actSec = el("section", { id: "activity" });
  actSec.innerHTML = `
    <div class="section-head">
      <h2>Casting vs idle</h2>
      <p>How your time was spent across the fight. Idle means nothing in your action list was ready or worth casting.</p>
    </div>
    <div class="act-grid">
      <div class="panel donut-panel">
        <h3>Where your time went</h3>
        <div class="donut" id="actDonut"></div>
        <ul class="act-legend">${segs.map(s => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><span class="t">${fmtTime(s.time)}</span><span class="p">${fmtPct(s.time / fightLen)}</span></li>`).join("")}</ul>
      </div>
      <div class="panel chart-panel">
        <div class="chart-title">
          <h3>Time spent casting, one sample fight</h3>
          <div class="seg" role="group" aria-label="Bucket size">
            <button type="button" data-w="5" aria-pressed="false">5s</button>
            <button type="button" data-w="10" aria-pressed="true">10s</button>
            <button type="button" data-w="15" aria-pressed="false">15s</button>
          </div>
        </div>
        <div class="chart" id="actChart"></div>
      </div>
    </div>`;
  app.appendChild(actSec);
  donutChart($("#actDonut"), segs, fmtPct(activeTime / fightLen), "casting");
  const renderAct = w => {
    if (!busy.length) { $("#actChart").innerHTML = '<p class="empty">No cast sequence in this report.</p>'; return; }
    columnChart($("#actChart"), activityBuckets(w), w, { markers: sampleMarkers, label: "Share of each time slice spent casting" });
  };
  renderAct(10);
  actSec.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    actSec.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderAct(+b.dataset.w);
  }));
}

// ----- breakdown builder
function breakdown(container, rows, kind, total) {
  const max = Math.max(...rows.map(r => (kind === "heal" ? r.raw : r.eff)), 1);
  const head = kind === "heal"
    ? `<div class="bd-head"><span>Spell</span><span>Effective and overhealing</span><span>Effective</span></div>`
    : `<div class="bd-head"><span>Ability</span><span>Damage per fight</span><span>Share</span></div>`;
  container.innerHTML = head;
  rows.forEach((r, i) => {
    const id = kind + "-d-" + i;
    const btn = el("button", { class: "bd-row", type: "button", "aria-expanded": "false", "aria-controls": id });
    let bar, metaText, num;
    if (kind === "heal") {
      const effW = (r.eff / max) * 100, overW = (r.over / max) * 100;
      bar = `<div class="bar" title="${fmtNum(r.eff)} effective, ${fmtNum(r.over)} overhealing">${effW > 0 ? `<span class="eff" style="width:${effW}%"></span>` : ""}${overW > 0.3 ? `<span class="over" style="width:${overW}%"></span>` : ""}</div>`;
      const dShare = r.direct.eff + r.tick.eff ? r.direct.eff / (r.direct.eff + r.tick.eff) : 0;
      const split = r.direct.count && r.tick.count ? `, ${fmtPct(dShare)} direct and ${fmtPct(1 - dShare)} over time` : r.tick.count ? ", all over time" : "";
      metaText = `${Math.round(r.casts)} casts, ${fmtPct(r.raw ? r.over / r.raw : 0)} overhealing${split}`;
      num = `${fmtPct(total ? r.eff / total : 0)}<small>${fmtNum(r.eff / fightLen)}/s</small>`;
    } else {
      bar = `<div class="bar"><span class="dmg" style="width:${(r.eff / max) * 100}%;background:${schoolPaint(r.school)}"></span></div>`;
      const hits = r.direct.count + r.tick.count;
      metaText = `${esc(r.source)}${r.sources > 1 ? " ×" + r.sources : ""}, ${Math.round(hits)} hits, ${fmtNum(r.eff)} per fight${r.raw > r.eff ? `, ${fmtPct(1 - r.eff / r.raw)} mitigated` : ""}`;
      num = `${fmtPct(total ? r.eff / total : 0)}<small>${fmtNum(r.eff / fightLen)}/s</small>`;
    }
    btn.innerHTML = `
      <span style="min-width:0"><span class="nm"><span class="chev" aria-hidden="true">›</span>${esc(r.label)}${r.school ? `<span class="school">${schoolDot(r.school)}${esc(prettyName(r.school))}</span>` : ""}</span><div class="meta">${metaText}</div></span>
      <span class="barcell">${bar}</span>
      <span class="num">${num}</span>`;
    const detail = el("div", { class: "bd-detail", id });
    // Damage taken: "total" is before armor/versatility/absorbs, "actual" is what landed, so the gap was mitigated.
    const lossCells = p => kind === "heal"
      ? `<td>${fmtPct(p.crit / p.count)}</td><td>${fmtPct(p.raw ? 1 - p.eff / p.raw : 0)}</td>`
      : `<td>${p.raw > p.eff ? `${fmtPct(1 - p.eff / p.raw, 1)} <span class="faint">(${fmtNum(p.raw - p.eff)})</span>` : "–"}</td>`;
    const line = (lab, p) => p.count ? `<tr><td>${lab}</td><td>${Math.round(p.count)}</td><td>${fmtNum(p.eff / p.count)}</td>${lossCells(p)}<td>${fmtNum(p.eff)}</td></tr>` : "";
    detail.innerHTML = `<table>
      <thead><tr><th></th><th>Count</th><th>Average</th>${kind === "heal" ? "<th>Crit rate</th><th>Overheal</th>" : "<th>Mitigated</th>"}<th>Total</th></tr></thead>
      <tbody>${line(kind === "heal" ? "Direct heal" : "Direct hit", r.direct)}${line(kind === "heal" ? "Over time (ticks)" : "Ticks", r.tick)}</tbody></table>`;
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      detail.classList.toggle("open", !open);
    });
    container.appendChild(btn);
    container.appendChild(detail);
  });
  if (!rows.length) container.innerHTML += `<div class="empty">Nothing to show.</div>`;
}

// ----- the raid
if (raidMembers.length) {
  // Across all fights: when members died and how much they took.
  const rows = raidMembers.map(p => {
    const c = p.collected_data || {};
    const fights = c.fight_length?.count || fightsRun;
    const deaths = c.deaths?.count || 0;
    return { taken: mean(c.dtps), healed: mean(c.heal_taken), alive: mean(c.fight_length),
      deathRate: Math.min(1, deaths / fights), deathTime: deaths ? mean(c.deaths) : null };
  });
  const avg = k => sum(rows.map(r => r[k] || 0)) / rows.length;
  const deathTimes = rows.filter(r => r.deathTime != null).map(r => r.deathTime).sort((a, b) => a - b);

  const frames = cd.raid_frames || null;
  $("#nav").insertBefore(el("a", { href: "#raid" }, "Raid"), $('#nav a[href="#mana"]') || null);
  const raidSec = el("section", { id: "raid" });
  raidSec.innerHTML = `
    <div class="section-head">
      <h2>The raid</h2>
      <p>${frames ? "Raid frames from one sample fight. Click a death, or drag the timeline, to see everyone's health and your HoTs and buffs at that moment. Hover a frame for details." : "Turn on raid_frames=1 for your character to see raid frames here."}</p>
    </div>
    <div class="panel verdict" style="margin-top:0">
      <p class="lead">${deathTimes.length
        ? `Across all fights the first raid member died at <b>${fmtTime(deathTimes[0])}</b> on average, and members died in <b>${fmtPct(avg("deathRate"))}</b> of fights.`
        : "No raid member died in any fight."}
        Each took <b>${fmtNum(avg("taken"))}</b> damage and received <b>${fmtNum(avg("healed"))}</b> healing per fight.</p>
      <div class="stats">
        <div class="stat"><div class="label">Raid size</div><div class="value">${rows.length + 1}</div><div class="note">you and ${rows.length} others</div></div>
        <div class="stat"><div class="label">Average time alive</div><div class="value">${fmtTime(avg("alive"))}</div><div class="note">per member</div></div>
        <div class="stat"><div class="label">Healing they received</div><div class="value heal">${fmtNum(sum(rows.map(r => r.healed || 0)))}</div><div class="note">per fight, all members</div></div>
      </div>
    </div>
    ${frames ? `<div class="panel rf-panel" style="margin-top:20px">
      <div class="rf-bar">
        <h3>Deaths in the sample fight</h3>
        <div class="rf-deaths" id="rfDeaths"></div>
      </div>
      <div class="rf-bar rf-scrubrow">
        <span class="rf-time" id="rfTime"></span>
        <input type="range" id="rfScrub" min="0" value="0" aria-label="Time in the sample fight">
      </div>
      <div class="rf-sum" id="rfSum" aria-live="polite"></div>
      <div id="rfGroups"></div>
    </div>` : ""}`;
  app.appendChild(raidSec);

  if (frames) {
    const units = frames.units.map((u, i) => ({ ...u, i, label: u.name === healer.name ? u.name : prettyName(u.name) }));
    const groupOf = u => u.role === "tank" ? "Tanks" : u.role === "heal" ? "Healers"
      : /ranged/.test(u.position) ? "Ranged" : "Melee";
    const groups = ["Tanks", "Healers", "Melee", "Ranged"]
      .map(g => ({ name: g, units: units.filter(u => groupOf(u) === g) })).filter(g => g.units.length);
    const roleColor = { Tanks: "var(--mana)", Healers: "var(--heal)", Melee: "var(--dmg)", Ranged: "var(--c3)" };

    // Order snapshots by time; a death snapshot sorts right after the periodic one at the same time.
    const snaps = frames.snapshots.map((s, idx) => ({ ...s, idx })).sort((a, b) => a.time - b.time || a.idx - b.idx);
    const posOf = idx => snaps.findIndex(s => s.idx === idx);
    const deaths = frames.deaths.map(d => ({ ...d, unit: units.find(u => u.name === d.name) }));

    // Only healing HoTs are shown, as squares in the HoT's colour with the seconds left (rounded down).
    const HOT_COLORS = { regrowth: "#2e9e4f", rejuvenation: "#8e5bd9", germination: "#c06ad8", rejuvenation_germination: "#c06ad8",
      lifebloom: "#59c94a", wild_growth: "#22a6a0", cenarion_ward: "#c9922e", spring_blossoms: "#d0628f",
      adaptive_swarm: "#b8a234", rune_of_unleashed_fire_heal_lingering: "#de6a2a" };
    const FALLBACK = ["#3f8fd2", "#c7b03a", "#d45a7a", "#5bb7c9", "#9a7b4f"];
    const hotColor = n => HOT_COLORS[n] || FALLBACK[[...n].reduce((h, c) => h + c.charCodeAt(0), 0) % FALLBACK.length];
    const HOT_LABELS = { rune_of_unleashed_fire_heal_lingering: "Unleashed Fire (rune)", rejuvenation_germination: "Germination" };
    const hotLabel = n => HOT_LABELS[n] || prettyName(n);
    // HoTs end on death; never show any on a dead unit.
    const effectsOf = (s, u) => (s.alive[u.i] ? (s.effects[u.i] || []).filter(e => e.hot) : []);
    const hotNames = [...new Set(snaps.flatMap(s => s.effects.flatMap(list => (list || []).filter(e => e.hot).map(e => e.name))))];
    const hpColor = p => p > 0.5 ? "var(--heal)" : p > 0.25 ? "var(--c4)" : "var(--dmg)";

    // Deaths on the same displayed second share one square; clicking it shows the moment after the last of them.
    const colorOf = d => roleColor[groupOf(d.unit || {})] || "var(--ink-3)";
    const exactTime = t => Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");
    const deathGroups = [];
    for (const d of deaths) {
      const key = Math.round(d.time);
      let g = deathGroups.find(x => x.key === key);
      if (!g) deathGroups.push(g = { key, deaths: [] });
      g.deaths.push(d);
    }
    for (const g of deathGroups) {
      g.lastPos = Math.max(...g.deaths.map(d => posOf(d.snapshot)));
      // The most common role colours the square when it is selected.
      const counts = {};
      g.deaths.forEach(d => { const c = colorOf(d); counts[c] = (counts[c] || 0) + 1; });
      g.color = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];

    };

    $("#rfDeaths").innerHTML = deathGroups.length ? deathGroups.map((g, k) => `
      <button type="button" class="rf-death" data-g="${k}" style="--rc:${g.color}">

        <span class="n">${g.deaths.length > 1 ? g.deaths.length + " deaths" : esc(g.deaths[0].unit ? g.deaths[0].unit.label : g.deaths[0].name)}</span>
      </button>`).join("") : '<span class="faint">Nobody died in this fight.</span>';

    if (hotNames.length)
      $("#rfGroups").insertAdjacentHTML("beforebegin", `<div class="legend rf-legend">${hotNames.map(n =>
        `<span><i style="background:${hotColor(n)}"></i>${esc(hotLabel(n))}</span>`).join("")}<span class="faint">Number: seconds left</span></div>`);

    const scrub = $("#rfScrub");
    scrub.max = String(snaps.length - 1);

    // group: the death square that was clicked, so all of its deaths are highlighted.
    function render(pos, group = null) {
      const s = snaps[pos];
      scrub.value = String(pos);
      // Death snapshots fall between whole seconds, so show tenths there.
      $("#rfTime").textContent = Number.isInteger(s.time) ? fmtTime(s.time)
        : Math.floor(s.time / 60) + ":" + (s.time % 60).toFixed(1).padStart(4, "0");
      const alive = s.alive.filter(Boolean).length;
      const pct = sum(units.map(u => s.alive[u.i] ? s.health[u.i] / (u.max_health || 1) : 0)) / units.length;
      // A clicked square highlights all its deaths; scrubbing highlights the death whose snapshot this is.
      const dyingHere = group ? group.deaths : deaths.filter(d => posOf(d.snapshot) === pos);
      const dyingNames = dyingHere.map(d => d.name);
      let died = "";
      if (dyingHere.length === 1) {
        const d = dyingHere[0];
        died = ` · <span class="rf-died">${esc(d.unit ? d.unit.label : d.name)} died${d.ability
          ? ` to <b>${esc(prettyName(d.ability))}</b> (${fmtNum(d.amount)})` : ""}</span>`;
      } else if (dyingHere.length > 1) {
        died = ` · <span class="rf-died">${dyingHere.length} died: ${causeSummary(dyingHere)}</span>`;
      }
      $("#rfSum").innerHTML = `<b>${alive}/${units.length}</b> alive, raid health <b>${fmtPct(pct)}</b>` + died;
      raidSec.querySelectorAll(".rf-death").forEach(b => {
        const g = deathGroups[+b.dataset.g];
        b.setAttribute("aria-pressed", String(group ? g === group : g.deaths.some(d => posOf(d.snapshot) === pos)));
      });

      // Update the existing frames in place: rebuilding them on every slider step made the panel jitter,
      // restarted the DIED pulse and dropped the hover tooltip.
      current = s;
      for (const t of tiles) {
        const u = t.u, alive = !!s.alive[u.i];
        const hp = alive ? s.health[u.i] / (u.max_health || 1) : 0;
        const ab = Math.min(1 - hp, (s.absorb[u.i] || 0) / (u.max_health || 1));
        const dying = dyingNames.includes(u.name);
        t.node.classList.toggle("dead", !alive);
        t.node.classList.toggle("dying", dying);
        t.died.hidden = !dying;
        t.hp.style.width = (hp * 100).toFixed(1) + "%";
        t.hp.style.background = hpColor(hp);
        t.abs.hidden = !(ab > 0);
        if (ab > 0) { t.abs.style.left = (hp * 100).toFixed(1) + "%"; t.abs.style.width = (ab * 100).toFixed(1) + "%"; }
        t.pct.textContent = alive ? fmtPct(hp) : "Dead";
        const fx = effectsOf(s, u).map(e => `<i style="background:${hotColor(e.name)}">${e.remains >= 0 ? Math.floor(e.remains) : ""}</i>`).join("");
        if (t.fxHtml !== fx) { t.fx.innerHTML = fx; t.fxHtml = fx; }
      }
      if (tipUnit) showUnitTip(tipUnit, tipX, tipY);
    }

    // Frames are built once; render() only updates them.
    $("#rfGroups").innerHTML = groups.map(g => `
      <div class="rf-group"><div class="rf-glabel" style="color:${roleColor[g.name]}">${g.name}</div>
        <div class="rf-grid">${g.units.map(u => `
          <div class="uf${u.name === healer.name ? " self" : ""}" data-u="${u.i}" tabindex="0">
            <span class="uf-died" hidden>DIED</span>
            <div class="uf-hp"></div><div class="uf-abs" hidden></div>
            <div class="uf-name">${esc(u.label)}</div><div class="uf-pct"></div><div class="uf-fx"></div>
          </div>`).join("")}</div></div>`).join("");
    let current = null, tipUnit = null, tipX = 0, tipY = 0;
    const tiles = units.map(u => {
      const node = $(`.uf[data-u="${u.i}"]`, $("#rfGroups"));
      return { u, node, hp: $(".uf-hp", node), abs: $(".uf-abs", node), pct: $(".uf-pct", node), fx: $(".uf-fx", node),
        died: $(".uf-died", node), fxHtml: null };
    });
    function showUnitTip(u, x, y) {
      const s = current, fx = effectsOf(s, u);
      showTip(`<div class="t-head">${esc(u.label)} <span class="faint">(${groupOf(u).replace(/s$/, "")})</span></div>
        <div class="t-row"><span>Health</span><span>${s.alive[u.i] ? fmtNum(s.health[u.i]) + " / " + fmtNum(u.max_health) : "Dead"}</span></div>
        ${s.absorb[u.i] ? `<div class="t-row"><span>Absorb</span><span>${fmtNum(s.absorb[u.i])}</span></div>` : ""}
        ${fx.length ? fx.map(e => `<div class="t-row"><span><i class="sw" style="background:${hotColor(e.name)}"></i>${esc(hotLabel(e.name))}${e.stacks > 1 ? " ×" + e.stacks : ""}</span><span>${e.remains >= 0 ? e.remains.toFixed(1) + "s" : "∞"}</span></div>`).join("")
          : `<div class="t-row"><span class="faint">${s.alive[u.i] ? "None of your HoTs" : "Dead"}</span><span></span></div>`}`, x, y);
    }
    for (const t of tiles) {
      t.node.addEventListener("pointermove", ev => { tipUnit = t.u; tipX = ev.clientX; tipY = ev.clientY; showUnitTip(t.u, tipX, tipY); });
      t.node.addEventListener("pointerleave", () => { tipUnit = null; hideTip(); });
      t.node.addEventListener("focus", () => { const r = t.node.getBoundingClientRect(); tipUnit = t.u; tipX = r.right; tipY = r.top; showUnitTip(t.u, tipX, tipY); });
      t.node.addEventListener("blur", () => { tipUnit = null; hideTip(); });
    }

    raidSec.querySelectorAll(".rf-death").forEach(b => {
      const g = deathGroups[+b.dataset.g];
      b.addEventListener("click", () => render(g.lastPos, g));
      b.addEventListener("pointermove", ev => showTip(`<div class="t-head">${g.deaths.length > 1
          ? `${g.deaths.length} deaths at ${fmtTime(g.key)}` : `${esc(g.deaths[0].unit ? g.deaths[0].unit.label : g.deaths[0].name)} died at ${exactTime(g.deaths[0].time)}`}</div>
        ${g.deaths.map(d => `<div class="t-row"><span><i class="sw" style="background:${colorOf(d)}"></i>${esc(d.unit ? d.unit.label : d.name)}
          <span class="faint">${exactTime(d.time)}</span></span><span>${d.ability ? `${esc(prettyName(d.ability))} ${fmtNum(d.amount)}` : "–"}</span></div>`).join("")}
        ${g.deaths.length === 1 && g.deaths[0].source ? `<div class="t-row"><span>From</span><span>${esc(sourceLabel(g.deaths[0].source))}</span></div>` : ""}`,
        ev.clientX, ev.clientY));
      b.addEventListener("pointerleave", hideTip);
    });
    scrub.addEventListener("input", () => render(+scrub.value));
    render(deathGroups.length ? deathGroups[0].lastPos : snaps.length - 1, deathGroups[0] || null);
  }
}

// ----- mana & buffs
const manaSec = el("section", { id: "mana" });
// SimC reports buff uptime as a percentage (0-100).
const buffs = (healer.buffs || []).map(b => ({ name: b.spell_name || prettyName(b.name), up: (b.uptime ?? 0) / 100 }))
  .filter(b => b.up > 0.005).sort((a, b) => b.up - a.up).slice(0, 14);
manaSec.innerHTML = `
  <div class="section-head">
    <h2>Mana and buffs</h2>
    <p>Mana over the fight, and how much of the fight each of your buffs was active.</p>
  </div>
  <div class="two-col">
    <div class="panel chart-panel"><div class="chart-title"><h3>Mana</h3><div class="legend"><span><i class="line" style="background:var(--mana)"></i>Mana</span></div></div><div class="chart" id="manaChart"></div></div>
    <div class="panel"><div class="chart-title" style="padding:18px 20px 0"><h3>Buff uptime</h3></div>
      <div class="uptimes">${buffs.length ? buffs.map(b => `<div class="up"><span>${esc(b.name)}</span><div class="track"><div class="fill" style="width:${(b.up * 100).toFixed(1)}%"></div></div><span class="pct">${fmtPct(b.up)}</span></div>`).join("") : '<p class="muted">No buff data in this report.</p>'}</div>
    </div>
  </div>`;
app.appendChild(manaSec);
if (manaTL.length) {
  const mMax = maxMana || Math.max(...manaTL);
  timeChart($("#manaChart"), [{
    height: 180, length: manaTL.length, yMax: 100, yTicks: [0, 50, 100], yFormat: v => Math.round(v) + "%",
    series: [{ name: "Mana", values: manaTL.map(v => (v / mMax) * 100), color: color("--mana"), kind: "area", opacity: 0.14 }],
  }], { label: "Mana over time" });
} else $("#manaChart").innerHTML = '<p class="empty">No mana timeline in this report.</p>';

// ----- details
const detSec = el("section", { id: "details" });
detSec.innerHTML = `
  <div class="section-head"><h2>Details</h2></div>
  <details class="panel"><summary>Gear</summary><div class="detail-body"><table class="gear">${gearList.map(([slot, g]) => `<tr><td>${esc(slot.replace(/_/g, " "))}</td><td>${esc(prettyName(g.name))}</td><td>${g.ilevel || ""}</td></tr>`).join("")}</table></div></details>
  <details class="panel"><summary>Talents</summary><div class="detail-body"><code class="block">${esc(healer.talents || "")}</code></div></details>
  <details class="panel"><summary>Simulation settings</summary><div class="detail-body"><table class="gear">
    ${sim.options?.encounter ? `<tr><td>Encounter</td><td>${esc(bossTitle)}</td><td></td></tr>` : ""}
    <tr><td>Fights simulated</td><td>${iterations.toLocaleString()}</td><td></td></tr>
    <tr><td>Max fight length</td><td>${fmtTime(sim.options?.max_time || fightLen)}</td><td></td></tr>
    <tr><td>Length varies</td><td>${sim.options?.vary_combat_length ? "Yes, by " + fmtPct(sim.options.vary_combat_length) : "No"}</td><td></td></tr>
    <tr><td>SimC version</td><td>${esc(data.version || "")}</td><td></td></tr>
    <tr><td>Game data</td><td>${esc(sim.options?.dbc?.[sim.options?.dbc?.version_used]?.wow_version || "")}</td><td></td></tr>
  </table></div></details>
  <p class="footer">Generated from SimulationCraft JSON${data.timestamp ? " on " + new Date(data.timestamp * 1000).toLocaleString() : ""}.</p>`;
app.appendChild(detSec);

// ----- nav highlight
const links = [...document.querySelectorAll("#nav a")];
const obs = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  }
}, { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section[id]").forEach(s => obs.observe(s));
})();
</script>
</body>
