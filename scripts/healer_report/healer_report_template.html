<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healer Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Colour palettes (the floating palette button, remembered): graphite (default), midnight, forest, light, pastel.
   --accent is the report's own colour; --heal / --dmg stay good / bad (upgrade / downgrade) in every palette. */
:root {
  color-scheme: dark;
  --bg: #131416;
  --panel: #1b1c1f;
  --panel-2: #222327;
  --ink: #ececef;
  --ink-2: #b2b3ba;
  --ink-3: #8b8c94;
  --line: #2d2e34;
  --grid: #26272c;
  --heal: #5cc794;
  --heal-soft: #2b5a45;
  --dmg: #ec7a5c;
  --dmg-soft: #6b3523;
  --mana: #6ea4f2;
  --focus: #a9a6f7;
  --accent: #a9a6f7;
  --c3: #8b6fd6;
  --c4: #d19a2e;
  --c5: #2fa7b8;
  /* Spell school colours, close to the in-game combat log. */
  --school-physical: #c9a36a;
  --school-holy: #f2d35b;
  --school-fire: #f0612a;
  --school-nature: #3fbf4f;
  --school-frost: #5cb8f0;
  --school-shadow: #8e5bd9;
  --school-arcane: #e06bd8;
  --shadow: none;
}
:root[data-theme="midnight"] {
  color-scheme: dark;
  --bg: #0e1320; --panel: #151b2b; --panel-2: #1b2236; --ink: #e6eaf5; --ink-2: #a9b2ca; --ink-3: #7f89a4;
  --line: #262e44; --grid: #1f263a; --heal: #4fc59a; --heal-soft: #1f5a45; --dmg: #f07a62; --dmg-soft: #6b3523;
  --mana: #6ea8ff; --focus: #7cc4ff; --accent: #7cc4ff; --shadow: none;
}
:root[data-theme="forest"] {
  color-scheme: dark;
  --bg: #0f1513; --panel: #161e1b; --panel-2: #1b2522; --ink: #e6edea; --ink-2: #a9b7b1; --ink-3: #849390;
  --line: #26322e; --grid: #202b27; --heal: #27a574; --heal-soft: #1f5a45; --dmg: #e2683d; --dmg-soft: #6b3523;
  --mana: #4a8be3; --focus: #4a8be3; --accent: #27a574; --shadow: none;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f2f4; --panel: #ffffff; --panel-2: #f7f7f9; --ink: #1b1c20; --ink-2: #4f515a; --ink-3: #74767f;
  --line: #e0e1e6; --grid: #ebecef; --heal: #17996a; --heal-soft: #a6dcc5; --dmg: #d4562a; --dmg-soft: #f2bba5;
  --mana: #2f74d0; --focus: #5b57d6; --accent: #5b57d6;
  --shadow: 0 1px 2px rgba(20, 20, 30, .06), 0 4px 16px rgba(20, 20, 30, .05);
}
:root[data-theme="pastel"] {
  color-scheme: light;
  /* Dusty rose: no white surfaces, soft contrast. */
  --bg: #ead7e3; --panel: #f4e6ef; --panel-2: #eddbe7; --ink: #3d2a3b; --ink-2: #6a4e66; --ink-3: #8d7088;
  --line: #ddc2d4; --grid: #e6cfde; --heal: #2f8f73; --heal-soft: #b5dccd; --dmg: #c85a74; --dmg-soft: #f0c2cd;
  --mana: #6f7fcc; --focus: #c95f99; --accent: #c95f99; --c4: #b97a2a;
  --shadow: 0 1px 2px rgba(90, 40, 80, .06), 0 6px 20px rgba(90, 40, 80, .07);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1240px; margin: 0 auto; padding: 10px 24px;
  display: flex; align-items: center; gap: 24px;
}
.brand { font-weight: 700; white-space: nowrap; }
.brand span { color: var(--ink-3); font-weight: 500; }
/* Wraps onto a second row instead of cutting sections off */
.nav { display: flex; flex-wrap: wrap; gap: 2px 4px; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 14px;
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--panel); }
.nav a.active { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.theme-btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
}

main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
section { margin-top: 48px; }
.section-head { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 16px; }
.section-head p { color: var(--ink-2); max-width: 70ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

/* ---------- matchup (hero) ---------- */
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: stretch; }
.side { padding: 24px 28px; position: relative; overflow: hidden; }
.side.healer { border-radius: 14px 0 0 14px; border-right: none; }
.side.boss { border-radius: 0 14px 14px 0; border-left: none; }
.side::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--accent); }
.side.boss::before { inset: 0 0 0 auto; background: var(--dmg); }
.side .role { font-size: 13px; font-weight: 600; color: var(--accent); }
.side.boss .role { color: var(--dmg); }
.side .name { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 4px; }
.side .sub { color: var(--ink-2); }
.diff {
  display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--dmg); border: 1px solid var(--dmg); border-radius: 999px; padding: 3px 10px;
  vertical-align: middle; margin-right: 12px; position: relative; top: -3px;
}
.side.boss { text-align: right; }
.vs {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 22px; background: var(--panel-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  min-width: 140px; text-align: center;
}
.vs .clock { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.vs .small { font-size: 12px; color: var(--ink-3); }
.outcome {
  display: inline-block; font-size: 14px; font-weight: 800; letter-spacing: .08em; padding: 4px 14px;
  border-radius: 999px; border: 1.5px solid currentColor; margin: 10px 0 4px;
}
.outcome.kill { color: var(--heal); }
.outcome.wipe { color: var(--dmg); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px 16px; margin-top: 18px; }
.kv div { min-width: 0; }
.kv dt { font-size: 12px; color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; font-size: 16px; }
.abilities { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
.abilities li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; }
.abilities li .who { color: var(--ink-3); font-size: 13px; }
.abilities li .amt { font-weight: 600; }
.side.boss .abilities li { text-align: left; }

/* ---------- verdict ---------- */
.verdict { margin-top: 20px; padding: 22px 28px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 28px; align-items: center; }
.verdict .lead { font-size: 20px; line-height: 1.45; font-weight: 500; }
.verdict .lead b { font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 24px; }
.stat .label { font-size: 13px; color: var(--ink-2); }
.stat .value { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.stat .note { font-size: 12px; color: var(--ink-3); }
.stat .value.heal { color: var(--heal); }
.stat .value.dmg { color: var(--dmg); }
.stat .value.mana { color: var(--mana); }
.activity { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 18px; }
.activity .act-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.activity .act-head b { color: var(--ink); font-weight: 700; }
.activity .bar { height: 14px; }
.activity .bar .idle { background: var(--grid); }

/* ---------- cause of death ---------- */
.death-grid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 20px; }
.causes { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.cause { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; align-items: center; font-size: 15px; }
.cause .track { grid-column: 1 / -1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.cause .fill { height: 100%; border-radius: 4px; }
.cause .pct { text-align: right; font-weight: 700; }
.cause .why { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); }
.verdict-line { font-size: 16px; line-height: 1.5; margin: 4px 0 10px; }
.verdict-line b { font-weight: 700; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; margin: 0 6px 4px 0; border: 1px solid currentColor; }
.kb { color: var(--dmg); font-weight: 700; font-size: 12px; margin-left: 6px; }
.chart .idle-band { fill: var(--ink-3); }

/* ---------- damage tolerance ---------- */
.tol-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.tol { padding: 18px 20px; border-top: 4px solid var(--tc); }
.tol-name { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tol-value { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-top: 6px; }
.tol-value small { font-size: 18px; font-weight: 700; color: var(--ink-3); margin: 0 4px; }
.tol.none .tol-value { font-size: 24px; color: var(--ink-3); }
.tol-score { font-size: 20px; font-weight: 700; color: var(--ink-2); margin-left: 12px; letter-spacing: 0; }
.tol.main { background: color-mix(in srgb, var(--ink) 4%, var(--panel)); }
.score-track { margin-top: 14px; padding: 16px 24px 12px; }
.st-you { position: relative; display: inline-block; transform: translateX(-50%); font-size: 14px; color: var(--ink-2); white-space: nowrap; margin-bottom: 6px; }
.st-you b { color: var(--ink); }
.st-row { position: relative; height: 22px; font-size: 13px; color: var(--ink-2); }
.st-row span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.st-row b { color: var(--ink); }
.st-top span { bottom: 2px; }
.st-bottom span { top: 2px; }
.st-bar { position: relative; height: 14px; background: var(--grid); border-radius: 4px; }
.st-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.st-fill.ok { background: var(--heal); }
.st-fill.short { background: var(--dmg); }
.st-lvl { position: absolute; top: 9px; bottom: 0; width: 1px; background: var(--ink-3); opacity: .5; }
.st-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--ink-2); }
.st-mark.req { background: var(--ink); width: 3px; }
.st-legend { list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--ink-2); }
.st-legend b { color: var(--ink); }
.tol-verdict { padding: 18px 22px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-left: 6px solid var(--vc); }
.tol-verdict.ok { --vc: var(--heal); }
.tol-verdict.short { --vc: var(--dmg); }
.tol-verdict .mark { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 800; color: #fff; background: var(--vc); flex: none; }
.tol-verdict .what { font-size: 24px; font-weight: 800; }
.tol-verdict .how { color: var(--ink-2); }
.tol-verdict .how b { color: var(--ink); }
.hr-chart { margin-top: 14px; padding: 8px 0 12px; }
.hr-row { display: grid; grid-template-columns: 200px minmax(0, 1fr) 90px; gap: 14px; align-items: center; padding: 7px 22px; }
.hr-row:focus { outline: 2px solid var(--mana); outline-offset: -2px; border-radius: 8px; }
.hr-name small { display: block; color: var(--ink-3); font-size: 12px; }
.hr-track { position: relative; height: 16px; }
.hr-zero { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); }
.hr-ms { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); opacity: .7; }
.hr-bar { position: absolute; top: 2px; bottom: 2px; background: var(--bc); }
.hr-bar.pos { border-radius: 0 4px 4px 0; }
.hr-bar.neg { border-radius: 4px 0 0 4px; }
.hr-num { text-align: right; font-weight: 700; }
.hr-axis { display: grid; grid-template-columns: 200px minmax(0, 1fr) 90px; gap: 14px; padding: 0 22px; font-size: 12px; color: var(--ink-3); }
.hr-axis .ticks { position: relative; height: 16px; }
.hr-axis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.hr-legend { padding: 8px 22px 4px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 20px; border-top: 1px solid var(--line); margin-top: 8px; }
.hr-legend b { color: var(--ink); }
/* character sheet; item and rune links are drawn by Wowhead's tooltip script */
a.wh-item { text-decoration: none; font-weight: 700; }
a.wh-item:hover { text-decoration: underline; }
.char-sheet { padding: 0; overflow: hidden; }
.cs-head { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 14px 20px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--ink) 3%, var(--panel)); }
.cs-stats { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.cs-stat { display: flex; flex-direction: column; }
.cs-stat span, .cs-label { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.cs-stat b { font-size: 17px; font-weight: 800; }
.cs-cols { display: grid; grid-template-columns: 1fr 1fr; }
.cs-col { display: flex; flex-direction: column; }
.cs-col + .cs-col { border-left: 1px solid var(--line); }
.gi { padding: 9px 20px; border-bottom: 1px solid var(--grid); position: relative; }
.gi:last-child { border-bottom: 0; }
.gi:hover, .gi:focus { background: color-mix(in srgb, var(--ink) 4%, transparent); outline: none; }
.gi.up { background: color-mix(in srgb, var(--heal) 9%, transparent); box-shadow: inset 3px 0 0 var(--heal); }
.gi-top { display: flex; align-items: center; gap: 8px; }
.gi-slot { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.gi-ilvl { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 8px; }
.gi-name { font-size: 14px; line-height: 1.3; margin-top: 2px; }
.gi-meta { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.gi-ench { font-size: 12px; color: var(--heal); margin-top: 1px; }
.gi-gem { font-size: 12px; color: var(--mana); margin-top: 1px; }
.gi-badge { font-size: 10.5px; font-weight: 700; color: var(--heal); }
.cs-omnium { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 20px; border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--ink) 3%, var(--panel)); }
.cs-omnium a.rune { font-size: 13px; }
.arr { display: inline-block; font-size: 11px; margin-right: 2px; }
.arr.up { color: var(--heal); display: inline-block; }
.arr.down { color: var(--dmg); }
.arr.same { color: var(--ink-3); }
.tip-toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tip-toggle b { color: var(--ink); }
.tt-switch { width: 26px; height: 15px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.tt-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: left .15s; }
.tip-toggle[aria-pressed="true"] .tt-switch { background: var(--accent); }
.tip-toggle[aria-pressed="true"] .tt-switch::after { left: 13px; }
.cmp-tools { display: flex; justify-content: flex-end; padding: 6px 22px 0; }

/* ---------- measurement tables ---------- */
.meas { margin-top: 14px; padding: 4px 0 8px; }
.meas + .meas { margin-top: 18px; }
.meas-title { padding: 12px 22px 4px; }
.tbl-wrap, .meas > table { overflow-x: auto; }
.meas table { width: 100%; border-collapse: collapse; font-size: 14px; }
.meas th, .meas td { padding: 9px 14px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
.meas thead th { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border-top: 0; }
.meas thead th small { display: block; text-transform: none; letter-spacing: 0; font-weight: 500; }
.meas tbody th { font-weight: 600; }
.meas th:first-child { padding-left: 22px; }
.meas th:last-child, .meas td:last-child { padding-right: 22px; }
.meas td b { font-weight: 700; }
.nw { white-space: nowrap; }
.drop { display: inline-block; position: relative; width: 90px; height: 8px; background: var(--grid); border-radius: 4px; margin-right: 10px; vertical-align: middle; }
.drop i { position: absolute; top: 0; bottom: 0; background: var(--dmg); border-radius: 4px; }
.cmp-table td { text-align: right; white-space: nowrap; font-weight: 700; }
.cmp-table thead th:not(:first-child) { text-align: right; }
.cmp-table tr.base td { color: var(--ink-2); font-weight: 600; }
.cmp-table tbody th { min-width: 260px; }
.cmp-table tbody th small { display: block; font-weight: 500; font-size: 12px; margin-top: 4px; max-width: 52ch; color: var(--ink-2); }
.cmp-table tbody th small.better { color: var(--heal); }
.cmp-table tbody th small.worse { color: var(--dmg); }
.cmp-table td.info { opacity: .75; }
.cmp-swap { display: block; }
.cmp-tools { gap: 12px; align-items: center; flex-wrap: wrap; }
.lvl-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-right: auto; }
.lvl-toggle button { border: 0; background: var(--panel); color: var(--ink-2); font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer; }
.lvl-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--panel); font-weight: 600; }
.check-table td { white-space: nowrap; }
.check-table tbody th { min-width: 280px; }
.chip { display: inline-block; padding: 3px 11px; border-radius: 999px; font-weight: 700; font-size: 13px; border: 1.5px solid currentColor; }
.chip.equal { color: var(--ink-3); }
.chip.tradeoff, .tradeoff { color: var(--c4); }
/* Talent values page: the talent trees, each node coloured by its value */
.tt-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 14px; }
.tt-bar button { background: var(--panel-2, var(--panel)); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tt-bar button.on { color: var(--ink); border-color: var(--accent); }
.tt-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
.tt-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tt-stage { display: grid; grid-template-columns: auto minmax(240px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .tt-stage { grid-template-columns: 1fr; } }
.tt-stage .tt-detail { margin-top: 0; position: sticky; top: 70px; }
.tt-tabs { display: inline-flex; gap: 6px; margin-right: 14px; }
.tt-node.zero { border-color: var(--ink-3) !important; }

.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 12px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--line); stroke-width: 1; }
.chart .marker line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .marker text { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.chart .crosshair { stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
.chart .lane-label { fill: var(--ink-2); font-size: 13px; }
.chart .tick-mark { fill: var(--heal); }
.chart .tick-mark.dmg { fill: var(--dmg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel-2); }
.seg button { border: 0; background: none; font: inherit; font-size: 13px; color: var(--ink-2); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.tooltip {
  position: fixed; z-index: 50; pointer-events: none; min-width: 160px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none;
}
.tooltip .t-head { font-weight: 700; margin-bottom: 4px; }
.tooltip .t-row { display: flex; justify-content: space-between; gap: 16px; }
.tooltip .t-row span:first-child { color: var(--ink-2); }
.tooltip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* ---------- breakdown rows ---------- */
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.breakdown { padding: 8px 0; }
.bd-head, .bd-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) 100px; gap: 18px; align-items: center; padding: 12px 22px; font-size: 16px; }
.bd-head { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); padding-top: 6px; padding-bottom: 6px; }
.bd-head span:last-child { text-align: right; }
.bd-row { border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; font: inherit; color: inherit; }
.bd-row:hover { background: var(--panel-2); }
.bd-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-row .meta { font-size: 14px; margin-top: 2px; color: var(--ink-3); }
.bd-row .num { text-align: right; font-weight: 700; }
.bd-row .num small { display: block; font-weight: 500; color: var(--ink-3); font-size: 13px; }
.bar { display: flex; gap: 2px; height: 12px; }
.bar span { height: 100%; border-radius: 0; }
.bar span:first-child { border-radius: 4px 0 0 4px; }
.bar span:last-child { border-radius: 0 4px 4px 0; }
.bar span:only-child { border-radius: 4px; }
.bar .eff { background: var(--heal); }
.bar .over { background: var(--heal-soft); }
.bar .dmg { background: var(--dmg); }
.chev { color: var(--ink-3); transition: transform .15s; display: inline-block; margin-right: 6px; }
.bd-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.bd-detail { display: none; padding: 4px 20px 16px 40px; background: var(--panel-2); }
.bd-detail.open { display: block; }
.bd-detail table { width: 100%; border-collapse: collapse; font-size: 15px; }
.bd-detail th { text-align: right; font-weight: 500; color: var(--ink-3); padding: 6px 8px; }
.bd-detail th:first-child, .bd-detail td:first-child { text-align: left; }
.bd-detail td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--line); }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.school-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.school-legend i { display: inline-block; width: 22px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.school { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); margin-left: 6px; vertical-align: 1px; }

/* ---------- buffs ---------- */
.uptimes { padding: 8px 20px 16px; display: grid; gap: 10px; }
.uptimes .up { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 52px; gap: 14px; align-items: center; font-size: 15px; }
.uptimes .up .track { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.uptimes .up .fill { height: 100%; background: var(--mana); border-radius: 4px; }
.uptimes .up .pct { text-align: right; font-weight: 600; }

/* ---------- details ---------- */
details.panel { padding: 0; }
details.panel > summary { cursor: pointer; padding: 16px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "Show"; color: var(--ink-3); font-weight: 500; font-size: 13px; }
details.panel[open] > summary::after { content: "Hide"; }
details.panel + details.panel { margin-top: 12px; }
.detail-body { padding: 0 20px 20px; }
.gear { width: 100%; border-collapse: collapse; font-size: 15px; }
.gear td { padding: 8px 0; border-top: 1px solid var(--line); }
.gear td:first-child { color: var(--ink-3); width: 140px; text-transform: capitalize; }
.gear td:last-child { text-align: right; font-weight: 600; width: 60px; }
code.block { display: block; padding: 12px; background: var(--panel-2); border-radius: 8px; font-size: 13px; word-break: break-all; color: var(--ink-2); }
.empty { padding: 24px 20px; color: var(--ink-2); }
.footer { margin-top: 56px; color: var(--ink-3); font-size: 13px; }

@media (max-width: 900px) {
  .matchup { grid-template-columns: 1fr; }
  .side.healer, .side.boss { border-radius: 14px; border: 1px solid var(--line); }
  .side.boss { text-align: left; }
  .side.boss::before { inset: 0 auto 0 0; }
  .vs { flex-direction: row; gap: 12px; border: 0; background: none; padding: 12px 0; }
  .verdict { grid-template-columns: 1fr; }
  .two-col, .act-grid, .death-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
  .brand span { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .side .name { font-size: 28px; }
  .bd-head, .bd-row { grid-template-columns: minmax(0, 1fr) 80px; }
  .bd-head span:nth-child(2), .bd-row .barcell { display: none; }
}

/* ---------- stat chips with icons (gear sheet) ---------- */
.cs-stats { gap: 10px 12px; }
.cs-stat { flex-direction: row; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 12px;
  background: color-mix(in srgb, var(--sc) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--sc) 22%, var(--line)); }
.cs-stat .si { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--sc) 20%, transparent); color: var(--sc); }
.cs-stat .si svg { width: 17px; height: 17px; }
.cs-stat .sv { display: flex; flex-direction: column; line-height: 1.15; }
.cs-stat .sv span { font-size: 10.5px; }
.cs-stat .sv b { font-size: 16px; }
.cs-stat .sv b small { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.gi-pts { font-size: 11.5px; font-weight: 700; color: var(--heal); margin-top: 3px; }
.cs-extras { padding: 16px 20px 18px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--ink) 3%, var(--panel)); display: grid; gap: 14px; }
.ex-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; align-items: start; }
.ex-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.ex-count { font-size: 12px; color: var(--ink-3); }
.ex-rows { display: grid; }
.ex-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; font-size: 13px; }
.ex-row + .ex-row { border-top: 1px dashed var(--grid); }
.ex-name { min-width: 0; }
.ex-name .gi-gem, .ex-name .gi-ench { font-size: 13px; margin: 0; }
.ex-detail { color: var(--ink-3); font-size: 12px; white-space: nowrap; text-align: right; }
.ex-detail b { color: var(--ink); }
.cs-extras p { font-size: 13px; margin-top: 6px; }
.ex-buffs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ex-buffs .cs-label { margin-right: 6px; }
.ex-chip { font-size: 12.5px; padding: 3px 10px 3px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.stats-note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.kv-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 18px; }
.kv-chips .cs-stat { padding: 5px 10px 5px 5px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts dt { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.facts dd { margin: 0; font-size: 18px; font-weight: 700; }
.facts dd.n { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.abilities.compact { gap: 5px; margin-top: 14px; }
.abilities.compact li { align-items: center; font-size: 14px; }
.abilities .kind { font-size: 11px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; }

/* ---------- section intros and "How it works" ---------- */
.section-head p { max-width: 82ch; }
/* As wide as the section's panels; open, the text flows in two columns on wide screens so lines stay readable. */
details.explain { margin-top: 2px; align-self: stretch; }
details.explain > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  color: var(--accent); padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
details.explain > summary::-webkit-details-marker { display: none; }
details.explain > summary::before { content: "▸"; transition: transform .15s; display: inline-block; }
details.explain[open] > summary::before { transform: rotate(90deg); }
.explain-body { margin-top: 10px; padding: 18px 22px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  color: var(--ink-2); font-size: 14px; line-height: 1.6; columns: 2 420px; column-gap: 40px; column-rule: 1px solid var(--line); }
.explain-body b { color: var(--ink); }
.explain-body p { margin: 0 0 12px; }
.explain-body h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); break-after: avoid; }
.explain-body p + h4, .explain-body ul + h4 { margin-top: 18px; }
.explain-body ul { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 4px; break-inside: avoid; }
.explain-body p, .explain-body li { break-inside: avoid; }
.ex-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0 0 12px; break-inside: avoid; }
.ex-table th, .ex-table td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); }
.ex-table th:first-child, .ex-table td:first-child { text-align: left; }
.ex-table th { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.ex-table td.dead { color: var(--dmg); font-weight: 600; }
.ex-table tr.sum td { border-bottom: 0; font-weight: 700; color: var(--ink); }
.explain-body code { font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

/* ---------- upgrades summary (top of the gear check) ---------- */
.up-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.up-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.up-card h3 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.up-nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.up-list .gain.tradeoff { color: var(--c4); }
.swap { display: flex; flex-direction: column; gap: 4px; }
.swap-line { display: block; line-height: 1.35; }
.swap-from { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
.swap-from a.wh-item { font-weight: 600; }
.ilvl { display: inline-block; font-size: 11px; font-weight: 700; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 7px; margin-left: 2px; vertical-align: 1px; }
.ilvl.dim { color: var(--ink-3); font-weight: 600; }
.combo-tag { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 999px; padding: 1px 8px; }
.up-sub { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.up-worth { font-size: 14px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; border-left: 3px solid var(--accent); background: var(--panel-2); }
.up-worth b { color: var(--ink); }
.up-num { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); min-width: 0; }
.up-num .l { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.up-num .v { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.up-num .n { font-size: 12px; color: var(--ink-3); }
.up-num.best { border-color: color-mix(in srgb, var(--heal) 45%, var(--line)); background: color-mix(in srgb, var(--heal) 8%, var(--panel-2)); }
.up-num.best .v { color: var(--heal); }
.up-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.up-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 14px; }
.up-list li small { display: block; color: var(--ink-3); font-size: 12px; }
.up-list .gain { font-weight: 800; color: var(--heal); white-space: nowrap; }
.up-none { color: var(--ink-2); font-size: 14px; }
.up-foot { font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 10px; }
.vs .lim-pat { font-size: 12px; color: var(--ink-2); }
.vs .lim-pat b { color: var(--ink); }

/* ---------- floating buttons: palette and in-game tooltips ---------- */
.dock { position: fixed; right: 18px; bottom: 18px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.dock-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); color: var(--ink-2);
  font: inherit; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); backdrop-filter: blur(8px); }
.dock-btn:hover { color: var(--ink); border-color: var(--accent); }
.dock-btn svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
.dock-btn b { color: var(--ink); }
.dock .tip-toggle { height: 40px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); }
.palettes { display: none; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); gap: 4px; flex-direction: column; min-width: 190px; }
.palettes.open { display: flex; }
.palettes button { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 7px 10px; border-radius: 9px; cursor: pointer; text-align: left; }
.palettes button:hover { background: var(--panel-2); color: var(--ink); }
.palettes button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); font-weight: 700; }
.swatch { display: inline-flex; width: 38px; height: 18px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(128, 128, 128, .35); flex: none; }
.swatch i { flex: 1; }
@media (max-width: 600px) { .dock { right: 12px; bottom: 12px; } .dock-btn .lbl, .dock .tip-toggle .lbl { display: none; } }
@media print { .dock { display: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand">Healer report</div>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#summary">Summary</a>
      <a href="#timeline">Timeline</a>
      <a href="#activity">Activity</a>
      <a href="#healing">Healing</a>
      <a href="#damage">Damage taken</a>
      <a href="#mana">Mana &amp; buffs</a>
      <a href="#details">Details</a>
    </nav>
  </div>
</header>

<main id="app"></main>
<div class="dock" id="dock">
  <div class="palettes" id="palettes" role="menu" aria-label="Colour palette"></div>
  <button class="dock-btn" id="paletteBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Colour palette">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
    <span class="lbl">Palette: <b id="paletteName"></b></span></button>
  <button class="tip-toggle" id="tipBtn" type="button" aria-pressed="true" title="Show the in-game item tooltip when hovering an item">
    <span class="tt-switch" aria-hidden="true"></span><span class="lbl">In-game tooltips: </span><b class="tt-state">On</b></button>
</div>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script id="simc-data" type="application/json">__SIMC_DATA__</script>
<script>
(function () {
"use strict";

// ---------------------------------------------------------------- helpers
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, html = "") => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (html) n.innerHTML = html;
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mean = v => (v == null ? 0 : typeof v === "number" ? v : (v.mean ?? 0));
const series = t => (t == null ? [] : Array.isArray(t) ? t : (t.data || []));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

function fmtNum(n, digits = 1) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(digits) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(digits) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e5 ? 0 : digits) + "k";
  return Math.round(n).toString();
}
const fmtPct = (p, d = 0) => (isFinite(p) ? (p * 100).toFixed(d) + "%" : "–");
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}
function prettyName(n) {
  return String(n || "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
// Multi-school spells are drawn as a blend of their component schools (SimC school names).
const SCHOOL_PARTS = {
  astral: ["arcane", "nature"], frostfire: ["frost", "fire"], holystrike: ["holy", "physical"],
  flamestrike: ["fire", "physical"], holyfire: ["holy", "fire"], stormstrike: ["nature", "physical"],
  holystorm: ["holy", "nature"], firestorm: ["fire", "nature"], froststrike: ["frost", "physical"],
  holyfrost: ["holy", "frost"], froststorm: ["frost", "nature"], shadowstrike: ["shadow", "physical"],
  shadowlight: ["shadow", "holy"], shadowflame: ["shadow", "fire"], shadowstorm: ["shadow", "nature"],
  shadowfrost: ["shadow", "frost"], spellstrike: ["arcane", "physical"], divine: ["arcane", "holy"],
  spellfire: ["arcane", "fire"], spellfrost: ["arcane", "frost"], spellshadow: ["arcane", "shadow"],
  elemental: ["fire", "frost", "nature"],
  cosmic: ["holy", "nature", "frost", "shadow", "arcane"],
  chromatic: ["fire", "frost", "nature", "shadow", "arcane"],
  chromastrike: ["physical", "fire", "frost", "nature", "shadow", "arcane"],
  magic: ["holy", "fire", "nature", "frost", "shadow", "arcane"],

function movingAvg(arr, w) {
  if (w <= 1) return arr.slice();
  const out = new Array(arr.length);
  let acc = 0;
  for (let i = 0; i < arr.length; i++) {
    acc += arr[i];
    if (i >= w) acc -= arr[i - w];
    out[i] = acc / Math.min(i + 1, w);
  }

}

// its limit and (version 4) measured at fixed damage levels (sim.tolerance.levels, 1 = one healer's share): how low the
// raid goes in the bursts and how fast it comes back, deaths and what caused them, healing in bursts vs quiet time. The
// whole thing runs once per damage pattern (sim.tolerance.patterns, the fight as set up first).
let tolerance = null, patterns = [""];

const tolSetups = tol?.setups || [];

{

const LIMIT_NOISE = 0.005;

const LEVELS = tol?.version >= 4 ? (tol.levels || []).slice().sort((a, b) => a - b) : [];
