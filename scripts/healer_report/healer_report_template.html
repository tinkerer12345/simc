    "apl_variable.rj_pre=8": "When Convoke is about to be ready, press Rejuvenation (on players without one first) until 8 are out, then Convoke.",
    "apl_variable.rj_pre=12": "When Convoke is about to be ready, press Rejuvenation until 12 are out, then Convoke.",
    "apl_variable.rj_pre=16": "When Convoke is about to be ready, press Rejuvenation until 16 are out, then Convoke.",
    "apl_variable.rj_keep=6": "Outside ramps, keep about 6 Rejuvenations out (on players without one first), whatever their health, instead of 5 plus more while someone is hurt.",
    "apl_variable.rj_keep=10": "Outside ramps, keep about 10 Rejuvenations out.",
    "apl_variable.rj_keep=14": "Outside ramps, keep about 14 Rejuvenations out.",
    "apl_variable.tree=1": "While Tree of Life is up (Rejuvenation 40% stronger and 30% cheaper), put a Rejuvenation on everyone who has none, before anything but dispels.",
    "apl_variable.tree=2": "While Tree of Life is up, keep two Rejuvenations (Germination) on everyone.",
    "apl_variable.tree=3": "While Tree of Life is up (Wild Growth hits 7), cast Wild Growth whenever it is ready and 3 or more are hurt.",
    "apl_variable.tree=4": "While Tree of Life is up: Wild Growth whenever ready, and a Rejuvenation on everyone who has none.",
    "apl_variable.tree=5": "While Tree of Life is up (Regrowth is instant), Regrowth anyone below 90% who doesn't have one.",
    "apl_variable.tree=6": "While Tree of Life is up, a Rejuvenation on everyone who has none, but only where the normal Rejuvenation filler would go (after Swiftmend, Wild Growth and Regrowth).",
    "apl_variable.tree=7": "While Tree of Life is up: Wild Growth whenever ready, and a Rejuvenation on everyone who has none where the normal filler would go.",
    "apl_variable.wg=0": "Your play until 2026-11-12: Wild Growth when 5 or more players are below 90% health, only while you have 40% mana or more.",
    "apl_variable.wg=6": "Wild Growth when 5 or more players are below 90% health, down to 20% mana.",
    "apl_variable.wg=2": "Wild Growth as soon as 3 players are below 90% health (instead of 5), at any mana.",
    "apl_variable.wg=3": "Wild Growth only once 7 players are below 90% health (instead of 5), at any mana.",
    "apl_variable.wg=4": "Wait until 5 players are below 80% health (instead of 90%) before casting Wild Growth.",
    "apl_variable.wg_hold=10": "Your play until 2026-11-12: don't cast Wild Growth in the 10 seconds before Convoke (it is still cast as part of the Convoke opener).",
    "apl_variable.wg_hold=20": "Don't cast Wild Growth in the 20 seconds before Convoke (it is still cast as part of the Convoke opener).",
    "apl_variable.blanket=2": "Spend spare mana on Rejuvenation for everyone missing one, even ahead of your filler Regrowths.",
  };
  const choiceNames = [...new Set(checks.flatMap(c => c.rows.filter(r => r.name.startsWith("Choice: ")).map(r => r.name)))];

  // Every talent set mapped onto the tree by trait entry id.
  const tree = healer?.talent_tree || [];
  const tests = {};  // entry -> [{ kind: "remove"|"add"|"swap", set, from? }]
  for (const s of talentSets) {
    // only single-talent tests belong on a node; legal builds (several talents) and rotation choices have their own sections
    if (!/^(Talent|Add|Swap|Tier): /.test(s.name)) continue;
    const m = /^\w+_talents=(.+)$/.exec(s.options?.[0] || "");
    if (!m) continue;
    const parts = m[1].split("/").map(p => p.split(":").map(Number));
    const kind = s.name.startsWith("Talent: ") ? "remove" : s.name.startsWith("Swap: ") ? "swap" : s.name.startsWith("Tier: ") ? "tier" : "add";
    const entry = kind === "swap" ? parts[1]?.[0] : parts[0]?.[0];
    (tests[entry] ||= []).push({ kind, set: s.name, from: kind === "swap" ? parts[0][0] : null });
  }
  // Talents the sim can't value (checked in sc_druid.cpp, 2026-11-12): their numbers would mean nothing, so the page says why.
  const NOT_SIMULATED = {
    "Restoration Druid": {
      "Verdant Infusion": "SimC doesn't simulate it yet",
      "Regenesis": "SimC doesn't simulate it yet", "Regenerative Heartwood": "SimC doesn't simulate it yet",
      "Embrace of the Dream": "SimC doesn't simulate it yet", "Waking Dream": "SimC doesn't simulate it yet",
      "Grove Guardians": "SimC doesn't simulate it yet", "Dream of Cenarius": "SimC doesn't simulate it yet",
      "Incarnation: Tree of Life": "your priority list never casts it",
    },
  }[healer?.specialization] || {};
  // What each tier of a tiered (apex) node does, by its spell; tiers fill in order.
  const TIER_TEXT = { 392167: "the extra Lifebloom stacks", 1244331: "the final bloom healing injured allies", 1244470: "Blooming Frenzy" };
  const tierLoss = (n, keep) => { let left = keep; return (n.tiers || []).filter(t => { const r = Math.min(left, t.max_rank); left -= r; return r < t.max_rank; })
    .map(t => TIER_TEXT[t.spell] || `tier ${t.entry}`).join(", "); };
  const optionsOf = n => n.choice && n.options?.length ? n.options : [{ name: n.name, entry: n.entry, spell: n.spell }];
  // What a node is worth on pattern c: for yours, what switching it off costs; for one you don't have, the best of its
  // options taken on top of your build. Positive = it helps you.
  const valueOf = (n, c) => {
    const d = t => { const r = rowOf(c, t.set); return r && r.d != null ? r.d : null; };
    if (n.rank > 0) {
      const rm = (tests[n.entry] || []).find(t => t.kind === "remove");
      const v = rm && !NOT_SIMULATED[n.name] ? d(rm) : null;
      const alts = optionsOf(n).filter(o => o.entry !== n.entry).flatMap(o => (tests[o.entry] || []).filter(t => t.kind === "swap").map(t => ({ o, d: d(t), say: `Taking <b>${esc(o.name)}</b> instead:` })));
      const more = (tests[n.entry] || []).filter(t => t.kind === "add").map(t => ({ o: { name: `${n.name} (all ${n.max_rank} ranks)` }, d: d(t), ranks: true, say: `Taking all ${n.max_rank} ranks:` }));
      // a tiered (apex) node stepped down: what its last tiers are worth (positive = they help)
      const tiers = (tests[n.entry] || []).filter(t => t.kind === "tier").map(t => {
        const keep = +/down to (\d+)/.exec(t.set)[1], lost = tierLoss(n, keep), x = d(t);
        return { o: { name: `${n.name}: ranks ${keep + 1}-${n.max_rank}` }, d: x == null ? null : -x, tier: keep, say: `Its ranks ${keep + 1}-${n.max_rank} (${lost}) are worth:` };
      });
      return { v: v == null ? null : -v, shown: n, tiers: tiers.filter(a => a.d != null), alts: alts.concat(more).filter(a => a.d != null && !NOT_SIMULATED[a.o.name]), nyi: NOT_SIMULATED[n.name],
        nyiAlts: optionsOf(n).filter(o => o.entry !== n.entry && NOT_SIMULATED[o.name]) };
    }
    const adds = optionsOf(n).filter(o => !NOT_SIMULATED[o.name]).map(o => ({ o, t: (tests[o.entry] || []).find(t => t.kind === "add") })).filter(x => x.t)
      .map(x => ({ o: x.o, d: d(x.t), say: `<b>${esc(x.o.name)}</b> (the other option):` })).filter(x => x.d != null).sort((a, b) => b.d - a.d);
    const nyiOpts = optionsOf(n).filter(o => NOT_SIMULATED[o.name]);
    return { v: adds.length ? adds[0].d : null, shown: adds.length ? adds[0].o : nyiOpts[0] || n, alts: adds.slice(1),
      nyi: !adds.length && nyiOpts.length ? NOT_SIMULATED[nyiOpts[0].name] : null, nyiAlts: adds.length ? nyiOpts : nyiOpts.slice(1) };
  };
  const clsOf = (v, c) => v == null ? "untested" : v > c.noise ? "good" : v < -c.noise ? "bad" : "zero";
  const sentence = (n, c) => {
    const { v, shown, alts, nyi, nyiAlts, tiers = [] } = valueOf(n, c), share = v == null ? 0 : pctOf(c, v), cls = clsOf(v, c);
    const pts = v == null ? "" : ` <span class="faint">(${signedPts2(v)})</span>`;
    let s;
    if (nyi) s = `<b>Not simulated</b>: ${nyi}, so the sim can't say what it's worth.`;
    else if (v == null) s = n.name === "Rejuvenation" ? "Not tested: other spells need Rejuvenation." : "Not tested.";
    else if (n.rank > 0) s = cls === "good" ? `Worth it: with it you keep <b>${fmtShare(share)} more</b> raid health${pts}.`
      : cls === "zero" ? `Within the noise${pts}: it changes nothing you can measure here (often utility, defensive or movement, or rarely used).`
      : `The sim kept <b>${fmtShare(share)} more</b> raid health <b>without</b> it${pts}: on this fight and with your priority list you'd do better without it (worth a second look, not proof).`;
    else s = cls === "good" ? `Taking it would keep <b>${fmtShare(share)} more</b> raid health${pts}, counted on top of your build: you'd have to drop a talent for it, so compare with what yours are worth.`
      : cls === "zero" ? `Taking it changes nothing you can measure${pts} (often utility, or something your priority list doesn't cast).`
      : `Taking it would cost you <b>${fmtShare(share)}</b> of the raid health you keep${pts}, even for free.`;
    const alt = alts.map(a => `<div class="tt-sub">${a.say} ${signedShare(pctOf(c, a.d))} <span class="faint">(${signedPts2(a.d)}, ${clsOf(a.d, c) === "good" ? "better" : clsOf(a.d, c) === "bad" ? "worse" : "within the noise"})</span></div>`).join("");
    const nyiAlt = nyiAlts.map(o => `<div class="tt-sub"><b>${esc(o.name)}</b>${n.rank > 0 ? " instead" : " (the other option)"}: not simulated (${NOT_SIMULATED[o.name]}).</div>`).join("");
    const tierHtml = tiers.map(a => `<div class="tt-sub">${a.say} ${signedShare(pctOf(c, a.d))} <span class="faint">(${signedPts2(a.d)}, ${clsOf(a.d, c) === "good" ? "worth it" : clsOf(a.d, c) === "bad" ? "better without" : "within the noise"})</span></div>`).join("");
    return `<div><b>${esc(patternLabel(c.pattern))}:</b> ${s}</div>${tierHtml}${alt}${nyiAlt}`;
  };
  const detailHtml = n => {
    const { shown } = valueOf(n, checks[0]);
    const what = n.rank > 0 ? `You have it${n.max_rank > 1 ? ` (${n.rank}/${n.max_rank})` : ""}.` : "You don't have it.";
    return `<div class="tt-detail-head"><b>${esc(n.rank > 0 ? n.name : shown.name)}</b> <span class="faint">${what}</span></div>${checks.map(c => sentence(n, c)).join("")}`;
  };

  const SMALL = { STEP: 42, SIZE: 32, PAD: 12 }, BIG = { STEP: 64, SIZE: 46, PAD: 18 };
  const abbr = name => name.split(/[\s-]+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).join("").slice(0, 3) || name.slice(0, 3);
  const iconOf = entry => layout.icon[entry] ? `<img src="https://wow.zamimg.com/images/wow/icons/large/${layout.icon[entry]}.jpg" alt="" loading="lazy" onerror="this.remove()">` : "";
  const at = (n, g) => `left:${g.PAD + (n.col - 1) * g.STEP}px;top:${g.PAD + (n.row - 1) * g.STEP}px;width:${g.SIZE}px;height:${g.SIZE}px`;
  // Colour scales with value: the most valuable talent of the pattern is full green, small values fade toward grey.
  const heatMax = c => Math.max(1e-9, ...tree.map(n => valueOf(n, c).v ?? 0));
  const nodeHtml = (n, c, i, g = BIG) => {
    const { v, shown, alts, nyi } = valueOf(n, c), cls = nyi ? "nyi" : clsOf(v, c), mine = n.rank > 0;
    const better = mine && alts.some(a => a.d > c.noise);
    const h = cls === "good" ? Math.min(1, Math.max(0, v / heatMax(c))) : 0;
    const col = cls === "good" ? `color-mix(in srgb, var(--heal) ${Math.round(30 + 70 * h)}%, var(--ink-3))` : "";
    const badge = nyi ? `<span class="tt-badge">?</span>` : v == null || cls === "zero" ? "" : `<span class="tt-badge">${signedShare(pctOf(c, v))}</span>`;
    return `<div class="tt-node ${cls} ${mine ? "mine" : "notmine"}${n.choice ? " choice" : ""}" data-i="${i}" tabindex="0"
      style="${at(n, g)}${col ? `;border-color:${col}` : ""}${mine && h > 0.5 ? `;--glow:${col}` : ""}">
      <span class="tt-abbr">${esc(abbr(shown.name))}</span>${iconOf(shown.entry)}
      ${n.max_rank > 1 && mine ? `<span class="tt-rank">${n.rank}/${n.max_rank}</span>` : ""}${better ? `<span class="tt-alt" title="another option is better">&#8644;</span>` : ""}${badge}</div>`;
  };

  // Every value as a table too: yours by what switching them off costs, then the ones you don't have by what they'd add.
  const tableRows = tree.flatMap(n => {
    if (n.rank > 0) {
      const own = [{ label: n.name, mine: true, v: c => valueOf(n, c).v }];
      const alts = optionsOf(n).filter(o => o.entry !== n.entry).map(o => ({ label: `${o.name} instead of ${n.name}`, mine: false, nyiName: o.name, v: c => valueOf(n, c).alts.find(a => a.o.entry === o.entry)?.d ?? null }));
      const more = (tests[n.entry] || []).some(t => t.kind === "add") ? [{ label: `${n.name}: all ${n.max_rank} ranks`, mine: false, v: c => valueOf(n, c).alts.find(a => a.ranks)?.d ?? null }] : [];
      const tiers = (tests[n.entry] || []).filter(t => t.kind === "tier").map(t => { const keep = +/down to (\d+)/.exec(t.set)[1];
        return { label: `${n.name}: ranks ${keep + 1}-${n.max_rank} only (${tierLoss(n, keep)})`, mine: true, v: c => valueOf(n, c).tiers?.find(a => a.tier === keep)?.d ?? null }; });
      return own.concat(tiers, alts, more);
    }
    return optionsOf(n).map(o => ({ label: o.name, mine: false, nyiName: o.name, v: c => { const x = valueOf(n, c); return x.shown.entry === o.entry ? x.v : x.alts.find(a => a.o.entry === o.entry)?.d ?? null; } }));
  });
  const cell = (c, v, mine, label0) => {
    if (NOT_SIMULATED[label0]) return `<td><span class="chip equal">Not simulated</span> <small class="faint">${NOT_SIMULATED[label0]}</small></td>`;
    if (v == null) return "<td>–</td>";
    const cls = clsOf(v, c), chip = cls === "good" ? "worse" : cls === "bad" ? "better" : "equal";
    const label = mine ? (cls === "good" ? "Worth it" : cls === "bad" ? "Better without?" : "Within the noise")
      : (cls === "good" ? "Would help" : cls === "bad" ? "Would hurt" : "Within the noise");
    return `<td><span class="chip ${chip}">${label}</span> <b>${signedShare(pctOf(c, v))}</b> <small class="faint">(${signedPts2(v)})</small></td>`;
  };
  const tableOf = (rows, title) => `<h3 style="margin:16px 0 8px">${title}</h3><div class="panel tbl-wrap"><table class="cmp"><thead><tr><th>Talent</th>${
    checks.map(c => `<th>${esc(patternLabel(c.pattern))}</th>`).join("")}</tr></thead><tbody>${rows
    .sort((a, b) => (b.v(checks[0]) ?? -99) - (a.v(checks[0]) ?? -99))
    .map(r => `<tr><th scope="row">${esc(r.label)}</th>${checks.map(c => cell(c, r.v(c), r.mine, r.nyiName)).join("")}</tr>`).join("")}</tbody></table></div>`;

  const sec = el("section", { id: "talents" });
  sec.style.marginTop = "28px";

  // ----- how fresh each section is: the newest "ran" stamp among its sets; kept sets came from an earlier full run.
  const ranOf = prefix => { const xs = talentSets.filter(s => prefix.test(s.name)); const r = xs.map(s => s.ran).filter(Boolean).sort().pop();
    return { ran: r, kept: xs.some(s => s.kept), stale: xs.some(s => s.stale) }; };
  const fresh = prefix => { const x = ranOf(prefix); if (!x.ran && !x.kept) return "";
    return `<div class="sim-when${x.stale ? " stale" : ""}">${x.kept ? `From the last full talent run${x.ran ? ` (${esc(x.ran)})` : ""}` : `Simulated ${esc(x.ran)}`}${
      x.stale ? ": your setup has changed since then. Run <b>talents</b> to refresh these numbers." : ""}</div>`; };
  const TALENT_RX = /^(Talent|Add|Swap|Tier|Build): /, CHOICE_RX = /^Choice: /;

  // One set over the damage patterns: its rows, a colour (good / zero / bad) and the % per pattern.
  const judge = n => {
    const rows = checks.map(c => ({ c, r: rowOf(c, n) })).filter(x => x.r && x.r.d != null);
    const vs = rows.map(x => x.r.verdict);
    const cls = vs.some(v => v === "worse" || v === "tradeoff") ? "bad" : vs.some(v => v === "better") ? "good" : "zero";
    return { rows, cls, mean: rows.reduce((s, x) => s + pctOf(x.c, x.r.d), 0) / Math.max(1, rows.length) };
  };
  const pcts = rows => rows.map(({ c, r }) => `<span class="gl-pct ${r.verdict === "better" ? "good" : r.verdict === "worse" || r.verdict === "tradeoff" ? "bad" : "zero"}" title="${esc(patternLabel(c.pattern))}"><small>${esc(shortPat(c))}</small> ${signedShare(pctOf(c, r.d))}</span>`).join("");
  const shortPat = c => patternLabel(c.pattern).replace(/^Bursts every /i, "") + (/^Bursts every /i.test(patternLabel(c.pattern)) ? " bursts" : "");
  const healthNow = c => (c.b * 100).toFixed(1) + "%", healthWith = (c, d) => ((c.b + d) * 100).toFixed(1) + "%";
  // What the % means, in plain words, with this run's own numbers.
  const explainPct = () => `<div class="panel rt-explain"><b>What the % means</b>
    <p>The sim tracks how healthy your raid stays across the fight, on average (a dead player counts as empty). With your current
      talents the raid stays at ${checks.map(c => `<b>${healthNow(c)}</b> (${esc(shortPat(c))})`).join(" and ")}.</p>
    <p><b>+1.0%</b> means the raid keeps 1% more of its health than now (for example ${healthNow(checks[0])} &rarr; ${healthWith(checks[0], checks[0].b * 0.01)}):
      fewer players sitting low when the next hit lands, so fewer deaths. <b>&minus;</b> means it keeps less.</p>
    <p>Each swap is played on both damage patterns. Anything within about &plusmn;${(100 * checks[0].noise / checks[0].b).toFixed(1)}% is noise and reads "Same".</p></div>`;
  const patNames = checks.map(c => esc(patternLabel(c.pattern))).join(" / ");
  const CHIP = { good: ["better", "Better"], zero: ["equal", "Same"], bad: ["worse", "Worse"] };
  const chipOf = cls => `<span class="chip ${CHIP[cls][0]}">${CHIP[cls][1]}</span>`;

  // ----- talent routes: what a legal build changes on the tree (from its talent lines), drawn on the tree
  const buildNames = [...new Set(checks.flatMap(c => c.rows.filter(r => r.name.startsWith("Build: ")).map(r => r.name)))];
  const changeOf = name => {
    const m = /^(\w+)_talents=(.+)$/.exec(talentSets.find(s => s.name === name)?.options?.[0] || "");
    if (!m) return null;
    const part = Object.fromEntries(m[2].split("/").map(p => p.split(":").map(Number)));
    const treeName = m[1] === "class" ? "class" : m[1] === "spec" ? "spec" : "hero";
    const after = {}, label = {}, take = [], drop = [];
    for (const n of tree) {
      let r = n.rank, nm = n.name;
      if (n.tiers) r = n.tiers.reduce((s, t) => s + (part[t.entry] ?? t.rank), 0);
      else if (n.choice && n.options) {
        const on = n.options.find(o => part[o.entry] > 0);
        if (on) { r = 1; nm = on.name; } else if (part[n.entry] === 0) r = 0;
      } else if (part[n.entry] != null) r = part[n.entry];
      after[n.node] = r; label[n.node] = nm;
      if (r > n.rank) take.push({ n, name: nm, from: n.rank, to: r });
      if (r < n.rank) drop.push({ n, name: n.name, from: n.rank, to: r });
    }
    return { treeName, after, label, take, drop };
  };
  // Talents whose measured value is known to be shaky: a route touching one says so.
  const CAVEAT = { "Restoration Druid": {} }[healer?.specialization] || {};
  const caveatsOf = ch => [...new Set(ch.take.concat(ch.drop).map(x => CAVEAT[x.n.name]).filter(Boolean))];
  const rankWord = x => x.n.max_rank > 1 ? ` ${x.to}/${x.n.max_rank}` : "";
  const changeText = ch => `<span class="rt-take-t">+ ${ch.take.map(x => esc(x.name) + rankWord(x)).join(", ")}</span>
    <span class="rt-drop-t">− ${ch.drop.map(x => esc(x.name) + (x.to > 0 ? ` to ${x.to}/${x.n.max_rank}` : "")).join(", ")}</span>`;

  // A tree drawn from any rank function; nodeFn draws each node.
  const drawTree = (t, label, rankOf, nodeFn, g = SMALL) => {
    const { STEP, SIZE, PAD } = g;
    const nodes = tree.map((n, i) => ({ n, i })).filter(x => x.n.tree === t);
    if (!nodes.length) return "";
    const minCol = Math.min(...nodes.map(x => x.n.col)), minRow = Math.min(...nodes.map(x => x.n.row));
    const placed = nodes.map(x => ({ n: { ...x.n, col: x.n.col - minCol + 1, row: x.n.row - minRow + 1 }, i: x.i }));
    const byNode = Object.fromEntries(placed.map(x => [x.n.node, x.n]));
    const W = PAD * 2 + (Math.max(...placed.map(x => x.n.col)) - 1) * STEP + SIZE, H = PAD * 2 + (Math.max(...placed.map(x => x.n.row)) - 1) * STEP + SIZE;
    const cx = n => PAD + (n.col - 1) * STEP + SIZE / 2, cy = n => PAD + (n.row - 1) * STEP + SIZE / 2;
    const lines = placed.flatMap(({ n }) => (layout.next[n.node] || []).map(id => byNode[id]).filter(Boolean).map(m =>
      `<line x1="${cx(n)}" y1="${cy(n)}" x2="${cx(m)}" y2="${cy(m)}" class="${rankOf(n) > 0 && rankOf(m) > 0 ? "on" : ""}"/>`)).join("");
    const points = placed.reduce((s, x) => s + rankOf(x.n), 0);
    return `<div class="panel tt-tree"><h3>${label} <span class="faint">${t === "hero" ? "" : esc((healer?.specialization || "").split(" ")[t === "class" ? 1 : 0] || "") + " · "}${points} points</span></h3>
      <div class="tt-canvas" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" aria-hidden="true">${lines}</svg>
      ${placed.map(x => nodeFn(x.n, x.i, g)).join("")}</div></div>`;
  };
  const TREES = [["class", "Class"], ["hero", "Hero"], ["spec", "Specialization"]];
  const treeHtml = (c, t) => { const x = TREES.find(y => y[0] === t) || TREES[2]; return drawTree(x[0], x[1], n => n.rank, (n, i, g) => nodeHtml(n, c, i, g), BIG); };
  const routeHtml = name => {
    const ch = changeOf(name);
    if (!ch) return "";
    const node = (n, i, g) => {
      const r = ch.after[n.node], took = r > n.rank, lost = r < n.rank;
      const cls = took ? "rt-take" : lost ? "rt-drop" : r > 0 ? "rt-keep" : "rt-off";
      const mark = took ? `<span class="rt-mark">+${n.max_rank > 1 ? r - n.rank : ""}</span>` : lost ? `<span class="rt-mark">−${n.max_rank > 1 && r > 0 ? n.rank - r : ""}</span>` : "";
      return `<div class="tt-node ${cls}${n.choice ? " choice" : ""}" style="${at(n, g)}" title="${esc(ch.label[n.node])}${
        took ? ": take" : lost ? (r > 0 ? `: down to ${r}/${n.max_rank}` : ": drop") : ""}"><span class="tt-abbr">${esc(abbr(ch.label[n.node]))}</span>${iconOf((n.choice && n.options?.find(o => o.name === ch.label[n.node]))?.entry ?? n.entry)}${n.max_rank > 1 && r > 0 ? `<span class="tt-rank">${r}/${n.max_rank}</span>` : ""}${mark}</div>`;
    };
    const t = TREES.find(x => x[0] === ch.treeName);
    return `<div class="tt-trees">${drawTree(t[0], t[1], n => ch.after[n.node], node)}</div>`;
  };
  const routeDetail = name => {
    const ch = changeOf(name), j = judge(name);
    const nyi = ch.take.filter(x => NOT_SIMULATED[x.name]).map(x => x.name);
    const say = j.cls === "good" ? (j.rows.every(x => x.r.verdict === "better") ? "An upgrade on both damage patterns." : "Better on one damage pattern, the same on the other.")
      : j.cls === "bad" ? "Your build is better: keep it." : "No real difference.";
    return `<div class="rt-head">${chipOf(j.cls)} <b>${say}</b></div><div class="rt-change">${changeText(ch)}</div>
      ${j.rows.map(({ c, r }) => `<div class="rt-line"><b>${esc(shortPat(c))}:</b> your raid stays at <b>${healthWith(c, r.d)}</b> health instead of ${healthNow(c)} <span class="gl-pct ${r.verdict === "better" ? "good" : r.verdict === "worse" || r.verdict === "tradeoff" ? "bad" : "zero"}">${signedShare(pctOf(c, r.d))}</span></div>`).join("")}
      ${nyi.length ? `<div class="faint">${esc(nyi.join(", "))}: not simulated, only there to open the path.</div>` : ""}
      ${caveatsOf(ch).map(t => `<div class="rt-caveat">&#9888; ${esc(t)}</div>`).join("")}`;
  };
  const builds = buildNames.map(n => ({ n, j: judge(n) })).sort((a, b) => b.j.mean - a.j.mean);
  const goodBuilds = builds.filter(b => b.j.cls !== "bad"), badBuilds = builds.filter(b => b.j.cls === "bad");
  const routeRow = b => { const ch = changeOf(b.n); return `<button class="rt-row" data-b="${esc(b.n)}">${chipOf(b.j.cls)}<span class="rt-txt">${changeText(ch)}</span><span class="rt-pcts">${pcts(b.j.rows)}</span></button>`; };
  const buildsHtml = builds.length ? `
    <div class="section-head" id="routes"><h2>Talent routes</h2>${fresh(TALENT_RX)}
      <p>Legal swaps from your build: the cheapest path to a talent worth having, paid for by the talents you'd lose least. Pick one to see it on your tree
        (<span class="rt-take-t">green +</span> take, <span class="rt-drop-t">red −</span> drop). The % is how much more raid health you keep: see "What the % means".</p></div>
    <div class="rt-wrap"><div class="rt-list">${goodBuilds.length ? goodBuilds.map(routeRow).join("") : `<div class="panel faint" style="padding:12px">No swap beats your build.</div>`}
      ${badBuilds.length ? `<details class="rt-more"><summary>${badBuilds.length} more swaps that lose</summary>${badBuilds.map(routeRow).join("")}</details>` : ""}
      <div class="panel rt-detail" id="rt-detail"></div>${explainPct()}</div>
      <div class="rt-view"><div id="rt-tree"></div></div></div>` : "";

  // ----- rotation choices: grouped by the question they answer, your play first, a bar per damage pattern
  const CHOICE_GROUPS = [
    { key: "sm_self", q: "Who gets your Swiftmend?", now: "The lowest player with one of your HoTs",
      opts: { 1: "Yourself, whenever your Regrowth is on you", 2: "Always yourself" } },
    { key: "regrowth_first", q: "Regrowth a low player first, so Swiftmend can follow?", now: "No: Swiftmend only players who already have your HoTs",
      opts: { 1: "Yes, ahead of most of your healing", 2: "Yes, but only when nothing more important is up" } },
    { key: "germ", q: "When do you put a second Rejuvenation (Germination) on someone?", now: "One on yourself and the tank; a second on anyone once everyone nearby has one",
      opts: { 0: "Always two on yourself and the tank (your old play)", 1: "Only on yourself and the tank", 3: "On others only right before a burst", 7: "Archdruid makes the doubles; by hand only on the tank and anyone below 50%",
        4: "Not permanently on you and the tank, others only before a burst", 5: "Keep your own double, not the tank's", 6: "Keep the tank's double, not your own" } },
    { key: "rj_pre", q: "How many Rejuvenations before Convoke?", now: "None on purpose: Wild Growth, then Nature's Swiftness Regrowth, then Convoke",
      opts: { 8: "Press until 8 are out", 12: "Press until 12 are out", 16: "Press until 16 are out" } },
    { key: "rj_keep", q: "How many Rejuvenations the rest of the time?", now: "At least 5, more while someone is hurt and you have 30% mana",
      opts: { 6: "About 6, whatever the health", 10: "About 10", 14: "About 14" } },
    { key: "sb", q: "Do you aim Rejuvenation at Symbiotic Bloom targets (Bursting Growth, Vigorous Creepers)?", now: "No: the Rejuvenation filler picks whoever has fewest of yours, lowest health first",
      opts: { 1: "Filler prefers them a bit", 2: "Filler takes them first", 3: "Extra Rejuvenation on bloom targets without one" } },
    { key: "tree", q: "What do you do differently in Tree of Life (Reforestation's every 4th Swiftmend)?", now: "Nothing: the same priority as outside it",
      opts: { 1: "Rejuvenation on everyone missing one", 2: "Two Rejuvenations on everyone", 3: "Wild Growth on cooldown", 4: "Rejuvenation on everyone + Wild Growth on cooldown", 5: "Instant Regrowth on anyone hurt without one", 6: "Rejuvenation on everyone missing one, low in the list", 7: "Wild Growth on cooldown + Rejuvenation on everyone, low" } },
    { key: "wg", q: "When do you cast Wild Growth (outside Convoke and Tranquility)?", now: "When 5 or more players are below 90%, at any mana",
      opts: { 0: "Same, but only with 40% mana (your old play)", 6: "Same, but only down to 20% mana", 2: "When 3 or more are below 90%", 3: "When 7 or more are below 90%", 4: "When 5 or more are below 80%" } },
    { key: "wg_hold", q: "Do you save Wild Growth for Convoke?", now: "No: cast it whenever it is needed (Convoke's opener casts it anyway)",
      opts: { 10: "Hold it 10 s before Convoke (your old play)", 20: "Hold it 20 s before Convoke" } },
    { key: "blanket", q: "Keep Rejuvenation on everyone?", now: "No: Rejuvenation where your priority list puts it",
      opts: { 1: "Yes, with spare mana, before Starsurge", 2: "Yes, with spare mana, even before filler Regrowths" } },
  ];
  const choiceMax = Math.max(1, ...choiceNames.flatMap(n => judge(n).rows.map(({ c, r }) => Math.abs(pctOf(c, r.d)))));
  const bar = (c, d, verdict) => {
    const p = d == null ? 0 : pctOf(c, d), w = Math.min(50, 50 * Math.abs(p) / choiceMax);
    const cls = verdict === "better" ? "good" : verdict === "worse" || verdict === "tradeoff" ? "bad" : "zero";
    return `<div class="cb"><span class="cb-lbl">${esc(shortPat(c))}</span><span class="cb-track"><span class="cb-fill ${cls}" style="${p >= 0 ? "left:50%" : `left:${50 - w}%`};width:${Math.max(w, 0.8)}%"></span></span>
      <span class="gl-pct ${cls}">${d == null ? "0%" : signedShare(p)}</span></div>`;
  };
  const choiceOpt = (label, n) => {
    const j = judge(n), set = talentSets.find(s => s.name === n), text = CHOICE_TEXT[set?.options?.[0]];
    return `<details class="cg-row"><summary>${chipOf(j.cls)}<span class="cg-lbl">${esc(label)}</span><span class="cg-bars">${j.rows.map(({ c, r }) => bar(c, r.d, r.verdict)).join("")}</span></summary>
      ${text ? `<p class="cg-more">${text}</p>` : ""}</details>`;
  };
  const groupHtml = g => {
    const opts = Object.entries(g.opts).map(([v, label]) => ({ label, n: talentSets.find(s => s.options?.[0] === `apl_variable.${g.key}=${v}`)?.name })).filter(o => o.n && choiceNames.includes(o.n));
    if (!opts.length) return "";
    const best = opts.map(o => judge(o.n)).some(j => j.cls === "good");
    // Best first, ranked by the weakest damage pattern (the answer that holds up everywhere), then the average; your
    // current play sits at its own rank (0 on every pattern): better answers above it, worse ones below.
    const rank = j => [Math.min(...j.rows.map(({ c, r }) => pctOf(c, r.d))), j.mean];
    const nowRow = `<div class="cg-row cg-now"><span class="chip equal">You now</span><span class="cg-lbl">${esc(g.now)}</span><span class="cg-bars">${checks.map(c => bar(c, null, "equal")).join("")}</span></div>`;
    const rows = opts.map(o => ({ html: choiceOpt(o.label, o.n), k: rank(judge(o.n)) })).concat([{ html: nowRow, k: [0, 0] }])
      .sort((a, b) => b.k[0] - a.k[0] || b.k[1] - a.k[1]);
    return `<div class="panel cg"><div class="cg-q"><b>${esc(g.q)}</b> <span class="cg-verdict ${best ? "good" : "keep"}">${best ? "something here is better" : "keep your play"}</span></div>
      ${rows.map(r => r.html).join("")}</div>`;
  };
  const OLD_RX = /^Choice: Your old rotation/;
  const oldName = choiceNames.find(n => OLD_RX.test(n));
  // How much more raid health your current rotation keeps than the old one, per pattern (positive = the new one is better).
  const oldGain = () => { const j = judge(oldName); return j.rows.map(({ c, r }) => ({ c, v: c.b + r.d > 0 ? -100 * r.d / (c.b + r.d) : 0 })); };
  const oldPanel = () => oldName ? `<div class="panel cg cg-old"><div class="cg-q"><b>Your rotation now vs ${esc(oldName.slice(8).replace(/^Your old rotation/, "your old rotation"))}</b></div>
      <div class="cg-row cg-now"><span class="chip better">Now</span><span class="cg-lbl">With the rules adopted since</span><span class="cg-bars">${oldGain().map(({ c, v }) =>
        `<div class="cb"><span class="cb-lbl">${esc(shortPat(c))}</span><span class="gl-pct ${v > 0 ? "good" : v < 0 ? "bad" : "zero"}">${signedShare(v)}</span></div>`).join("")}</span></div>
      <p class="cg-more">How much more health your raid keeps with your current priority list than with the way you played before (same fights, same limit).</p></div>` : "";
  const grouped = new Set(CHOICE_GROUPS.flatMap(g => Object.keys(g.opts).map(v => talentSets.find(s => s.options?.[0] === `apl_variable.${g.key}=${v}`)?.name)));
  const loose = choiceNames.filter(n => !grouped.has(n) && !OLD_RX.test(n));
  const choicesHtml = choiceNames.length ? `
    <div class="section-head" id="rotation"><h2>Rotation choices</h2>${fresh(CHOICE_RX)}
      <p>Each question is your priority list played another way, against how you play now. Bars: <span class="rt-take-t">green right</span> = the raid keeps more health,
        <span class="rt-drop-t" style="margin-left:0">red left</span> = less. Open a line for what it means.</p></div>
    <div class="cg-list">${oldPanel()}${CHOICE_GROUPS.map(groupHtml).join("")}${loose.length ? `<div class="panel cg"><div class="cg-q"><b>Other choices</b></div>${loose.map(n => choiceOpt(n.slice(8), n)).join("")}</div>` : ""}</div>` : "";

  // ----- at a glance
  const mean = n => checks.reduce((s, c) => { const x = valueOf(n, c); return s + (x.v == null ? 0 : pctOf(c, x.v)); }, 0) / checks.length;
  const top = tree.filter(n => n.rank > 0 && !NOT_SIMULATED[n.name]).map(n => ({ n, v: mean(n) })).sort((a, b) => b.v - a.v).slice(0, 6);
  const nyiNames = Object.keys(NOT_SIMULATED);
  const goodChoices = choiceNames.filter(n => !OLD_RX.test(n)).map(n => ({ n, j: judge(n) })).filter(x => x.j.cls === "good");
  // Per question: the best answer that beats your play, and how many others also do. Ungrouped choices are listed by name.
  const worstOf = j => Math.min(...j.rows.map(({ c, r }) => pctOf(c, r.d)));  // the robust answer: best on its weakest pattern
  const rotationGlance = () => {
    const optName = (g, v) => talentSets.find(s => s.options?.[0] === `apl_variable.${g.key}=${v}`)?.name;
    const asks = CHOICE_GROUPS.map(g => {
      const wins = Object.entries(g.opts).map(([v, label]) => ({ label, n: optName(g, v) })).filter(o => o.n && choiceNames.includes(o.n))
        .map(o => ({ ...o, j: judge(o.n) })).filter(o => o.j.cls === "good").sort((a, b) => worstOf(b.j) - worstOf(a.j) || b.j.mean - a.j.mean);
      return wins.length ? { g, best: wins[0], more: wins.length - 1 } : null;
    }).filter(Boolean);
    const OLD_RX = /^Choice: Your old rotation/;
  const oldName = choiceNames.find(n => OLD_RX.test(n));
  // How much more raid health your current rotation keeps than the old one, per pattern (positive = the new one is better).
  const oldGain = () => { const j = judge(oldName); return j.rows.map(({ c, r }) => ({ c, v: c.b + r.d > 0 ? -100 * r.d / (c.b + r.d) : 0 })); };
  const oldPanel = () => oldName ? `<div class="panel cg cg-old"><div class="cg-q"><b>Your rotation now vs ${esc(oldName.slice(8).replace(/^Your old rotation/, "your old rotation"))}</b></div>
      <div class="cg-row cg-now"><span class="chip better">Now</span><span class="cg-lbl">With the rules adopted since</span><span class="cg-bars">${oldGain().map(({ c, v }) =>
        `<div class="cb"><span class="cb-lbl">${esc(shortPat(c))}</span><span class="gl-pct ${v > 0 ? "good" : v < 0 ? "bad" : "zero"}">${signedShare(v)}</span></div>`).join("")}</span></div>
      <p class="cg-more">How much more health your raid keeps with your current priority list than with the way you played before (same fights, same limit).</p></div>` : "";
  const grouped = new Set(CHOICE_GROUPS.flatMap(g => Object.keys(g.opts).map(v => optName(g, v))));
    const loose = goodChoices.filter(x => !grouped.has(x.n));
    const n = asks.length + loose.length;
    return `<b>Rotation: ${n === 1 ? "one change is" : n + " changes are"} worth making.</b>
      ${asks.map(a => `<div class="gl-sub">${esc(a.g.q)} <b>Best: ${esc(a.best.label.charAt(0).toLowerCase() + a.best.label.slice(1))}</b> <span class="rt-pcts">${pcts(a.best.j.rows)}</span>${
        a.more ? ` <span class="faint">· ${a.more} other answer${a.more > 1 ? "s" : ""} also beat${a.more > 1 ? "" : "s"} your current play</span>` : ""}</div>`).join("")}
      ${loose.map(x => `<div class="gl-sub">${esc(x.n.slice(8))} <span class="rt-pcts">${pcts(x.j.rows)}</span></div>`).join("")}`;
  };
  const glance = `
    <div class="panel gl"><h2>At a glance</h2>
      <div class="gl-row"><span class="gl-ico ${goodBuilds.some(b => b.j.cls === "good") ? "good" : "zero"}">${goodBuilds.some(b => b.j.cls === "good") ? "↑" : "✓"}</span><div>
        ${goodBuilds.some(b => b.j.cls === "good") ? `<b>Talents: ${goodBuilds.filter(b => b.j.cls === "good").length === 1 ? "one swap is" : goodBuilds.filter(b => b.j.cls === "good").length + " swaps are"} worth trying</b>
          ${goodBuilds.filter(b => b.j.cls === "good").map(b => `<div class="gl-sub">${changeText(changeOf(b.n))} <span class="rt-pcts">${pcts(b.j.rows)}</span>${caveatsOf(changeOf(b.n)).length ? ` <span class="rt-caveat" title="${esc(caveatsOf(changeOf(b.n)).join(" "))}">&#9888; unproven</span>` : ""}</div>`).join("")}`
        : `<b>Talents: your build is the best legal build we found.</b>`} <a href="#routes" class="gl-link">routes</a></div></div>
      ${oldName ? `<div class="gl-row"><span class="gl-ico good">&#10003;</span><div><b>Your rotation vs how you played until 2026-11-12:</b> your raid keeps ${oldGain().map(({ c, v }) =>
        `<span class="gl-pct ${v > 0 ? "good" : "bad"}"><small>${esc(shortPat(c))}</small> ${signedShare(v)}</span>`).join(" ")} health. <a href="#rotation" class="gl-link">details</a></div></div>` : ""}
      ${choiceNames.length ? `<div class="gl-row"><span class="gl-ico ${goodChoices.length ? "good" : "zero"}">${goodChoices.length ? "↑" : "✓"}</span><div>
        ${goodChoices.length ? rotationGlance() : `<b>Rotation: keep how you play.</b> None of the ${choiceNames.length} alternatives does better.`} <a href="#rotation" class="gl-link">details</a></div></div>` : ""}
      <div class="gl-row"><span class="gl-ico zero">★</span><div><b>Your most valuable talents:</b> ${top.map(x => `${esc(x.n.name)} <span class="faint">${signedShare(x.v)}</span>`).join(" · ")}
        <a href="#values" class="gl-link">all talents</a></div></div>
      ${nyiNames.length ? `<div class="gl-row"><span class="gl-ico nyi">?</span><div><b>Not simulated:</b> <span class="faint">${esc(nyiNames.join(", "))}</span>. Their value is unknown, so no route uses them as a reason.</div></div>` : ""}
      <p class="faint gl-foot">% = how much more of its health your raid keeps over the fight than with your current setup (+1.0%: ${healthNow(checks[0])} &rarr; ${healthWith(checks[0], checks[0].b * 0.01)} on ${esc(shortPat(checks[0]))}). Same fights at your limit; within the noise = "Same". Hints, not truth: your priority list doesn't adapt to talent changes.</p>
    </div>`;

  sec.innerHTML = glance + buildsHtml + choicesHtml + `
    <div class="section-head" id="values"><h2>Talent values</h2>${fresh(TALENT_RX)}
      <p>Every talent of your trees: <b>light ring = yours</b>, dashed = not taken; colour = what it does for you, badge = how much
        (% of raid health kept; <b>−</b> = you'd keep more without it; for talents you don't have, what taking it would add for free). Tap one for the details.</p>
      <details class="tt-how"><summary>How to read these values</summary><p class="tt-warn">Every value is played with your current priority list, which doesn't
        change when a talent does. A passive talent (more healing on a spell you cast anyway) is measured fairly; a talent that adds a
        button or changes how you'd play is undervalued. A surprising value usually means the priority list (or the sim) is missing
        something. "?" talents aren't simulated at all: unknown, not zero. Multi-rank talents are switched off whole; values for talents you
        don't have are counted on top of your build (the routes above are the real swaps). Margin of error: ${checks.map(c => `${esc(patternLabel(c.pattern))} ±${(c.noise * 100).toFixed(2)} pts`).join(" · ")}.</p></details>
      <div class="tt-bar"><span class="tt-tabs">${TREES.map(([t, l]) => `<button data-t="${t}" class="${t === "spec" ? "on" : ""}">${l}</button>`).join("")}</span>
        <span class="tt-tabs">${checks.map((c, i) => `<button data-p="${i}" class="${i === 0 ? "on" : ""}">${esc(shortPat(c))}</button>`).join("")}</span></div>
      <div class="tt-legend"><span><i class="heat"></i>brighter green = worth more</span><span><i style="background:var(--ink-3)"></i>no measurable difference</span>
        <span><i style="background:var(--dmg)"></i>better without it</span><span><i class="ring"></i>yours</span><span><i class="dash"></i>not taken (green = would help)</span><span><i class="nyi">?</i>not simulated</span><span><b style="color:var(--heal)">&#8644;</b> other option better</span></div></div>
    <div class="tt-stage"><div id="tt-view">${treeHtml(checks[0], "spec")}</div>
      <div class="panel tt-detail" id="tt-detail"><span class="faint">Click a talent to see what it's worth, in plain words.</span></div></div>
    <details style="margin-top:14px"><summary>Every talent as a table</summary>
      ${tableOf(tableRows.filter(r => r.mine), "Your talents: what each one is worth")}
      ${tableOf(tableRows.filter(r => !r.mine), "Talents you don't have: what taking one would add")}</details>`;
  app.appendChild(sec);
  const pickRoute = name => {
    if (!name) return;
    sec.querySelectorAll(".rt-row").forEach(b => b.classList.toggle("on", b.dataset.b === name));
    $("#rt-detail").innerHTML = routeDetail(name);
    $("#rt-tree").innerHTML = routeHtml(name);
  };
  sec.querySelectorAll(".rt-row").forEach(b => b.addEventListener("click", () => pickRoute(b.dataset.b)));
  pickRoute(builds[0]?.n);
  let pat = 0;
  const bindNodes = () => sec.querySelectorAll(".tt-node").forEach(d => {
    const n = tree[+d.dataset.i];
    bindInfoTip(d, () => { const x = valueOf(n, checks[0]); return `<div class="tt-tip"><b>${esc(n.rank > 0 ? n.name : x.shown.name)}</b>${x.nyi ? " · not simulated" : checks.map(c => { const v = valueOf(n, c).v; return v == null ? "" : ` · ${esc(shortPat(c))} ${signedShare(pctOf(c, v))}`; }).join("")}<div class="faint">click for details</div></div>`; });
    const pin = () => { $("#tt-detail").innerHTML = detailHtml(n); sec.querySelectorAll(".tt-node.sel").forEach(x => x.classList.remove("sel")); d.classList.add("sel"); };
    d.addEventListener("click", pin);
    d.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pin(); } });
  });
  bindNodes();
  let treeSel = "spec";
  sec.querySelectorAll(".tt-bar button").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.t ? "t" : "p";
    sec.querySelectorAll(`.tt-bar button[data-${key}]`).forEach(x => x.classList.toggle("on", x === b));
    if (b.dataset.t) treeSel = b.dataset.t; else pat = +b.dataset.p;
    $("#tt-view").innerHTML = treeHtml(checks[pat], treeSel);
    bindNodes();
  }));
  $("#nav").innerHTML = `<a href="#talents">At a glance</a>${buildNames.length ? `<a href="#routes">Talent routes</a>` : ""}${choiceNames.length ? `<a href="#rotation">Rotation</a>` : ""}<a href="#values">Talent values</a>`;
  return;
}

// ----- your upgrades: per damage pattern, your limit, your current gear's points, the best gear set's and every upgrade
if (compareOnly && checks.length) {
  const card = c => {
    const lim = limitsByPattern.find(x => x.p === c.pattern)?.v;
    const ups = c.rows.filter(r => r.verdict === "better").sort((x, y) => y.d - x.d);
    const trades = c.rows.filter(r => r.verdict === "tradeoff").sort((x, y) => y.d - x.d);
    const side = c.rows.filter(r => r.verdict === "equal").length, down = c.rows.filter(r => r.verdict === "worse").length;
    // The best upgrade never lowers the limit (gearCheckOf); the engine searched its limit the same way as current gear's.
    const bestLim = c.best?.lim ?? null, limD = c.best?.limD ?? null;
    const limVerdict = limD == null ? "" : limD > LIMIT_NOISE ? "better" : "equal";
    const pts = d => signed(d, 1).replace("%", " points");
    const worth = !c.best ? (trades.length ? `<b>No upgrade.</b> ${trades.length === 1 ? "One gear set keeps" : "Some gear sets keep"} the raid healthier on average but lower${trades.length === 1 ? "s" : ""} your limit: see the trade-offs below.` : "")
      : limD == null ? ""
      : limVerdict === "better" ? `<b>Worth it.</b> The raid stays healthier and your limit goes up ${pts(limD)}: you can heal more damage before anyone dies.`
      : `<b>A small upgrade.</b> The raid stays healthier on average, and your limit stays about the same (${pts(limD)}).`;
    const delta = (d, cls) => `<span class="${cls}">${d}</span>`;
    const limNote = r => r.lim == null ? "" : ` · limit ${fmtPct(r.lim, 1)} (${pts(r.limD)})`;
    return `<div class="panel up-card">
      <h3>${esc(patternLabel(c.pattern))}</h3>
      <div class="up-nums">
        <div class="up-num"><div class="l">Your limit</div><div class="v">${lim != null ? fmtPct(lim, 1) : "–"}</div><div class="n">current gear</div></div>
        <div class="up-num${limVerdict === "better" ? " best" : ""}"><div class="l">Limit with the best upgrade</div><div class="v">${bestLim != null ? fmtPct(bestLim, 1) : "–"}</div>
          <div class="n">${limD != null ? delta(signed(limD, 1).replace("%", " points"), limVerdict) : c.best ? "not searched" : "no upgrade"}</div></div>
        <div class="up-num"><div class="l">Points</div><div class="v">${(c.b * 100).toFixed(2)}</div><div class="n">current gear, at ${AT_LIMIT ? `your limit (${fmtPct(c.level, 1)})` : fmtLevel(TOP)}</div></div>
        <div class="up-num${c.best ? " best" : ""}"><div class="l">Points with the best upgrade</div><div class="v">${((c.best ? c.best.v : c.b) * 100).toFixed(2)}</div>
          <div class="n">${c.best ? delta(signedPts2(c.best.d), "better") : "no upgrade"}</div></div>
      </div>
      ${worth ? `<div class="up-worth">${worth}</div>` : ""}
      ${ups.length ? `<ul class="up-list">${ups.map(r => `<li><span>${swapText(r)}<small>${(c.b * 100).toFixed(2)} → ${(r.v * 100).toFixed(2)} points${limNote(r)}</small></span>
        <span class="gain">${signedPts2(r.d)}</span></li>`).join("")}</ul>`
        : trades.length ? "" : `<div class="up-none">No upgrade among your gear sets: none beats your current gear by more than the margin of error (±${(c.noise * 100).toFixed(2)} pts).</div>`}
      ${trades.length ? `<div class="up-sub tradeoff">Trade-offs: more points, lower limit</div>
        <ul class="up-list">${trades.map(r => `<li><span>${swapText(r)}<small>${(c.b * 100).toFixed(2)} → ${(r.v * 100).toFixed(2)} points${limNote(r)}</small></span>
        <span class="gain tradeoff">${signedPts2(r.d)}</span></li>`).join("")}</ul>` : ""}
      <div class="up-foot">${ups.length} upgrade${ups.length === 1 ? "" : "s"}, ${trades.length ? `${trades.length} trade-off${trades.length === 1 ? "" : "s"}, ` : ""}${side} sidegrade${side === 1 ? "" : "s"}, ${down} downgrade${down === 1 ? "" : "s"} · margin of error ±${(c.noise * 100).toFixed(2)} pts</div>
    </div>`;
  };
  const sec = el("section", { id: "upgrades" });
  sec.style.marginTop = "28px";
  sec.innerHTML = `
    <div class="section-head"><h2>Your upgrades</h2>
      <p>For each damage pattern: your limit, your current gear's points and the best you can reach with the gear sets you gave. Points are
        the raid's average health over the fight, out of 100, ${atWhere()}: higher is better.</p>
      ${scoreExplain()}</div>
    <div class="up-grid">${checks.map(card).join("")}</div>`;
  app.appendChild(sec);
}

// Gems, enchants, consumables and raid buffs under the gear sheet, so the stats at the top can be traced back.
// A gem's stat from its name ("Flawless Quick Amethyst" = Haste).
const GEM_STATS = [[/quick/i, "Haste"], [/masterful/i, "Mastery"], [/deadly/i, "Crit"], [/versatile/i, "Versatility"]];
const gemStats = n => GEM_STATS.filter(([re]) => re.test(n)).map(([, s]) => s);
// SimC's consumable names: "blood_knights_2" -> "Blood Knights" (the rank goes), "main_hand:thalassian_phoenix_oil_2".
const titleName = s => prettyName(s).replace(/ (Of|The|And|A) /g, m => m.toLowerCase());
const consumableName = s => titleName(String(s || "").replace(/^[a-z_]+:/, "").replace(/_\d+$/, ""));
function extrasPanel(gear) {
  // Gems by name (count, item id for the icon), enchants by slot (the enchant's spell for the icon).
  const gems = new Map();
  for (const slot of [...LEFT_SLOTS, ...RIGHT_SLOTS]) (gear[slot]?.gemNames || []).forEach((g, i) => {
    const cur = gems.get(g) || { n: 0, id: gear[slot].gemIds?.[i] || 0 };
    cur.n++; gems.set(g, cur);
  });
  const enchants = [...LEFT_SLOTS, ...RIGHT_SLOTS].filter(s => gear[s]?.enchant).map(s => ({ slot: slotLabel(s), name: gear[s].enchant, spell: gear[s].enchantSpell }));
  // Buffs carry their spell id and in-game name: consumables and raid buffs get their icon from them.
  const allBuffs = [...(healer.buffs_constant || []), ...(healer.buffs || [])].filter(b => b && typeof b === "object");
  const squash = s => String(s || "").replace(/^[a-z_]+:/, "").replace(/_\d+$/, "").replace(/^flask_of_the_|^flask_of_/, "").replace(/[_\s']/g, "").toLowerCase();
  const buffFor = key => key && key !== "disabled" ? allBuffs.find(b => { const n = squash(b.name); const k = squash(key); return n && k && (n.includes(k) || k.includes(n)); }) : null;
  const consumable = (label, key) => {
    if (!key || key === "disabled") return null;
    const b = buffFor(key);
    return { label, name: b?.spell_name || consumableName(key), spell: b?.spell || 0, buff: b?.name };
  };
  const cons = [consumable("Flask", healer.flask), consumable("Food", healer.food), consumable("Augment rune", healer.augmentation),
    consumable("Weapon oil", healer.temporary_enchant), consumable("Potion", healer.potion)].filter(Boolean);
  // Raid buffs: what's always on, minus the consumables listed above.
  const used = new Set(cons.map(c => c.buff).filter(Boolean));
  const raidBuffs = (healer.buffs_constant || []).filter(b => b && typeof b === "object" && !used.has(b.name));
  if (!gems.size && !enchants.length && !cons.length) return "";
  // Three cards with the same row layout (name left, detail right), raid buffs as chips underneath.
  const card = (title, count, rows) => `<div class="ex-card"><div class="ex-head"><span class="cs-label">${title}</span>${count ? `<span class="ex-count">${count}</span>` : ""}</div>
    ${rows.length ? `<div class="ex-rows">${rows.map(([name, detail]) => `<div class="ex-row"><span class="ex-name">${name}</span><span class="ex-detail">${detail}</span></div>`).join("")}</div>`
      : `<p class="faint">None</p>`}</div>`;
  const nGems = [...gems.values()].reduce((a, x) => a + x.n, 0);
  return `<div class="cs-extras">
    <div class="ex-cards">
      ${card("Gems", nGems ? `${nGems} socketed` : "", [...gems].map(([g, x]) => [`<span class="gi-gem">${whLink("item", x.id, g)}</span>`,
        `${gemStats(g).length ? esc(gemStats(g).join(" + ")) : "special effect"}${x.n > 1 ? ` <b>×${x.n}</b>` : ""}`]))}
      ${card("Enchants", enchants.length ? `${enchants.length} slots` : "", enchants.map(e => [`<span class="gi-ench">${e.spell ? whLink("spell", e.spell, e.name) : `✦ ${esc(e.name)}`}</span>`, esc(e.slot)]))}
      ${card("Consumables", "", cons.map(c => [whLink("spell", c.spell, c.name), esc(c.label)]))}
    </div>
    ${raidBuffs.length ? `<div class="ex-buffs"><span class="cs-label">Raid buffs</span>${raidBuffs.map(b => `<span class="ex-chip">${whLink("spell", b.spell, b.spell_name || titleName(b.name))}</span>`).join("")}</div>` : ""}
  </div>`;
}
// Under the stats: what's in them besides your gear (the raid buffs and consumables the simulation gives you).
function statsNote() {
  const bits = [];
  const n = (healer.buffs_constant || []).filter(b => b && typeof b === "object").length;
  if (n) bits.push("raid buffs");
  if ([healer.flask, healer.food, healer.augmentation].some(x => x && x !== "disabled")) bits.push("flask, food and augment rune");
  return hasBuffed && bits.length ? `<p class="stats-note">Includes ${bits.join(" and ")} (listed under your gear), so they can read higher than your character sheet out of a raid.</p>` : "";
}

// ----- your gear: a character sheet of the best set found (your current gear unless a gear set did better)
{
  const bestChanges = best ? best.changes : [];
  // How many points the best gear set adds, on each damage pattern (the gear check).
  const gainText = !compareOnly || !best ? "" : checks.map(c => {
    const r = c.rows.find(x => x.name === best.name);
    return r?.d == null ? "" : `${signedPts2(r.d)}${multiPattern ? ` <span class="faint">${esc(patternLabel(c.pattern).toLowerCase())}</span>` : ""}`;
  }).filter(Boolean).join(" · ");
  const gear = { ...currentGear };
  for (const c of bestChanges) gear[c.slot] = { ...c.to };
  const tile = slot => {
    const it = gear[slot];
    if (!it) return `<div class="gi empty"><div class="gi-slot">${slotLabel(slot)}</div><div class="faint">Empty</div></div>`;
    const ch = bestChanges.find(c => c.slot === slot);
    return `<div class="gi${ch ? " up" : ""}" data-slot="${slot}" tabindex="0">
      <div class="gi-top"><span class="gi-slot">${slotLabel(slot)}</span>${ch ? `<span class="gi-badge">${arrow("better")} Upgrade</span>` : ""}<span class="gi-ilvl">${it.ilevel || ""}</span></div>
      <div class="gi-name">${itemLink(it, "medium")}</div>
      ${it.stats.length ? `<div class="gi-meta">${it.stats.join(" · ")}</div>` : ""}
      ${it.enchant ? `<div class="gi-ench">✦ ${esc(it.enchant)}</div>` : ""}
      ${it.gemNames.map(g => `<div class="gi-gem">◆ ${esc(g)}</div>`).join("")}
      ${ch ? `<div class="gi-meta">Replaces ${esc(ch.from.name)} ${ch.from.ilevel || ""}</div>` : ""}
      ${ch && gainText ? `<div class="gi-pts">${gainText}</div>` : ""}
    </div>`;
  };
  const tileTip = slot => () => {
    const it = gear[slot], ch = bestChanges.find(c => c.slot === slot);
    return `<div class="t-head">${esc(it.name)}</div>
      <div class="t-row"><span>${slotLabel(slot)}</span><span>Item level ${it.ilevel || "–"}</span></div>
      ${it.stats.map(s => `<div class="t-row"><span>${esc(s.split(" ")[0])}</span><span>${esc(s.split(" ").slice(1).join(" "))}</span></div>`).join("")}
      ${it.enchant ? `<div class="t-row"><span>Enchant</span><span>${esc(it.enchant)}</span></div>` : ""}
      ${it.gemNames.map(g => `<div class="t-row"><span>Gem</span><span>${esc(g)}</span></div>`).join("")}
      ${ch ? `<div class="t-row"><span>Instead of</span><span>${esc(ch.from.name)} ${ch.from.ilevel || ""}</span></div>
        <div class="faint" style="margin-top:6px;max-width:320px">${AT_LIMIT ? "At your limit" : `At ${fmtLevel(TOP)} of your share`}: ${esc(best.reason)}.</div>` : ""}`;
  };
  const omnium = healer.omnium || [];
  const statChips = healerKV.map(([k, v, sub]) => statChip(k, v, sub)).join("");
  const gearSec = el("section", { id: "gear" });
  gearSec.innerHTML = `
    <div class="section-head"><h2>${best ? "Best gear set" : "Your gear"}</h2>
      <p>${compareOnly ? checkIntro() : oldIntro()}</p>
      ${explain(`<p>Your character as simulated: talents, gear, enchants, gems and Omnium runes from your profile. The stats at the top
        are your character sheet as simulated: gear, gems and enchants, plus the flask, food, rune and raid buffs the simulation gives you
        (${esc([healer.flask, healer.food, healer.augmentation].filter(Boolean).map(prettyName).join(", ")) || "none"}), so they can read higher
        than your sheet out of combat. Each rating is followed by the percentage it gives.</p>
        ${best ? `<p>The highlighted item${best.changes.length > 1 ? "s are" : " is"} the best upgrade among your gear sets${onFirst}. The badge shows how many
        <b>points</b> it adds on each damage pattern: points are the raid's average health over the fight, out of 100, ${atWhere()}
        (see "Your upgrades" above).</p>` : `<p>None of your gear sets beat your current gear by more than the margin of error, so this is your current gear.</p>`}
        <p>Hover an item for its in-game tooltip. The switch at the bottom right turns those off (the report's own tooltips stay), and the
        palette button next to it changes the colours.</p>`)}</div>
    <div class="panel char-sheet">
      <div class="cs-head">
        <div><div class="cs-stats">${statChips}</div>${statsNote()}</div>
        ${tipToggle}
      </div>
      <div class="cs-cols">
        <div class="cs-col">${LEFT_SLOTS.map(tile).join("")}</div>
        <div class="cs-col">${RIGHT_SLOTS.map(tile).join("")}</div>
      </div>
      ${omnium.length ? `<div class="cs-omnium"><span class="cs-label">Omnium runes</span>${omnium.map(r =>
        `<a class="wh-item rune" href="https://www.wowhead.com/spell=${r.spell}" data-wh-icon-size="small" data-wowhead="spell=${r.spell}">${esc(r.name)}</a>`).join("")}</div>` : ""}
      ${extrasPanel(gear)}
    </div>`;
  app.appendChild(gearSec);
  gearSec.querySelectorAll(".gi[data-slot]").forEach(n => bindInfoTip(n, tileTip(n.dataset.slot)));
  bindTipToggle(gearSec);
  $("#nav").insertBefore(el("a", { href: "#gear" }, "Gear"), $('#nav a[href="#timeline"]') || null);
}

// ----- the gear check (tolerance_search=0): upgrade, downgrade or no real difference, per damage pattern. Nothing else
// follows it.
if (compareOnly) {
  const VERDICT = { better: "Upgrade", worse: "Downgrade", equal: "Sidegrade", tradeoff: "Trade-off" };
  const noiseTxt = checks.map(c => signedPts2(c.noise).replace("+", "±")).filter((v, i, a) => a.indexOf(v) === i).join(" / ");
  const sec = el("section", { id: "check" });
  sec.innerHTML = checks.length ? `
    <div class="section-head"><h2>Gear check</h2>
      <p>Each gear set is your current gear with these items swapped in. It plays the same ${checks[0].fights.toLocaleString()} fights as
        your current gear ${AT_LIMIT ? "at your limit on that damage pattern" : `at ${fmtLevel(TOP)} of one healer's share of the damage`}. Points = the raid's average health over the fight, out of
        100 (a dead player counts as 0). Within ${noiseTxt} of your current gear is chance: a sidegrade.</p>
      ${explain(`<p><b>How to read the table.</b> One row per gear set, one column per damage pattern. Each cell: the verdict, the gear set's
        points, and the difference to your current gear (first row).</p>
        <p><b>Upgrade</b>: more points than your current gear by more than the margin of error, and a limit that doesn't drop (every gear set
        with more points gets its own limit search). <b>Trade-off</b>: more points, but a lower limit: the raid is healthier on average, but at
        the edge, where raiders start dying, you do a bit worse. <b>Downgrade</b>: fewer points by more than the margin of error.
        <b>Sidegrade</b>: within it, so no real difference; the simulation can't tell them apart.</p>
        <p><b>Why the same fights matter.</b> All gear sets play the same ${checks[0].fights.toLocaleString()} fights with the same random
        numbers as your current gear, so luck cancels out and small differences can be trusted. The margin of error comes from your current gear
        playing two other sets of fights: how far its own points move with other random numbers.</p>
        ${AT_LIMIT ? `<p><b>Why at your limit.</b> Your limit is the most damage your current gear can heal (${checks.map(c => `${fmtPct(c.level, 1)}${multiPattern ? ` ${esc(patternLabel(c.pattern).toLowerCase())}` : ""}`).join(", ")}).
        With less damage you overheal and the raid stays near full whatever you wear, so items barely differ. At the edge every bit of healing
        counts, so that's where an item's real healing shows. Every healer and every damage pattern is checked under the same pressure:
        the edge of what you can heal.</p>`
        : `<p><b>Why ${fmtLevel(TOP)}.</b> At one healer's share (100%) a good healer keeps almost everyone near full health, so gear barely shows.
        A bit more damage than that puts the raid under pressure, where the healing you gain or lose from an item changes how healthy the
        raid stays.</p>`}
        ${multiPattern ? `<p><b>Damage patterns.</b></p><ul>${patterns.map(p => `<li>${patternDesc(p)}</li>`).join("")}</ul>` : ""}`)}</div>
    <div class="panel meas"><table class="check-table">
      <thead><tr><th>Gear</th>${checks.map(c => `<th>${esc(patternLabel(c.pattern))}</th>`).join("")}</tr></thead>
      <tbody><tr class="base"><th scope="row">Your current gear</th>${checks.map(c => `<td><b>${points(c.b)}</b></td>`).join("")}</tr>
      ${checkRows.map(r0 => `<tr><th scope="row">${swapText(r0)}</th>${checks.map(c => {
        const r = c.rows.find(x => x.name === r0.name);
        return !r && r0.combination ? `<td class="faint" style="font-size:12px">Not built here: fewer than 2 upgrades on this pattern</td>` : !r || r.d == null ? "<td>–</td>"
          : `<td><span class="chip ${r.verdict}">${VERDICT[r.verdict]}</span> <b>${points(r.v)}</b> <small class="faint">${signedPts2(r.d)}</small>${
            r.lim != null ? `<br><small class="faint">limit ${fmtPct(r.lim, 1)} (${signed(r.limD, 1).replace("%", " points")})</small>` : ""}${
            r.quick ? `<br><small class="faint">quick check: clearly behind, not run in full</small>` : ""}</td>`;
      }).join("")}</tr>`).join("")}</tbody></table></div>`
    : `<div class="panel empty">This report has no gear sets to check. Add them to the gear sets file.</div>`;
  app.appendChild(sec);
  bindTipToggle(sec);
  $("#nav").innerHTML = `${checks.length ? `<a href="#upgrades">Upgrades</a>` : ""}<a href="#gear">Gear</a><a href="#check">Gear check</a>`;
  return;
}

// ----- the bursts: your current gear at each damage level, on each damage pattern
if (atLevels.length) {
  const CAUSES = { burst: "a burst", steady: "constant damage", spot: "damage on a few players", tank: "tank damage", avoidable: "avoidable damage" };
  const causeText = k => { const [t, during] = k.split(" during "); return (CAUSES[t] || t) + (during ? " during a burst" : ""); };
  // The raid's average health before a burst (end of the bar) and at its lowest (start), on a 0-100% track.
  const drop = (before, low) => before == null || low == null ? "" : `<span class="drop" aria-hidden="true"><i style="left:${(low * 100).toFixed(1)}%;width:${((before - low) * 100).toFixed(1)}%"></i></span>`;
  const cell = (m, key) => {
    switch (key) {
      case "n": return m.n_low == null ? "–" : `<span class="nw">${drop(m.n_before, m.n_low)}${pctPts(m.n_before)} → <b>${pctPts(m.n_low)}</b></span>`;
      case "g": return m.g_low == null ? "–" : `<span class="nw">${drop(m.g_before, m.g_low)}${pctPts(m.g_before)} → <b>${pctPts(m.g_low)}</b></span>`;
      case "p": return m.g_player == null && m.n_player == null ? "–" : `<b>${pctPts(m.g_player ?? m.n_player)}</b>`;
      case "nr": return m.n_rec == null ? "–" : `<b>${secs(m.n_rec)}</b> <span class="faint">${fmtPct(m.n_recovered)} of bursts</span>`;
      case "gr": return m.g_rec == null ? "–" : `<b>${secs(m.g_rec)}</b> <span class="faint">${fmtPct(m.g_recovered)} of big bursts</span>`;
      case "h": return m.heal_burst == null ? "–" : `<b>${fmtNum(m.heal_burst)}</b> <span class="faint">vs ${fmtNum(m.heal_quiet)} the rest of the time</span>`;
      case "dt": return m.dmg_burst == null ? "–" : `<b>${fmtNum(m.dmg_burst)}</b> <span class="faint">vs ${fmtNum(m.dmg_quiet)}</span>`;
      case "d": {
        const causes = Object.entries(m.causes).sort((a, b) => b[1] - a[1]);
        return m.deaths < 0.05 ? `<b>0</b> <span class="faint">nobody dies</span>`
          : `<b>${m.deaths.toFixed(1)}</b> <span class="faint">${causes.slice(0, 3).map(([k, v]) => `${fmtPct(v * 100 / m.deaths)} ${esc(causeText(k))}`).join(", ")}</span>`;
      }
      case "mana": return m.mana == null ? "–" : `<b>${fmtPct(m.mana)}</b>${m.oom != null ? ` <span class="faint">dry at ${fmtTime(m.oom)}</span>` : ""}`;
    }
    return "–";
  };
  const ROWS = [
    ["n", "A burst", `The raid's average health just before a burst → at its lowest in the ${burstWindow} seconds after it.`],
    ["g", "A big burst", "The same for the big bursts (twice as big)."],
    ["p", "Lowest player", "The lowest single player in a big burst, on average."],
    ["nr", "Back up after a burst", `Seconds until the raid is back within ${fmtPct(recMargin)} of its health before the burst, and how often that happens before the next one.`],
    ["gr", "Back up after a big burst", "The same for the big bursts."],
    ["h", "Healing per second in bursts", `What you heal in the ${burstWindow} seconds after each burst vs the rest of the fight.`],
    ["dt", "Damage taken per second in bursts", "What the raid takes in those seconds vs the rest of the fight."],
    ["d", "Deaths per 100 fights", "Every player's deaths, and what landed the killing blow."],
    ["mana", "Mana left at the end", "Running out of mana is not a fail, but it shows what the healing costs."],
  ];
  const sec = el("section", { id: "bursts" });
  sec.innerHTML = `
    <div class="section-head"><h2>How you handle the bursts</h2>
      <p>Your current gear at fixed amounts of damage: ${LEVELS.map(fmtLevel).join(" and ")} of one healer's share. How low the raid goes when a burst lands, how fast you bring it back, and who dies.</p></div>
    ${patterns.map(p => {
      const main = tolSetups.filter(ofPattern(p)).find(s => s.role === "main");
      const ms = LEVELS.map(l => measuresOf(main, l));
      if (!ms.some(Boolean)) return "";
      return `<div class="panel meas">
        ${multiPattern ? `<div class="meas-title cs-label">${esc(patternLabel(p))}</div>` : ""}
        <table><thead><tr><th></th>${LEVELS.map(l => `<th>${fmtLevel(l)} of your share</th>`).join("")}</tr></thead>
        <tbody>${ROWS.map(([k, label, what]) => `<tr><th scope="row" title="${esc(what)}">${label}</th>${ms.map(m => `<td>${m ? cell(m, k) : "–"}</td>`).join("")}</tr>`).join("")}</tbody></table>
      </div>`;
    }).join("")}`;
  app.appendChild(sec);
  $("#nav").insertBefore(el("a", { href: "#bursts" }, "Bursts"), $('#nav a[href="#timeline"]') || null);
}

// ----- gear comparison: each gear set against your current gear, measure by measure, at each damage level
if (cmps.length) {
  const VERDICT = { better: "Better", worse: "Worse", mixed: "Mixed", equal: "No real difference" };
  const head = `<th>Gear</th>${METRICS.map(m => `<th>${m.head}<small>${m.sub}</small></th>`).join("")}<th>Limit<small>all damage</small></th>`;
  const table = (c, li) => {
    const lv = c.levels[li];
    const base = lv.base || {};
    const baseRow = `<tr class="base"><th scope="row">Your current gear</th>${METRICS.map(m => `<td>${base[m.key] != null ? m.fmt(base[m.key]) : "–"}</td>`).join("")}<td>${c.bl != null ? fmtPct(c.bl, 1) : "–"}</td></tr>`;

// ---------------------------------------------------------------- chart engine
// A set of vertically stacked panels sharing one time axis and one crosshair.
function timeChart(container, panels, opts = {}) {
  // Seconds the x axis spans; defaults to the average fight length.
  const len = opts.length || fightLen;
  const pad = { l: 56, r: 16, t: 8, b: 26 };
  const gap = 18;
  const n = Math.max(...panels.map(p => p.length || 0), 1);
  const totalH = sum(panels.map(p => p.height)) + gap * (panels.length - 1) + pad.t + pad.b;
  const svg = svgEl("svg", { role: "img", "aria-label": opts.label || "Chart" });
  container.innerHTML = "";
  container.appendChild(svg);

  function draw() {
    const W = Math.max(container.clientWidth, 320);
    svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);
    svg.setAttribute("height", totalH);
    svg.innerHTML = "";
    const x = i => pad.l + (i / Math.max(n - 1, 1)) * (W - pad.l - pad.r);
    let top = pad.t;
    const layout = [];
    for (const p of panels) {
      const h = p.height;
      const maxV = p.yMax ?? Math.max(1, ...p.series.flatMap(s => s.values)) * 1.08;
      const y = v => top + h - (v / maxV) * h;
      layout.push({ p, top, h, y, maxV });
      // grid + y labels
      const ticks = p.yTicks || [0, maxV / 2, maxV];
      for (const t of ticks) {
        svg.appendChild(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(t), y2: y(t), class: t === 0 ? "baseline" : "gridline" }));
        const lab = svgEl("text", { x: pad.l - 8, y: y(t) + 4, "text-anchor": "end" });
        lab.textContent = p.yFormat ? p.yFormat(t) : fmtNum(t);
        svg.appendChild(lab);
      }
      // series
      for (const s of p.series) {
        const vals = s.values;
        if (!vals.length) continue;
        let d = "";
        vals.forEach((v, i) => { d += (i ? "L" : "M") + x(i).toFixed(1) + "," + y(Math.min(v, maxV)).toFixed(1); });
        if (s.kind === "area") {
          const area = d + `L${x(vals.length - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
          svg.appendChild(svgEl("path", { d: area, style: `fill:${s.color};fill-opacity:${s.opacity ?? 0.18};stroke:none` }));
        }
        svg.appendChild(svgEl("path", { d, style: `fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round` }));
      }
      if (p.title) {
        const tt = svgEl("text", { x: pad.l + 6, y: top + 13, class: "lane-label" });
        tt.textContent = p.title;
        svg.appendChild(tt);
      }
      top += h + gap;
    }
    // markers spanning all panels
    const bottom = top - gap;
    for (const m of opts.markers || []) {
      const mx = x(m.time / len * (n - 1));
      const g = svgEl("g", { class: "marker" });
      g.appendChild(svgEl("line", { x1: mx, x2: mx, y1: pad.t, y2: bottom }));
      svg.appendChild(g);
    }
    // x axis
    const step = len > 240 ? 60 : len > 90 ? 30 : 10;
    for (let s = 0; s <= len + 0.01; s += step) {
      const lab = svgEl("text", { x: x(s / len * (n - 1)), y: bottom + 18, "text-anchor": "middle" });
      lab.textContent = fmtTime(s);
      svg.appendChild(lab);
    }
    // crosshair + hit area
    const cross = svgEl("line", { class: "crosshair", y1: pad.t, y2: bottom, x1: -10, x2: -10, visibility: "hidden" });
    svg.appendChild(cross);
    const dots = layout.flatMap(L => L.p.series.map(s => {
      const c = svgEl("circle", { r: 4, style: `fill:${s.color};stroke:var(--panel);stroke-width:2`, visibility: "hidden" });
      svg.appendChild(c);
      return { c, s, L };
    }));
    const hit = svgEl("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: bottom - pad.t, fill: "transparent" });
    svg.appendChild(hit);
    hit.addEventListener("pointermove", ev => {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) * (W / box.width);
      const i = Math.round(((px - pad.l) / (W - pad.l - pad.r)) * (n - 1));
      if (i < 0 || i >= n) return;
      const cx = x(i);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
      let rows = "";
      for (const { c, s, L } of dots) {
        const v = s.values[i];
        if (v == null) { c.setAttribute("visibility", "hidden"); continue; }
        c.setAttribute("cx", cx); c.setAttribute("cy", L.y(Math.min(v, L.maxV))); c.setAttribute("visibility", "visible");
        rows += `<div class="t-row"><span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}</span><span>${L.p.yFormat ? L.p.yFormat(v) : fmtNum(v)}</span></div>`;
      }
      const t = i / Math.max(n - 1, 1) * len;
      const near = (opts.markers || []).filter(m => Math.abs(m.time - t) <= Math.max(1.5, len / n)).map(m => `<div class="t-row"><span>${esc(m.label)}</span><span>cast</span></div>`).join("");
      showTip(`<div class="t-head">${fmtTime(t)}</div>${rows}${near}`, ev.clientX, ev.clientY);
    });
    hit.addEventListener("pointerleave", () => {
      cross.setAttribute("visibility", "hidden");
      dots.forEach(d => d.c.setAttribute("visibility", "hidden"));
      hideTip();
    });
  }
  draw();
  new ResizeObserver(() => draw()).observe(container);
  return { redraw: draw };
}

// Swimlanes of discrete events (casts) on the same time axis.
function laneChart(container, lanes, opts = {}) {
  const pad = { l: 150, r: 16, t: 4, b: 24 };
  const narrow = () => container.clientWidth < 520;
  const laneH = 26;
  const H = pad.t + pad.b + lanes.length * laneH;
  const svg = svgEl("svg", { role: "img", "aria-label": opts.label || "Casts" });
  container.innerHTML = "";
  container.appendChild(svg);
  function draw() {
    const W = Math.max(container.clientWidth, 320);
    pad.l = narrow() ? 100 : 150;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    svg.innerHTML = "";
    const len = opts.length || fightLen;
    const x = t => pad.l + (t / len) * (W - pad.l - pad.r);
    lanes.forEach((lane, li) => {
      const y0 = pad.t + li * laneH;
      if (li) svg.appendChild(svgEl("line", { x1: 0, x2: W - pad.r, y1: y0, y2: y0, class: "gridline" }));
      const lab = svgEl("text", { x: 0, y: y0 + laneH / 2 + 4, class: "lane-label" });
      const maxCh = narrow() ? 14 : 22;
      lab.textContent = lane.label.length > maxCh ? lane.label.slice(0, maxCh - 1) + "…" : lane.label;
      svg.appendChild(lab);
      for (const t of lane.times) {
        const r = svgEl("rect", { x: x(t) - 1.5, y: y0 + 6, width: 3, height: laneH - 12, rx: 1.5, class: "tick-mark" + (lane.dmg ? " dmg" : "") });
        svg.appendChild(r);
        const hitR = svgEl("rect", { x: x(t) - 5, y: y0, width: 10, height: laneH, fill: "transparent" });
        hitR.addEventListener("pointermove", ev => showTip(`<div class="t-head">${esc(lane.label)}</div><div class="t-row"><span>Cast at</span><span>${fmtTime(t)}</span></div>`, ev.clientX, ev.clientY));
        hitR.addEventListener("pointerleave", hideTip);
        svg.appendChild(hitR);
      }
    });
    const bottom = pad.t + lanes.length * laneH;
    const step = len > 240 ? 60 : len > 90 ? 30 : 10;
    for (let s = 0; s <= len + 0.01; s += step) {
      const lab = svgEl("text", { x: x(s), y: bottom + 16, "text-anchor": "middle" });
      lab.textContent = fmtTime(s);
      svg.appendChild(lab);
    }
  }
  draw();
  new ResizeObserver(() => draw()).observe(container);
}

// Needs death_recap=<seconds> on the player; SimC then exports what happened before each death.
const recaps = cd.death_recaps || [];

// Rules that name a cause of death. Interpretation, not fact: tune freely, no rebuild needed.
const DEATH_RULES = {
  burstSeconds: 5,      // burst: health was still at least burstFromHealth of max this many seconds before death
  burstFromHealth: 0.6,
  oomShare: 0.05,       // out of mana: mana below this share of max...
  oomLeadSeconds: 3,    // ...at least this many seconds before death
  idleShare: 0.25,      // idle: waiting for at least this share of the window while damage beat healing
};
const CAUSES = {
  burst: { label: "Burst damage", color: "var(--dmg)",
    why: `Healthy ${DEATH_RULES.burstSeconds}s before death, then killed by a spike. Usually overlapping damage or a missing defensive.` },
  oom: { label: "Out of mana", color: "var(--mana)",
    why: "Mana ran out before the drop, so the healing stopped. A mana or rotation problem." },
  idle: { label: "Idle while dropping", color: "var(--c4)",
    why: "Spent a large share of the last seconds not casting while losing health. A rotation (APL) problem." },
  attrition: { label: "Not enough healing", color: "var(--c3)",
    why: "Damage outpaced healing over the whole window. Needs more healing, from you or the raid." },
};

const sourceLabel = src => {
  let s = String(src || "");
  if (boss && s.startsWith(boss.name + "_")) s = s.slice(boss.name.length + 1);

};

function analyseDeath(d) {
  const s = d.seconds || {};
  const n = (s.health || []).length;
  const maxH = d.max_health || maxHealth || 1;
  const maxM = d.max_mana || maxMana || 0;
  const dmg = sum(s.damage || []), heal = sum(s.healing || []), idle = sum(s.idle || []);
  const k = DEATH_RULES.burstSeconds;
  const healthBefore = n > k ? s.health[n - 1 - k] : maxH;
  const oomIndex = maxM ? (s.mana || []).findIndex(m => m < DEATH_RULES.oomShare * maxM) : -1;
  const oomBefore = oomIndex >= 0 ? n - 1 - oomIndex : null;

  const tags = [];
  if (healthBefore >= DEATH_RULES.burstFromHealth * maxH) tags.push("burst");
  if (oomBefore != null && oomBefore >= DEATH_RULES.oomLeadSeconds) tags.push("oom");
  // Waiting for mana is not a rotation problem, so idle only counts while mana remains.
  if (!tags.includes("oom") && idle >= DEATH_RULES.idleShare * n && dmg > heal) tags.push("idle");
  if (dmg > heal) tags.push("attrition");
  if (!tags.length) tags.push("attrition");
  return { d, n, maxH, maxM, dmg, heal, idle, healthBefore, oomBefore, startHealth: n ? s.health[0] : maxH, cause: tags[0], tags };
}

  function recapChart(container, a) {
    const s = a.d.seconds, n = a.n;
    const pad = { l: 56, r: 16, t: 8, b: 26 }, hTop = 120, hBot = 140, gap = 18;
    const H = pad.t + hTop + gap + hBot + pad.b;

      for (let i = 0; i < n; i++) {
