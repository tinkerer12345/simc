    why: "Spent a large share of the last seconds not casting while losing health. A rotation (APL) problem." },
  attrition: { label: "Not enough healing", color: "var(--c3)",
    why: "Damage outpaced healing over the whole window. Needs more healing, from you or the raid." },
};

const sourceLabel = src => {
  let s = String(src || "");
  if (boss && s.startsWith(boss.name + "_")) s = s.slice(boss.name.length + 1);
  return prettyName(s.replace(/_\d+$/, ""));
};

function analyseDeath(d) {
  const s = d.seconds || {};
  const n = (s.health || []).length;
  const maxH = d.max_health || maxHealth || 1;
  const maxM = d.max_mana || maxMana || 0;
  const dmg = sum(s.damage || []), heal = sum(s.healing || []), idle = sum(s.idle || []);
  const k = DEATH_RULES.burstSeconds;
  const healthBefore = n > k ? s.health[n - 1 - k] : maxH;
  const oomIndex = maxM ? (s.mana || []).findIndex(m => m < DEATH_RULES.oomShare * maxM) : -1;
  const oomBefore = oomIndex >= 0 ? n - 1 - oomIndex : null;

  const tags = [];
  if (healthBefore >= DEATH_RULES.burstFromHealth * maxH) tags.push("burst");
  if (oomBefore != null && oomBefore >= DEATH_RULES.oomLeadSeconds) tags.push("oom");
  // Waiting for mana is not a rotation problem, so idle only counts while mana remains.
  if (!tags.includes("oom") && idle >= DEATH_RULES.idleShare * n && dmg > heal) tags.push("idle");
  if (dmg > heal) tags.push("attrition");
  if (!tags.length) tags.push("attrition");
  return { d, n, maxH, maxM, dmg, heal, idle, healthBefore, oomBefore, startHealth: n ? s.health[0] : maxH, cause: tags[0], tags };
}

if (recaps.length) {
  const analysed = recaps.map(analyseDeath).sort((a, b) => a.d.time - b.d.time);
  const causeCounts = {};
  analysed.forEach(a => { causeCounts[a.cause] = (causeCounts[a.cause] || 0) + 1; });
  const causeOrder = Object.keys(CAUSES).filter(c => causeCounts[c]).sort((a, b) => causeCounts[b] - causeCounts[a]);
  const picks = {
    earliest: analysed[0],
    typical: analysed[Math.floor(analysed.length / 2)],
    latest: analysed[analysed.length - 1],
  };

  $("#nav").insertBefore(el("a", { href: "#deaths" }, "Deaths"), $('#nav a[href="#activity"]') || $('#nav a[href="#healing"]') || null);

  const deathSec = el("section", { id: "deaths" });
  deathSec.innerHTML = `
    <div class="section-head">
      <h2>Why you died</h2>
      <p>Each death is given a cause from what happened in the ${analysed[0].n} seconds before it. These are interpretations
        from simple rules, so read the recap to see the evidence.</p>
    </div>
    <div class="death-grid">
      <div class="panel causes">
        <h3>Cause across ${analysed.length.toLocaleString()} recorded deaths</h3>
        ${causeOrder.map(c => `
          <div class="cause">
            <span>${CAUSES[c].label}</span><span class="pct">${fmtPct(causeCounts[c] / analysed.length)}</span>
            <div class="track"><div class="fill" style="width:${(causeCounts[c] / analysed.length * 100).toFixed(1)}%;background:${CAUSES[c].color}"></div></div>
            <span class="why">${CAUSES[c].why}</span>
          </div>`).join("")}
      </div>
      <div class="panel chart-panel">
        <div class="chart-title">
          <h3>Death recap</h3>
          <div class="seg" role="group" aria-label="Which death">
            <button type="button" data-pick="earliest" aria-pressed="false">Earliest</button>
            <button type="button" data-pick="typical" aria-pressed="true">Typical</button>
            <button type="button" data-pick="latest" aria-pressed="false">Latest</button>
          </div>
        </div>
        <p class="verdict-line" id="recapVerdict"></p>
        <div class="legend" style="margin-bottom:6px">
          <span><i class="line" style="background:var(--heal)"></i>Health</span>
          <span><i style="background:var(--dmg)"></i>Damage taken</span>
          <span><i style="background:var(--heal-soft)"></i>Healing received</span>
          <span><i style="background:var(--ink-3);opacity:.35"></i>Idle</span>
        </div>
        <div class="chart" id="recapChart"></div>
      </div>
    </div>
    <div class="panel breakdown" id="recapHits" style="margin-top:20px"></div>`;
  app.appendChild(deathSec);

  // Health line on top, per-second damage and healing columns below, idle seconds shaded.
  function recapChart(container, a) {
    const s = a.d.seconds, n = a.n;
    const pad = { l: 56, r: 16, t: 8, b: 26 }, hTop = 120, hBot = 140, gap = 18;
    const H = pad.t + hTop + gap + hBot + pad.b;
    const svg = svgEl("svg", { role: "img", "aria-label": "Last seconds before death" });
    container.innerHTML = "";
    container.appendChild(svg);
    function draw() {
      const W = Math.max(container.clientWidth, 320);
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.setAttribute("height", H);
      svg.innerHTML = "";
      const colW = (W - pad.l - pad.r) / n;
      const x = i => pad.l + i * colW;
      const topY = v => pad.t + hTop - Math.max(0, Math.min(1, v)) * hTop;
      const botTop = pad.t + hTop + gap;
      const maxV = Math.max(1, ...s.damage, ...s.healing) * 1.08;
      const botY = v => botTop + hBot - (v / maxV) * hBot;

      for (let i = 0; i < n; i++) {
        if (s.idle[i] > 0.05)
          svg.appendChild(svgEl("rect", { x: x(i), y: pad.t, width: colW, height: botTop + hBot - pad.t, class: "idle-band", "fill-opacity": (0.25 * Math.min(1, s.idle[i])).toFixed(2) }));
      }
      for (const t of [0, 0.5, 1]) {
        svg.appendChild(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: topY(t), y2: topY(t), class: t === 0 ? "baseline" : "gridline" }));
        const lab = svgEl("text", { x: pad.l - 8, y: topY(t) + 4, "text-anchor": "end" }); lab.textContent = Math.round(t * 100) + "%"; svg.appendChild(lab);
      }
      for (const t of [0, maxV / 2]) {
        svg.appendChild(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: botY(t), y2: botY(t), class: t === 0 ? "baseline" : "gridline" }));
        const lab = svgEl("text", { x: pad.l - 8, y: botY(t) + 4, "text-anchor": "end" }); lab.textContent = fmtNum(t); svg.appendChild(lab);
      }
      // health line: start of window, then the end of each second
      const hp = v => v / a.maxH;
      let d = `M${x(0).toFixed(1)},${topY(hp(a.startHealth)).toFixed(1)}`;
      for (let i = 0; i < n; i++) d += `L${(x(i) + colW).toFixed(1)},${topY(hp(s.health[i])).toFixed(1)}`;
      svg.appendChild(svgEl("path", { d: d + `L${x(n).toFixed(1)},${topY(0)}L${x(0).toFixed(1)},${topY(0)}Z`, style: "fill:var(--heal);fill-opacity:.14;stroke:none" }));
      svg.appendChild(svgEl("path", { d, style: "fill:none;stroke:var(--heal);stroke-width:2;stroke-linejoin:round" }));
      const bw = Math.max(1, colW / 2 - 2);
      for (let i = 0; i < n; i++) {
        if (s.damage[i] > 0) svg.appendChild(svgEl("rect", { x: x(i) + 1, y: botY(s.damage[i]), width: bw, height: botY(0) - botY(s.damage[i]), rx: 2, style: "fill:var(--dmg)" }));
        if (s.healing[i] > 0) svg.appendChild(svgEl("rect", { x: x(i) + colW / 2 + 1, y: botY(s.healing[i]), width: bw, height: botY(0) - botY(s.healing[i]), rx: 2, style: "fill:var(--heal-soft)" }));
      }
      for (let i = 0; i <= n; i += n > 12 ? 5 : 2) {
        const lab = svgEl("text", { x: x(i), y: botTop + hBot + 18, "text-anchor": "middle" });
        lab.textContent = i === n ? "death" : `−${n - i}s`;
        svg.appendChild(lab);
      }
      const hit = svgEl("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: botTop + hBot - pad.t, fill: "transparent" });
      svg.appendChild(hit);
      hit.addEventListener("pointermove", ev => {
        const box = svg.getBoundingClientRect();
        const i = Math.floor(((ev.clientX - box.left) * (W / box.width) - pad.l) / colW);
        if (i < 0 || i >= n) return;
        showTip(`<div class="t-head">${n - i - 1}–${n - i}s before death</div>
          <div class="t-row"><span><i class="sw" style="background:var(--dmg)"></i>Damage taken</span><span>${fmtNum(s.damage[i])}</span></div>
          ${s.absorbed[i] ? `<div class="t-row"><span>Absorbed</span><span>${fmtNum(s.absorbed[i])}</span></div>` : ""}
          <div class="t-row"><span><i class="sw" style="background:var(--heal-soft)"></i>Healing received</span><span>${fmtNum(s.healing[i])}</span></div>
          <div class="t-row"><span><i class="sw" style="background:var(--heal)"></i>Health</span><span>${fmtPct(Math.max(0, hp(s.health[i])))}</span></div>
          ${a.maxM ? `<div class="t-row"><span><i class="sw" style="background:var(--mana)"></i>Mana</span><span>${fmtPct(s.mana[i] / a.maxM)}</span></div>` : ""}
          ${s.idle[i] > 0.05 ? `<div class="t-row"><span>Idle</span><span>${s.idle[i].toFixed(1)}s</span></div>` : ""}`, ev.clientX, ev.clientY);
      });
      hit.addEventListener("pointerleave", hideTip);
    }
    draw();
    new ResizeObserver(() => draw()).observe(container);
  }

  function showRecap(a) {
    const kb = a.d.killing_blow;
    $("#recapVerdict").innerHTML = `
      ${a.tags.map(t => `<span class="tag" style="color:${CAUSES[t].color}">${CAUSES[t].label}</span>`).join("")}<br>
      Died at <b>${fmtTime(a.d.time)}</b>. ${a.n}s earlier you had <b>${fmtPct(Math.max(0, a.startHealth / a.maxH))}</b> health.
      In that time you took <b>${fmtNum(a.dmg)}</b> damage (${(a.dmg / a.maxH).toFixed(1)}× your health) and received
      <b>${fmtNum(a.heal)}</b> healing${a.idle >= 0.5 ? `, and were idle for <b>${a.idle.toFixed(1)}s</b>` : ""}.
      ${a.oomBefore != null ? ` Mana ran out <b>${a.oomBefore}s</b> before death.` : a.maxM ? ` Mana at death: <b>${fmtPct(a.d.seconds.mana[a.n - 1] / a.maxM)}</b>.` : ""}
      ${kb ? ` Killing blow: <b>${esc(prettyName(kb.ability))}</b> from ${esc(sourceLabel(kb.source))} for ${fmtNum(kb.amount)}.` : ""}`;
    recapChart($("#recapChart"), a);

    // Merge identical abilities from several adds, as in "What hurt".
    const merged = new Map();
    for (const ab of a.d.abilities || []) {
      const key = ab.ability + "|" + sourceLabel(ab.source);
      const cur = merged.get(key) || { ...ab, source: sourceLabel(ab.source), amount: 0, absorbed: 0, hits: 0 };
      cur.amount += ab.amount; cur.absorbed += ab.absorbed; cur.hits += ab.hits;
      merged.set(key, cur);
    }
    const rows = [...merged.values()].sort((x, y) => y.amount - x.amount);
    const maxAmt = Math.max(1, ...rows.map(r => r.amount));
    $("#recapHits").innerHTML = `<div class="bd-head"><span>What hit you in the last ${a.n}s</span><span>Damage taken</span><span>Of your health</span></div>` +
      rows.map(r => `
        <div class="bd-row" style="cursor:default">
          <span style="min-width:0"><span class="nm">${schoolDot(r.school)}${esc(prettyName(r.ability))}${kb && kb.ability === r.ability && sourceLabel(kb.source) === r.source ? '<span class="kb">KILLING BLOW</span>' : ""}</span>
            <div class="meta">${esc(r.source)}, ${r.hits} hit${r.hits === 1 ? "" : "s"}, ${fmtNum(r.amount)}${r.absorbed ? `, ${fmtNum(r.absorbed)} absorbed` : ""}</div></span>
          <span class="barcell"><div class="bar"><span class="dmg" style="width:${(r.amount / maxAmt) * 100}%;background:${schoolPaint(r.school)}"></span></div></span>
          <span class="num">${fmtPct(r.amount / a.maxH)}</span>
        </div>`).join("");
  }
  showRecap(picks.typical);
  deathSec.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    deathSec.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    showRecap(picks[b.dataset.pick]);
  }));
}

// ----- activity section
// Each spell's average time busy per cast (cast time, or the GCD for instants).
const execOf = new Map((healer.stats || [])
  .filter(s => mean(s.num_executes) > 0 && mean(s.total_execute_time) > 0)
  .map(s => [s.name, { label: s.spell_name || prettyName(s.name), time: mean(s.total_execute_time), per: mean(s.total_execute_time) / mean(s.num_executes) }]));

// Busy intervals in the sample fight, rebuilt from the cast log.
const busy = [];
healerSeq.slice().sort((a, b) => a.time - b.time).forEach((e, i, arr) => {
  const per = execOf.get(e.name)?.per;
  if (!per) return;
  const end = Math.min(e.time + per, arr[i + 1]?.time ?? Infinity, sampleEnd);
  if (end > e.time) busy.push([e.time, end]);
});
function activityBuckets(w) {
  const n = Math.ceil(sampleEnd / w);
  const out = new Array(n).fill(0);
  for (const [a, b] of busy) {
    for (let k = Math.floor(a / w); k < n && k * w < b; k++) out[k] += Math.min(b, (k + 1) * w) - Math.max(a, k * w);
  }
  return out.map((v, k) => Math.min(1, v / (Math.min((k + 1) * w, sampleEnd) - k * w)));
}

// Columns of "share of this time slice spent casting", on a track that shows the idle rest.
function columnChart(container, vals, w, opts = {}) {
  const pad = { l: 44, r: 16, t: 8, b: 26 }, h = 200;
  const H = pad.t + h + pad.b;
  const svg = svgEl("svg", { role: "img", "aria-label": opts.label || "Activity" });
  container.innerHTML = "";
  container.appendChild(svg);
  function draw() {
    const W = Math.max(container.clientWidth, 320);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    svg.innerHTML = "";
    const x = t => pad.l + (t / sampleEnd) * (W - pad.l - pad.r);
    const y = v => pad.t + h - v * h;
    for (const t of [0, 0.5, 1]) {
      const lab = svgEl("text", { x: pad.l - 8, y: y(t) + 4, "text-anchor": "end" });
      lab.textContent = Math.round(t * 100) + "%";
      svg.appendChild(lab);
    }
    const colW = x(w) - x(0);
    const gapPx = Math.min(4, colW * 0.3);
    const rx = Math.min(4, (colW - gapPx) / 2);
    const cols = vals.map((v, k) => {
      const t0 = k * w, t1 = Math.min((k + 1) * w, sampleEnd);
      const cx = x(t0) + gapPx / 2, cw = Math.max(1, x(t1) - x(t0) - gapPx);
      const g = svgEl("g", { class: "col" });
      g.appendChild(svgEl("rect", { x: cx, y: y(1), width: cw, height: h, rx, class: "col-track" }));
      if (v > 0) g.appendChild(svgEl("rect", { x: cx, y: y(v), width: cw, height: Math.max(v * h, 2), rx, class: "col-fill" }));
      svg.appendChild(g);
      return { g, v, t0, t1 };
    });
    for (const m of opts.markers || []) {
      const mk = svgEl("g", { class: "marker" });
      mk.appendChild(svgEl("line", { x1: x(m.time), x2: x(m.time), y1: pad.t, y2: pad.t + h }));
      svg.appendChild(mk);
    }
    const step = sampleEnd > 240 ? 60 : sampleEnd > 90 ? 30 : 10;
    for (let s = 0; s <= sampleEnd + 0.01; s += step) {
      const lab = svgEl("text", { x: x(s), y: pad.t + h + 18, "text-anchor": "middle" });
      lab.textContent = fmtTime(s);
      svg.appendChild(lab);
    }
    const hit = svgEl("rect", { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: h, fill: "transparent" });
    svg.appendChild(hit);
    hit.addEventListener("pointermove", ev => {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) * (W / box.width);
      const k = Math.floor(((px - pad.l) / (W - pad.l - pad.r)) * sampleEnd / w);
      const c = cols[k];
      if (!c) return;
      cols.forEach(o => o.g.classList.toggle("dim", o !== c));
      const near = (opts.markers || []).filter(m => m.time >= c.t0 && m.time < c.t1)
        .map(m => `<div class="t-row"><span>${esc(m.label)}</span><span>${fmtTime(m.time)}</span></div>`).join("");
      showTip(`<div class="t-head">${fmtTime(c.t0)} – ${fmtTime(c.t1)}</div>
        <div class="t-row"><span><i class="sw" style="background:var(--heal)"></i>Casting</span><span>${fmtPct(c.v)}</span></div>
        <div class="t-row"><span><i class="sw" style="background:var(--grid)"></i>Idle</span><span>${fmtPct(1 - c.v)}</span></div>${near}`, ev.clientX, ev.clientY);
    });
    hit.addEventListener("pointerleave", () => { cols.forEach(o => o.g.classList.remove("dim")); hideTip(); });
  }
  draw();
  new ResizeObserver(() => draw()).observe(container);
}

// Ring split into time spent on each spell plus idle time.
function donutChart(container, segs, centerBig, centerLbl) {
  const total = sum(segs.map(s => s.time)) || 1;
  const r = 80, C = 2 * Math.PI * r, gapLen = segs.length > 1 ? 3 : 0;
  const svg = svgEl("svg", { viewBox: "0 0 200 200", role: "img", "aria-label": segs.map(s => `${s.label} ${fmtPct(s.time / total)}`).join(", ") });
  let off = 0;
  for (const s of segs) {
    const len = (s.time / total) * C;
    const arc = svgEl("circle", {
      cx: 100, cy: 100, r, class: "seg-arc", transform: "rotate(-90 100 100)",
      style: `fill:none;stroke:${s.color};stroke-width:22`,
      "stroke-dasharray": `${Math.max(0, len - gapLen)} ${C}`, "stroke-dashoffset": -off,
    });
    arc.addEventListener("pointermove", ev => showTip(`<div class="t-head">${esc(s.label)}</div><div class="t-row"><span>Time</span><span>${fmtTime(s.time)}</span></div><div class="t-row"><span>Share of fight</span><span>${fmtPct(s.time / total, 1)}</span></div>`, ev.clientX, ev.clientY));
    arc.addEventListener("pointerleave", hideTip);
    svg.appendChild(arc);
    off += len;
  }
  container.innerHTML = `<div class="center"><div class="big">${centerBig}</div><div class="lbl">${centerLbl}</div></div>`;
  container.prepend(svg);
}

if (activeTime != null) {
  const palette = ["--heal", "--mana", "--c3", "--c4", "--c5"];
  const spellSegs = [...execOf.values()].sort((a, b) => b.time - a.time);
  // Spells beyond the palette are folded into "Other" so colours stay distinct.
  const shown = spellSegs.slice(0, palette.length - 1);
  const rest = spellSegs.slice(palette.length - 1);
  const segs = shown.map((s, i) => ({ label: s.label, time: s.time, color: color(palette[i]) }));
  if (rest.length) segs.push({ label: "Other spells", time: sum(rest.map(s => s.time)), color: color(palette[palette.length - 1]) });
  // Scale spell times so casting adds up to the fight's active time.
  const castSum = sum(segs.map(s => s.time));
  if (castSum > 0) segs.forEach(s => { s.time *= activeTime / castSum; });
  if (idleTime > 0) segs.push({ label: "Idle", time: idleTime, color: "var(--grid)" });

  const actSec = el("section", { id: "activity" });
  actSec.innerHTML = `
    <div class="section-head">
      <h2>Casting vs idle</h2>
      <p>How your time was spent across the fight. Idle means nothing in your action list was ready or worth casting.</p>
    </div>
    <div class="act-grid">
      <div class="panel donut-panel">
        <h3>Where your time went</h3>
        <div class="donut" id="actDonut"></div>
        <ul class="act-legend">${segs.map(s => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><span class="t">${fmtTime(s.time)}</span><span class="p">${fmtPct(s.time / fightLen)}</span></li>`).join("")}</ul>
      </div>
      <div class="panel chart-panel">
        <div class="chart-title">
          <h3>Time spent casting, one sample fight</h3>
          <div class="seg" role="group" aria-label="Bucket size">
            <button type="button" data-w="5" aria-pressed="false">5s</button>
            <button type="button" data-w="10" aria-pressed="true">10s</button>
            <button type="button" data-w="15" aria-pressed="false">15s</button>
          </div>
        </div>
        <div class="chart" id="actChart"></div>
      </div>
    </div>`;
  // Placed for now; moved right above "Where your healing went" once that section exists.
  app.appendChild(actSec);
  donutChart($("#actDonut"), segs, fmtPct(activeTime / fightLen), "casting");
  const renderAct = w => {
    if (!busy.length) { $("#actChart").innerHTML = '<p class="empty">No cast sequence in this report.</p>'; return; }
    columnChart($("#actChart"), activityBuckets(w), w, { markers: sampleMarkers, label: "Share of each time slice spent casting" });
  };
  renderAct(10);
  actSec.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    actSec.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderAct(+b.dataset.w);
  }));
}

// ----- breakdown builder
function breakdown(container, rows, kind, total) {
  const max = Math.max(...rows.map(r => (kind === "heal" ? r.raw : r.eff)), 1);
  const head = kind === "heal"
    ? `<div class="bd-head"><span>Spell</span><span>Effective and overhealing</span><span>Effective</span></div>`
    : `<div class="bd-head"><span>Ability</span><span>Damage per fight</span><span>Share</span></div>`;
  container.innerHTML = head;
  rows.forEach((r, i) => {
    const id = kind + "-d-" + i;
    const btn = el("button", { class: "bd-row", type: "button", "aria-expanded": "false", "aria-controls": id });
    let bar, metaText, num;
    if (kind === "heal") {
      const effW = (r.eff / max) * 100, overW = (r.over / max) * 100;
      bar = `<div class="bar" title="${fmtNum(r.eff)} effective, ${fmtNum(r.over)} overhealing">${effW > 0 ? `<span class="eff" style="width:${effW}%"></span>` : ""}${overW > 0.3 ? `<span class="over" style="width:${overW}%"></span>` : ""}</div>`;
      const dShare = r.direct.eff + r.tick.eff ? r.direct.eff / (r.direct.eff + r.tick.eff) : 0;
      const split = r.direct.raw && r.tick.count ? `, ${fmtPct(dShare)} direct and ${fmtPct(1 - dShare)} over time` : r.tick.count ? ", all over time" : "";
      metaText = `${Math.round(r.casts)} casts, ${fmtPct(r.raw ? r.over / r.raw : 0)} overhealing${split}`;
      num = `${fmtPct(total ? r.eff / total : 0)}<small>${fmtNum(r.eff / fightLen)}/s</small>`;
    } else {
      bar = `<div class="bar"><span class="dmg" style="width:${(r.eff / max) * 100}%;background:${schoolPaint(r.school)}"></span></div>`;
      const hits = r.direct.count + r.tick.count;
      metaText = `${esc(r.source)}${r.sources > 1 ? " ×" + r.sources : ""}, ${Math.round(hits)} hits, ${fmtNum(r.eff)} per fight${r.raw > r.eff ? `, ${fmtPct(1 - r.eff / r.raw)} mitigated` : ""}`;
      num = `${fmtPct(total ? r.eff / total : 0)}<small>${fmtNum(r.eff / fightLen)}/s</small>`;
    }
    btn.innerHTML = `
      <span style="min-width:0"><span class="nm"><span class="chev" aria-hidden="true">›</span>${esc(r.label)}${r.school ? `<span class="school">${schoolDot(r.school)}${esc(schoolName(r.school))}</span>` : ""}</span><div class="meta">${metaText}</div></span>
      <span class="barcell">${bar}</span>
      <span class="num">${num}</span>`;
    const detail = el("div", { class: "bd-detail", id });
    // Damage taken: "total" is before armor/versatility/absorbs, "actual" is what landed, so the gap was mitigated.
    const lossCells = p => kind === "heal"
      ? `<td>${fmtPct(p.crit / p.count)}</td><td>${fmtPct(p.raw ? 1 - p.eff / p.raw : 0)}</td>`
      : `<td>${p.raw > p.eff ? `${fmtPct(1 - p.eff / p.raw, 1)} <span class="faint">(${fmtNum(p.raw - p.eff)})</span>` : "–"}</td>`;
    // A pure HoT (Wild Growth) records its application as a 0-amount direct "hit": skip that row, casts are above.
    const line = (lab, p) => p.count && p.raw > 0 ? `<tr><td>${lab}</td><td>${Math.round(p.count)}</td><td>${fmtNum(p.eff / p.count)}</td>${lossCells(p)}<td>${fmtNum(p.eff)}</td></tr>` : "";
    detail.innerHTML = `<table>
      <thead><tr><th></th><th>Count</th><th>Average</th>${kind === "heal" ? "<th>Crit rate</th><th>Overheal</th>" : "<th>Mitigated</th>"}<th>Total</th></tr></thead>
      <tbody>${line(kind === "heal" ? "Direct heal" : "Direct hit", r.direct)}${line(kind === "heal" ? "Over time (ticks)" : "Ticks", r.tick)}</tbody></table>`;
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      detail.classList.toggle("open", !open);
    });
    container.appendChild(btn);
    container.appendChild(detail);
  });
  if (!rows.length) container.innerHTML += `<div class="empty">Nothing to show.</div>`;
}

// ----- healing + damage sections
const healSec = el("section", { id: "healing" });
healSec.innerHTML = `
  <div class="section-head">
    <h2>Where your healing went</h2>
    <p>Each spell's effective healing (solid) and overhealing (pale). Click a spell to split direct heals from heal-over-time ticks.</p>
  </div>
  <div class="panel breakdown" id="healBd"></div>`;
app.appendChild(healSec);
if ($("#activity")) app.insertBefore($("#activity"), healSec);

breakdown($("#healBd"), healStats, "heal", totalEff);

const dmgSec = el("section", { id: "damage" });
dmgSec.innerHTML = `
  <div class="section-head">
    <h2>What hurt${raidMembers.length ? " the raid" : ""}</h2>
    <p>Damage dealt by ${esc(bossName)} and its adds${raidMembers.length ? ` to all ${raidMembers.length + 1} players` : ""}, per fight, coloured by spell school. Abilities shared by several adds are combined.</p>
    <div class="school-legend">${[...new Set(dmgStats.map(d => d.school).filter(Boolean))]
      .map(s => `<span><i style="background:${schoolPaint(s)}"></i>${esc(schoolName(s))}</span>`).join("")}</div>
  </div>
  <div class="panel breakdown" id="dmgBd"></div>`;
app.appendChild(dmgSec);
breakdown($("#dmgBd"), dmgStats, "dmg", totalDmg);

// ----- the raid
if (raidMembers.length) {
  // Across all fights: when members died and how much they took.
  const rows = raidMembers.map(p => {
    const c = p.collected_data || {};
    const fights = c.fight_length?.count || fightsRun;
    const deaths = c.deaths?.count || 0;
    return { taken: mean(c.dtps), healed: mean(c.heal_taken), alive: mean(c.fight_length),
      deathRate: Math.min(1, deaths / fights), deathTime: deaths ? mean(c.deaths) : null };
  });
  const avg = k => sum(rows.map(r => r[k] || 0)) / rows.length;
  const deathTimes = rows.filter(r => r.deathTime != null).map(r => r.deathTime).sort((a, b) => a - b);

  const frames = cd.raid_frames || null;
  $("#nav").insertBefore(el("a", { href: "#raid" }, "Raid"), $('#nav a[href="#mana"]') || null);
  const raidSec = el("section", { id: "raid" });
  raidSec.innerHTML = `
    <div class="section-head">
      <h2>The raid</h2>
      <p>${frames ? "Raid frames from one sample fight. Click a death, or drag the timeline, to see everyone's health and your HoTs and buffs at that moment. Hover a frame for details." : "Turn on raid_frames=1 for your character to see raid frames here."}</p>
    </div>
    <div class="panel verdict" style="margin-top:0">
      <p class="lead">${deathTimes.length
        ? `Across all fights the first raid member died at <b>${fmtTime(deathTimes[0])}</b> on average, and members died in <b>${fmtPct(avg("deathRate"))}</b> of fights.`
        : "No raid member died in any fight."}
        Each took <b>${fmtNum(avg("taken"))}</b> damage and received <b>${fmtNum(avg("healed"))}</b> healing per fight.</p>
      <div class="stats">
        <div class="stat"><div class="label">Raid size</div><div class="value">${rows.length + 1}</div><div class="note">you and ${rows.length} others</div></div>
        <div class="stat"><div class="label">Average time alive</div><div class="value">${fmtTime(avg("alive"))}</div><div class="note">per member</div></div>
        <div class="stat"><div class="label">Healing they received</div><div class="value heal">${fmtNum(sum(rows.map(r => r.healed || 0)))}</div><div class="note">per fight, all members</div></div>
      </div>
    </div>
    ${frames ? `<div class="panel rf-panel" style="margin-top:20px">
      <div class="rf-bar">
        <h3>Deaths in the sample fight</h3>
        <div class="rf-deaths" id="rfDeaths"></div>
      </div>
      <div class="rf-bar rf-scrubrow">
        <span class="rf-time" id="rfTime"></span>
        <input type="range" id="rfScrub" min="0" value="0" aria-label="Time in the sample fight">
      </div>
      <div class="rf-sum" id="rfSum" aria-live="polite"></div>
      <div id="rfGroups"></div>
    </div>` : ""}`;
  app.appendChild(raidSec);

  if (frames) {
    // Stand-ins are named after their spec ("Protection_Warrior"); the class in that name, or the healer's own
    // specialization, picks the in-game class colour for the name.
    const CLASS_COLORS = { "Death Knight": "#c41e3a", "Demon Hunter": "#a330c9", Druid: "#ff7c0a", Evoker: "#33937f",
      Hunter: "#aad372", Mage: "#3fc7eb", Monk: "#00ff98", Paladin: "#f48cba", Priest: "#ffffff", Rogue: "#fff468",
      Shaman: "#0070dd", Warlock: "#8788ee", Warrior: "#c69b6d" };
    const classOf = text => Object.keys(CLASS_COLORS).find(c => text.includes(c)) || null;  // "Demon Hunter" before "Hunter"
    const units = frames.units.map((u, i) => {
      const self = u.name === healer.name;
      const label = self ? u.name : prettyName(u.name);
      const cls = classOf(self ? prettyName(healer.specialization || "") : label);
      return { ...u, i, self, label, cls, color: cls ? CLASS_COLORS[cls] : "#ffffff" };
    });
    const groupOf = u => u.role === "tank" ? "Tank" : u.role === "heal" ? "Healer" : "DPS";
    // One raid frame: tanks, then healers (you first), then DPS.
    const rank = u => (u.role === "tank" ? 0 : u.role === "heal" ? (u.self ? 1 : 2) : 3);
    const ordered = units.slice().sort((a, b) => rank(a) - rank(b) || a.i - b.i);

    // Order snapshots by time; a death snapshot sorts right after the periodic one at the same time.
    const snaps = frames.snapshots.map((s, idx) => ({ ...s, idx })).sort((a, b) => a.time - b.time || a.idx - b.idx);
    const posOf = idx => snaps.findIndex(s => s.idx === idx);
    const deaths = frames.deaths.map(d => ({ ...d, unit: units.find(u => u.name === d.name) }));

    // Only healing HoTs are shown, as squares in the HoT's colour with the seconds left (rounded down).
    const HOT_COLORS = { regrowth: "#2e9e4f", rejuvenation: "#8e5bd9", germination: "#c06ad8", rejuvenation_germination: "#c06ad8",
      lifebloom: "#59c94a", wild_growth: "#22a6a0", cenarion_ward: "#c9922e", spring_blossoms: "#d0628f",
      adaptive_swarm: "#b8a234", rune_of_unleashed_fire_heal_lingering: "#de6a2a",
      reversion: "#d9a62e", reversion_echo: "#a8853a", dream_breath_heal: "#3fb27f", dream_breath_echo: "#2f8a64" };
    const FALLBACK = ["#3f8fd2", "#c7b03a", "#d45a7a", "#5bb7c9", "#9a7b4f"];
    const hotColor = n => HOT_COLORS[n] || FALLBACK[[...n].reduce((h, c) => h + c.charCodeAt(0), 0) % FALLBACK.length];
    const HOT_LABELS = { rune_of_unleashed_fire_heal_lingering: "Unleashed Fire (rune)", rejuvenation_germination: "Germination",
      reversion_echo: "Reversion (Echo)", dream_breath_heal: "Dream Breath", dream_breath_echo: "Dream Breath (Echo)" };
    const hotLabel = n => HOT_LABELS[n] || prettyName(n);
    // You get a mana bar under your frame (stand-ins don't cast, so theirs would never move).
    const hasMana = u => u.self && (u.max_mana || 0) > 0;
    const manaPct = (s, u) => Math.max(0, Math.min(1, (s.mana?.[u.i] || 0) / (u.max_mana || 1)));
    // HoTs end on death; never show any on a dead unit.
    const effectsOf = (s, u) => (s.alive[u.i] ? (s.effects[u.i] || []).filter(e => e.hot) : []);
    // Squares on the frames only for the HoTs you track by eye (per healer class); hovering a frame lists all of them.
    const SQUARE_HOTS_BY_CLASS = {
      Druid: ["lifebloom", "regrowth", "rejuvenation", "germination", "rejuvenation_germination"],
      Evoker: ["reversion", "reversion_echo", "dream_breath_heal", "dream_breath_echo"],
    };
    const healerClass = Object.keys(SQUARE_HOTS_BY_CLASS).find(c => specLabel.includes(c));
    const SQUARE_HOTS = new Set(SQUARE_HOTS_BY_CLASS[healerClass] || []);
    const squareEffectsOf = (s, u) => effectsOf(s, u).filter(e => SQUARE_HOTS.has(e.name));
    const hotNames = [...new Set(snaps.flatMap(s => s.effects.flatMap(list => (list || []).filter(e => e.hot && SQUARE_HOTS.has(e.name)).map(e => e.name))))];
    const hpColor = p => p > 0.5 ? "var(--heal)" : p > 0.25 ? "var(--c4)" : "var(--dmg)";

    // Deaths on the same displayed second share one square; clicking it shows the moment after the last of them.
    const colorOf = d => d.unit ? d.unit.color : "var(--ink-3)";
    const exactTime = t => Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");
    const deathGroups = [];
    for (const d of deaths) {
      const key = Math.round(d.time);
      let g = deathGroups.find(x => x.key === key);
      if (!g) deathGroups.push(g = { key, deaths: [] });
      g.deaths.push(d);
    }
    for (const g of deathGroups) {
      g.lastPos = Math.max(...g.deaths.map(d => posOf(d.snapshot)));
      // The most common role colours the square when it is selected.
      const counts = {};
      g.deaths.forEach(d => { const c = colorOf(d); counts[c] = (counts[c] || 0) + 1; });
      g.color = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    }
    const causeSummary = list => {
      const by = {};
      list.forEach(d => { const k = d.ability ? prettyName(d.ability) : "unknown"; by[k] = (by[k] || 0) + 1; });
      return Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${n} to <b>${esc(k)}</b>`).join(", ");
    };

    $("#rfDeaths").innerHTML = deathGroups.length ? deathGroups.map((g, k) => `
      <button type="button" class="rf-death" data-g="${k}" style="--rc:${g.color}">
        <span class="roles">${g.deaths.map(d => `<i style="background:${colorOf(d)}"></i>`).join("")}</span>
        <span class="t">${fmtTime(g.key)}</span>
        <span class="n">${g.deaths.length > 1 ? g.deaths.length + " deaths" : esc(g.deaths[0].unit ? g.deaths[0].unit.label : g.deaths[0].name)}</span>
      </button>`).join("") : '<span class="faint">Nobody died in this fight.</span>';

    if (hotNames.length)
      $("#rfGroups").insertAdjacentHTML("beforebegin", `<div class="legend rf-legend">${hotNames.map(n =>
        `<span><i style="background:${hotColor(n)}"></i>${esc(hotLabel(n))}</span>`).join("")}<span class="faint">Number: seconds left · hover a frame for all your HoTs</span></div>`);

    const scrub = $("#rfScrub");
    scrub.max = String(snaps.length - 1);

    // group: the death square that was clicked, so all of its deaths are highlighted.
    function render(pos, group = null) {
      const s = snaps[pos];
      scrub.value = String(pos);
      // Death snapshots fall between whole seconds, so show tenths there.
      $("#rfTime").textContent = Number.isInteger(s.time) ? fmtTime(s.time)
        : Math.floor(s.time / 60) + ":" + (s.time % 60).toFixed(1).padStart(4, "0");
      const alive = s.alive.filter(Boolean).length;
      const pct = sum(units.map(u => s.alive[u.i] ? s.health[u.i] / (u.max_health || 1) : 0)) / units.length;
      // A clicked square highlights all its deaths; scrubbing highlights the death whose snapshot this is.
      const dyingHere = group ? group.deaths : deaths.filter(d => posOf(d.snapshot) === pos);
      const dyingNames = dyingHere.map(d => d.name);
      let died = "";
      if (dyingHere.length === 1) {
        const d = dyingHere[0];
        died = ` · <span class="rf-died">${esc(d.unit ? d.unit.label : d.name)} died${d.ability
          ? ` to <b>${esc(prettyName(d.ability))}</b> (${fmtNum(d.amount)})` : ""}</span>`;
      } else if (dyingHere.length > 1) {
        died = ` · <span class="rf-died">${dyingHere.length} died: ${causeSummary(dyingHere)}</span>`;
      }
      $("#rfSum").innerHTML = `<b>${alive}/${units.length}</b> alive, raid health <b>${fmtPct(pct)}</b>` + died;
      raidSec.querySelectorAll(".rf-death").forEach(b => {
        const g = deathGroups[+b.dataset.g];
        b.setAttribute("aria-pressed", String(group ? g === group : g.deaths.some(d => posOf(d.snapshot) === pos)));
      });

      // Update the existing frames in place: rebuilding them on every slider step made the panel jitter,
      // restarted the DIED pulse and dropped the hover tooltip.
      current = s;
      for (const t of tiles) {
        const u = t.u, alive = !!s.alive[u.i];
        const hp = alive ? s.health[u.i] / (u.max_health || 1) : 0;
        const ab = Math.min(1 - hp, (s.absorb[u.i] || 0) / (u.max_health || 1));
        const dying = dyingNames.includes(u.name);
        t.node.classList.toggle("dead", !alive);
        t.node.classList.toggle("dying", dying);
        t.died.hidden = !dying;
        t.hp.style.width = (hp * 100).toFixed(1) + "%";
        t.hp.style.background = hpColor(hp);
        t.abs.hidden = !(ab > 0);
        if (ab > 0) { t.abs.style.left = (hp * 100).toFixed(1) + "%"; t.abs.style.width = (ab * 100).toFixed(1) + "%"; }
        t.pct.textContent = alive ? fmtPct(hp) : "Dead";
        if (t.mana) {
          const mp = alive ? manaPct(s, u) : 0;
          t.mana.style.width = (mp * 100).toFixed(1) + "%";
          t.mana.classList.toggle("low", mp < 0.05);
        }
        const fx = squareEffectsOf(s, u).map(e => `<i style="background:${hotColor(e.name)}">${e.remains >= 0 ? Math.floor(e.remains) : ""}</i>`).join("");
        if (t.fxHtml !== fx) { t.fx.innerHTML = fx; t.fxHtml = fx; }
      }
      if (tipUnit) showUnitTip(tipUnit, tipX, tipY);
    }

    // Frames are built once; render() only updates them.
    $("#rfGroups").innerHTML = `<div class="rf-grid">${ordered.map(u => `
          <div class="uf${u.self ? " self" : ""}${hasMana(u) ? " has-mana" : ""}" data-u="${u.i}" tabindex="0">
            <span class="uf-died" hidden>DIED</span>
            <div class="uf-hp"></div><div class="uf-abs" hidden></div>
            <div class="uf-name" style="color:${u.color}">${esc(u.label)}</div><div class="uf-pct"></div><div class="uf-fx"></div>
            ${hasMana(u) ? '<div class="uf-mana"><div class="uf-mana-fill"></div></div>' : ""}
          </div>`).join("")}</div>`;
    let current = null, tipUnit = null, tipX = 0, tipY = 0;
    const tiles = units.map(u => {
      const node = $(`.uf[data-u="${u.i}"]`, $("#rfGroups"));
      return { u, node, hp: $(".uf-hp", node), abs: $(".uf-abs", node), pct: $(".uf-pct", node), fx: $(".uf-fx", node),
        died: $(".uf-died", node), mana: $(".uf-mana-fill", node), fxHtml: null };
    });
    function showUnitTip(u, x, y) {
      const s = current, fx = effectsOf(s, u);
      showTip(`<div class="t-head"><span style="color:${u.color}">${esc(u.label)}</span> <span class="faint">(${groupOf(u)}${u.self ? ", you" : ""})</span></div>
        <div class="t-row"><span>Health</span><span>${s.alive[u.i] ? fmtNum(s.health[u.i]) + " / " + fmtNum(u.max_health) : "Dead"}</span></div>
        ${hasMana(u) && s.alive[u.i] ? `<div class="t-row"><span><i class="sw" style="background:#2f7fe0"></i>Mana</span><span>${fmtPct(manaPct(s, u))} (${fmtNum(s.mana[u.i])})</span></div>` : ""}
        ${s.absorb[u.i] ? `<div class="t-row"><span>Absorb</span><span>${fmtNum(s.absorb[u.i])}</span></div>` : ""}
        ${fx.length ? fx.map(e => `<div class="t-row"><span><i class="sw" style="background:${hotColor(e.name)}"></i>${esc(hotLabel(e.name))}${e.stacks > 1 ? " ×" + e.stacks : ""}</span><span>${e.remains >= 0 ? e.remains.toFixed(1) + "s" : "∞"}</span></div>`).join("")
          : `<div class="t-row"><span class="faint">${s.alive[u.i] ? "None of your HoTs" : "Dead"}</span><span></span></div>`}`, x, y);
    }
    for (const t of tiles) {
      t.node.addEventListener("pointermove", ev => { tipUnit = t.u; tipX = ev.clientX; tipY = ev.clientY; showUnitTip(t.u, tipX, tipY); });
      t.node.addEventListener("pointerleave", () => { tipUnit = null; hideTip(); });
      t.node.addEventListener("focus", () => { const r = t.node.getBoundingClientRect(); tipUnit = t.u; tipX = r.right; tipY = r.top; showUnitTip(t.u, tipX, tipY); });
      t.node.addEventListener("blur", () => { tipUnit = null; hideTip(); });
    }

    raidSec.querySelectorAll(".rf-death").forEach(b => {
      const g = deathGroups[+b.dataset.g];
      b.addEventListener("click", () => render(g.lastPos, g));
      b.addEventListener("pointermove", ev => showTip(`<div class="t-head">${g.deaths.length > 1
          ? `${g.deaths.length} deaths at ${fmtTime(g.key)}` : `${esc(g.deaths[0].unit ? g.deaths[0].unit.label : g.deaths[0].name)} died at ${exactTime(g.deaths[0].time)}`}</div>
        ${g.deaths.map(d => `<div class="t-row"><span><i class="sw" style="background:${colorOf(d)}"></i>${esc(d.unit ? d.unit.label : d.name)}
          <span class="faint">${exactTime(d.time)}</span></span><span>${d.ability ? `${esc(prettyName(d.ability))} ${fmtNum(d.amount)}` : "–"}</span></div>`).join("")}
        ${g.deaths.length === 1 && g.deaths[0].source ? `<div class="t-row"><span>From</span><span>${esc(sourceLabel(g.deaths[0].source))}</span></div>` : ""}`,
        ev.clientX, ev.clientY));
      b.addEventListener("pointerleave", hideTip);
    });
    scrub.addEventListener("input", () => render(+scrub.value));
    render(deathGroups.length ? deathGroups[0].lastPos : snaps.length - 1, deathGroups[0] || null);
  }
}

// ----- mana & buffs
const manaSec = el("section", { id: "mana" });
// SimC reports buff uptime as a percentage (0-100).
const buffs = (healer.buffs || []).map(b => ({ name: b.spell_name || prettyName(b.name), up: (b.uptime ?? 0) / 100 }))
  .filter(b => b.up > 0.005).sort((a, b) => b.up - a.up).slice(0, 14);
manaSec.innerHTML = `
  <div class="section-head">
    <h2>Mana and buffs</h2>
    <p>Mana over the fight, and how much of the fight each of your buffs was active.</p>
  </div>
  <div class="two-col">
    <div class="panel chart-panel"><div class="chart-title"><h3>Mana, one sample fight</h3>
      <div class="legend"><span><i class="line" style="background:var(--mana)"></i>Mana</span></div></div>
      <div class="chart" id="manaChart"></div></div>
    <div class="panel"><div class="chart-title" style="padding:18px 20px 0"><h3>Buff uptime</h3></div>
      <div class="uptimes">${buffs.length ? buffs.map(b => `<div class="up"><span>${esc(b.name)}</span><div class="track"><div class="fill" style="width:${(b.up * 100).toFixed(1)}%"></div></div><span class="pct">${fmtPct(b.up)}</span></div>`).join("") : '<p class="muted">No buff data in this report.</p>'}</div>
    </div>
  </div>`;
app.appendChild(manaSec);
// Your mana in the sample fight, from the mana recorded with every cast, until your last action.
// (The averaged timeline sinks towards zero in fights where you died early, so it would mislead here.)
if (maxMana && healerSeq.length) {
  const last = Math.ceil(Math.max(...healerSeq.map(e => e.time)));
  const values = [];
  let k = 0, cur = 100;
  for (let t = 0; t <= last; t++) {
    while (k < healerSeq.length && healerSeq[k].time <= t) { cur = (healerSeq[k].resources?.mana ?? 0) / maxMana * 100; k++; }
    values.push(cur);
  }
  timeChart($("#manaChart"), [{ height: 200, length: values.length, yMax: 100, yTicks: [0, 50, 100], yFormat: v => Math.round(v) + "%",
    series: [{ name: "Mana", values, color: color("--mana"), kind: "area", opacity: 0.14 }] }],
    { label: "Mana over time", length: values.length - 1 });
} else $("#manaChart").innerHTML = '<p class="empty">No mana data in this report.</p>';

// ----- details
const detSec = el("section", { id: "details" });
detSec.innerHTML = `
  <div class="section-head"><h2>Details</h2></div>
  <details class="panel"><summary>Gear</summary><div class="detail-body"><table class="gear">${gearList.map(([slot, g]) => `<tr><td>${esc(slot.replace(/_/g, " "))}</td><td>${esc(prettyName(g.name))}</td><td>${g.ilevel || ""}</td></tr>`).join("")}</table></div></details>
  <details class="panel"><summary>Talents</summary><div class="detail-body"><code class="block">${esc(healer.talents || "")}</code></div></details>
  <details class="panel"><summary>Simulation settings</summary><div class="detail-body"><table class="gear">
    ${sim.options?.encounter ? `<tr><td>Encounter</td><td>${esc(bossTitle)}</td><td></td></tr>` : ""}
    <tr><td>Fights simulated</td><td>${iterations.toLocaleString()}</td><td></td></tr>
    <tr><td>Max fight length</td><td>${fmtTime(sim.options?.max_time || fightLen)}</td><td></td></tr>
    <tr><td>Length varies</td><td>${sim.options?.vary_combat_length ? "Yes, by " + fmtPct(sim.options.vary_combat_length) : "No"}</td><td></td></tr>
    <tr><td>SimC version</td><td>${esc(data.version || "")}</td><td></td></tr>
    <tr><td>Game data</td><td>${esc(sim.options?.dbc?.[sim.options?.dbc?.version_used]?.wow_version || "")}</td><td></td></tr>
  </table></div></details>
  <p class="footer">Generated from SimulationCraft JSON${data.timestamp ? " on " + new Date(data.timestamp * 1000).toLocaleString() : ""}.</p>`;
app.appendChild(detSec);

// ----- nav highlight
const links = [...document.querySelectorAll("#nav a")];
const obs = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  }
}, { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section[id]").forEach(s => obs.observe(s));
})();
</script>
